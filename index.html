function toggleAllExp(group,state){
  const selMap={status:'.exp-status',supplier:'.exp-supplier',col:'.exp-col'};
  document.querySelectorAll(selMap[group]).forEach(cb=>{
    cb.checked=state;
    if(group==='status'){
      const lbl=document.getElementById('exp-status-label-'+cb.value);
      if(lbl){lbl.style.borderColor=state?'var(--orange)':'var(--gray200)';lbl.style.background=state?'var(--orange-light)':'#fff';}
    } else if(group==='supplier'){
      const lbl=document.getElementById('exp-sup-label-'+cb.value);
      if(lbl){lbl.style.borderColor=state?'var(--orange)':'var(--gray200)';lbl.style.background=state?'var(--orange-light)':'#fff';}
    } else {
      const lbl=document.getElementById(cb.id+'-label');
      if(lbl){lbl.style.borderColor=state?'var(--blue)':'var(--gray200)';lbl.style.background=state?'var(--blue-light)':'#fff';}
    }
  });
  updateExportCount();
}

function updateExportCount(){
  const selStatus=[...document.querySelectorAll('.exp-status:checked')].map(c=>c.value);
  const selSup=[...document.querySelectorAll('.exp-supplier:checked')].map(c=>+c.value);
  const from=document.getElementById('exp-date-from')?.value||'';
  const to=document.getElementById('exp-date-to')?.value||'';
  const orders=db.all('orders').filter(o=>{
    if(selStatus.length&&!selStatus.includes(o.status))return false;
    if(selSup.length&&!selSup.includes(o.supplier_id))return false;
    if(from&&o.date<from)return false;
    if(to&&o.date>to)return false;
    return true;
  });
  const el=document.getElementById('exp-count-info');
  if(el){
    const ttc=orders.reduce((s,o)=>s+bcTTC(o),0);
    el.innerHTML=orders.length>0
      ?`📊 <strong>${orders.length} BC</strong> sélectionné(s) · Total TTC : <strong style="color:var(--orange)">${fmt.money(ttc)}</strong>`
      :`<span style="color:var(--red)">⚠ Aucun BC ne correspond aux filtres</span>`;
  }
}

function runExportBC(){
  const selStatus=[...document.querySelectorAll('.exp-status:checked')].map(c=>c.value);
  const selSup=[...document.querySelectorAll('.exp-supplier:checked')].map(c=>+c.value);
  const from=document.getElementById('exp-date-from')?.value||'';
  const to=document.getElementById('exp-date-to')?.value||'';
  const statusLabels={draft:'Brouillon',sent:'Envoyé',partial:'Partiel',delivered:'Livré',closed:'Clôturé',cancelled:'Annulé'};
  const lineStatusLabels={pending:'En attente',ordered:'Commandé',partial:'Partiel',delivered:'Livré',cancelled:'Annulé'};

  const col=id=>document.getElementById(id)?.checked;

  const orders=db.all('orders').filter(o=>{
    if(selStatus.length&&!selStatus.includes(o.status))return false;
    if(selSup.length&&!selSup.includes(o.supplier_id))return false;
    if(from&&o.date<from)return false;
    if(to&&o.date>to)return false;
    return true;
  });

  if(!orders.length){showAlert('Aucun BC à exporter','error');return;}

  const wb=XLSX.utils.book_new();

  // ── SHEET 1 : Récapitulatif BC ──
  const summaryData=orders.map(o=>{
    const sup=db.find('suppliers',o.supplier_id)||{};
    const pay=db.all('payments').filter(p=>p.bc_id===o.id);
    const del=db.all('deliveries').filter(d=>d.bc_id===o.id);
    const row={};
    if(col('col-num'))row['N° BC']=o.numero;
    if(col('col-date'))row['Date']=fmt.date(o.date);
    if(col('col-sup'))row['Fournisseur']=sup.name||'';
    if(col('col-contact'))row['Contact']=sup.contact||'';
    if(col('col-email'))row['Email']=sup.email||'';
    if(col('col-phone'))row['Téléphone']=sup.phone||'';
    if(col('col-status'))row['Statut']=statusLabels[o.status]||o.status;
    if(col('col-conditions'))row['Conditions']=o.conditions||'';
    if(col('col-lieu'))row['Lieu livraison']=o.lieu||'';
    if(col('col-ht'))row['Total HT (F CFA)']=Math.round(bcTotal(o));
    if(col('col-tva'))row['TVA (F CFA)']=Math.round(bcTVA(o));
    if(col('col-ttc'))row['Total TTC (F CFA)']=Math.round(bcTTC(o));
    if(col('col-notes'))row['Notes']=o.notes||'';
    if(col('col-payment')){
      row['Statut paiement']=pay.length?({pending:'En attente',paid:'Payé',late:'En retard'}[pay[0].status]||''):'';
      row['Montant réglé (F CFA)']=pay.filter(p=>p.status==='paid').reduce((s,p)=>s+(p.montant||0),0);
      row['Restant dû (F CFA)']=pay.filter(p=>p.status!=='paid').reduce((s,p)=>s+(p.montant||0),0);
      row['Échéance paiement']=pay.length?fmt.date(pay[0].date_echeance):'';
    }
    if(col('col-delivery')){
      row['Statut livraison']=del.length?({pending:'En attente',partial:'Partielle',complete:'Complète'}[del[0].status]||''):'';
    }
    return row;
  });

  const ws1=XLSX.utils.json_to_sheet(summaryData);

  // Style header row
  const range=XLSX.utils.decode_range(ws1['!ref']);
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r:0,c});
    if(!ws1[addr])continue;
    ws1[addr].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'F97316'}},alignment:{horizontal:'center'}};
  }

  // Auto column width
  const colWidths=summaryData.length?Object.keys(summaryData[0]).map(k=>({wch:Math.max(k.length+2,12)})):[];
  ws1['!cols']=colWidths;
  XLSX.utils.book_append_sheet(wb,ws1,'Récapitulatif BC');

  // ── SHEET 2 : Lignes de commande (si coché) ──
  if(col('col-lines')){
    const linesData=[];
    orders.forEach(o=>{
      const sup=db.find('suppliers',o.supplier_id)||{};
      (o.lines||[]).forEach((l,i)=>{
        const art=db.find('articles',l.article_id)||{};
        linesData.push({
          'N° BC':o.numero,
          'Date':fmt.date(o.date),
          'Fournisseur':sup.name||'',
          'Statut BC':statusLabels[o.status]||o.status,
          '#':i+1,
          'Référence':art.ref||'',
          'Désignation':l.designation||art.designation||'',
          'Unité':art.unite||'',
          'Quantité':l.qty,
          'Prix unitaire HT':l.prix||0,
          'TVA (%)':l.tva||18,
          'Total HT (F CFA)':Math.round(l.qty*(l.prix||0)),
          'Total TTC (F CFA)':Math.round(l.qty*(l.prix||0)*(1+(l.tva||18)/100)),
          'Statut livraison':lineStatusLabels[l.line_status||'pending']||''
        });
      });
    });
    if(linesData.length){
      const ws2=XLSX.utils.json_to_sheet(linesData);
      const r2=XLSX.utils.decode_range(ws2['!ref']);
      for(let c=r2.s.c;c<=r2.e.c;c++){
        const addr=XLSX.utils.encode_cell({r:0,c});
        if(!ws2[addr])continue;
        ws2[addr].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'0F172A'}},alignment:{horizontal:'center'}};
      }
      ws2['!cols']=Object.keys(linesData[0]).map(k=>({wch:Math.max(k.length+2,10)}));
      XLSX.utils.book_append_sheet(wb,ws2,'Lignes de commande');
    }
  }

  const filename=`BC_export_${fmt.today()}.xlsx`;
  XLSX.writeFile(wb,filename);
  closeModal();
  showAlert(`${orders.length} BC exportés avec succès`);
}


// ═══════════════════════════════════════════════
//  ANALYSES
// ═══════════════════════════════════════════════
let analysisTab='suppliers'; // 'suppliers' | 'articles'
let analysisPeriod='all';
let analysisSortSupCol='ttc'; let analysisSortSupDir=-1;
let analysisSortArtCol='ttc'; let analysisSortArtDir=-1;

function sortAnalysisSup(col){
  if(analysisSortSupCol===col)analysisSortSupDir*=-1;
  else{analysisSortSupCol=col;analysisSortSupDir=-1;}
  renderAnalyses();
}
function sortAnalysisArt(col){
  if(analysisSortArtCol===col)analysisSortArtDir*=-1;
  else{analysisSortArtCol=col;analysisSortArtDir=-1;}
  renderAnalyses();
}

function _ath(col,label,isArt){
  const sc=isArt?analysisSortArtCol:analysisSortSupCol;
  const sd=isArt?analysisSortArtDir:analysisSortSupDir;
  const fn=isArt?'sortAnalysisArt':'sortAnalysisSup';
  const active=sc===col;
  const arrow=active?(sd===1?'▲':'▼'):'⇅';
  return `<th style="cursor:pointer;user-select:none" onclick="${fn}('${col}')">${label} <span style="opacity:${active?1:.3};font-size:10px">${arrow}</span></th>`;
}

function renderAnalyses(){
  const orders=db.all('orders');
  const suppliers=db.all('suppliers');
  const articles=db.all('articles');
  const payments=db.all('payments');

  // Period filter
  let fromDate=null;
  const now=new Date();
  if(analysisPeriod==='month'){fromDate=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);}
  else if(analysisPeriod==='quarter'){const q=Math.floor(now.getMonth()/3);fromDate=new Date(now.getFullYear(),q*3,1).toISOString().slice(0,10);}
  else if(analysisPeriod==='year'){fromDate=new Date(now.getFullYear(),0,1).toISOString().slice(0,10);}

  const filteredOrders=orders.filter(o=>!fromDate||o.date>=fromDate);
  const totalHT=filteredOrders.reduce((s,o)=>s+bcTotal(o),0);
  const totalTTC=filteredOrders.reduce((s,o)=>s+bcTTC(o),0);

  // ── BY SUPPLIER ──
  const supMap={};
  filteredOrders.forEach(o=>{
    const sid=o.supplier_id||0;
    if(!supMap[sid])supMap[sid]={supplier_id:sid,nb_bc:0,ht:0,tva:0,ttc:0,paid:0,unpaid:0,bcs:[]};
    supMap[sid].nb_bc++;
    supMap[sid].ht+=bcTotal(o);
    supMap[sid].tva+=bcTVA(o);
    supMap[sid].ttc+=bcTTC(o);
    supMap[sid].bcs.push(o);
    const pay=payments.filter(p=>p.bc_id===o.id);
    pay.forEach(p=>{
      if(p.status==='paid')supMap[sid].paid+=p.montant||0;
      else supMap[sid].unpaid+=p.montant||0;
    });
  });
  let supRows=Object.values(supMap);
  supRows.sort((a,b)=>{
    let va,vb;
    const col=analysisSortSupCol;
    if(col==='name'){va=(db.find('suppliers',a.supplier_id)||{name:'–'}).name;vb=(db.find('suppliers',b.supplier_id)||{name:'–'}).name;}
    else if(col==='nb'){{va=a.nb_bc;vb=b.nb_bc;}}
    else if(col==='ht'){{va=a.ht;vb=b.ht;}}
    else{va=a.ttc;vb=b.ttc;}
    return va<vb?analysisSortSupDir:va>vb?-analysisSortSupDir:0;
  });

  // ── BY ARTICLE ──
  const artMap={};
  filteredOrders.forEach(o=>{
    const sup=db.find('suppliers',o.supplier_id);
    (o.lines||[]).forEach(l=>{
      const aid=l.article_id||('free_'+l.designation);
      if(!artMap[aid])artMap[aid]={
        article_id:l.article_id,designation:l.designation,ref:'',unite:'',
        nb_cmd:0,qty_total:0,ht:0,ttc:0,
        prix_list:[],prix_min:null,prix_max:null,prix_moy:0,
        bc_list:[],orders:new Set()
      };
      artMap[aid].nb_cmd++;
      artMap[aid].qty_total+=l.qty;
      artMap[aid].ht+=l.qty*(l.prix||0);
      artMap[aid].ttc+=l.qty*(l.prix||0)*(1+(l.tva||18)/100);
      artMap[aid].orders.add(o.id);
      if(l.prix>0){
        artMap[aid].prix_list.push(l.prix);
        if(artMap[aid].prix_min===null||l.prix<artMap[aid].prix_min)artMap[aid].prix_min=l.prix;
        if(artMap[aid].prix_max===null||l.prix>artMap[aid].prix_max)artMap[aid].prix_max=l.prix;
      }
      artMap[aid].bc_list.push({
        bc_id:o.id,numero:o.numero,date:o.date,
        fournisseur:sup?sup.name:'–',
        fournisseur_id:sup?sup.fournisseur_id||'':'',
        conditions:o.conditions||'',
        qty:l.qty,prix:l.prix,
        status:o.status
      });
      const art=db.find('articles',l.article_id);
      if(art){artMap[aid].ref=art.ref||'';artMap[aid].unite=art.unite||'';}
    });
  });
  // Compute prix moyen
  Object.values(artMap).forEach(r=>{
    if(r.prix_list.length)r.prix_moy=r.prix_list.reduce((a,b)=>a+b,0)/r.prix_list.length;
  });
  let artRows=Object.values(artMap);
  artRows.sort((a,b)=>{
    let va,vb;
    const col=analysisSortArtCol;
    if(col==='designation'){va=a.designation;vb=b.designation;}
    else if(col==='qty'){va=a.qty_total;vb=b.qty_total;}
    else if(col==='ht'){va=a.ht;vb=b.ht;}
    else if(col==='prix_moy'){va=a.prix_moy;vb=b.prix_moy;}
    else{va=a.ttc;vb=b.ttc;}
    return va<vb?analysisSortArtDir:va>vb?-analysisSortArtDir:0;
  });

  const pLabels={all:'Toute la période',month:'Ce mois',quarter:'Ce trimestre',year:'Cette année'};

  document.getElementById('content').innerHTML=`
  <!-- KPIs -->
  <div class="stats-grid" style="margin-bottom:20px">
    <div class="stat-card orange">
      <div class="stat-label">Commandes (${pLabels[analysisPeriod]})</div>
      <div class="stat-value">${filteredOrders.length}</div>
      <div class="stat-sub">${suppliers.length} fournisseurs actifs</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">Total HT</div>
      <div class="stat-value">${fmt.money(totalHT)}</div>
    </div>
    <div class="stat-card navy" style="border-color:#0f172a">
      <div class="stat-label">Total TTC</div>
      <div class="stat-value">${fmt.money(totalTTC)}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">TVA totale</div>
      <div class="stat-value">${fmt.money(totalTTC-totalHT)}</div>
    </div>
  </div>

  <!-- Controls -->
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
    <div style="display:flex;background:#fff;border:1px solid var(--gray200);border-radius:10px;overflow:hidden">
      ${['suppliers','articles'].map(t=>`
        <button onclick="analysisTab='${t}';renderAnalyses()" style="padding:8px 18px;font-weight:600;font-size:13px;border:none;background:${analysisTab===t?'var(--navy)':'#fff'};color:${analysisTab===t?'#fff':'var(--text2)'};cursor:pointer;transition:all .15s">
          ${t==='suppliers'?'👥 Par fournisseur':'📦 Par article'}
        </button>`).join('')}
    </div>
    <div style="display:flex;background:#fff;border:1px solid var(--gray200);border-radius:10px;overflow:hidden">
      ${['all','month','quarter','year'].map(p=>`
        <button onclick="analysisPeriod='${p}';renderAnalyses()" style="padding:8px 14px;font-size:12px;font-weight:600;border:none;background:${analysisPeriod===p?'var(--orange)':'#fff'};color:${analysisPeriod===p?'#fff':'var(--text2)'};cursor:pointer;transition:all .15s">
          ${pLabels[p]}
        </button>`).join('')}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="exportAnalysis()">⬇ Exporter</button>
  </div>

  <!-- TABLE SUPPLIERS -->
  ${analysisTab==='suppliers'?`
  <div class="card">
    <div class="card-header">
      <span class="card-title">Dépenses par fournisseur</span>
      <span class="text-muted" style="font-size:12px">${supRows.length} fournisseur(s) · ${pLabels[analysisPeriod]}</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${_ath('name','Fournisseur',false)}
          ${_ath('nb','Nb BC',false)}
          <th>Articles commandés</th>
          ${_ath('ht','Total HT',false)}
          <th>TVA</th>
          ${_ath('ttc','Total TTC',false)}
          <th>Part (%)</th>
          <th>Payé</th>
          <th>Restant dû</th>
        </tr></thead>
        <tbody>
          ${supRows.map(r=>{
            const sup=db.find('suppliers',r.supplier_id);
            const pct=totalTTC>0?((r.ttc/totalTTC)*100).toFixed(1):0;
            const artCount=[...new Set(r.bcs.flatMap(o=>(o.lines||[]).map(l=>l.article_id)))].length;
            return `<tr>
              <td><strong>${sup?sup.name:'Sans fournisseur'}</strong>
                ${sup?`<div style="font-size:11px;color:var(--text3)">${sup.email||''}</div>`:''}</td>
              <td class="text-center"><span class="badge badge-orange">${r.nb_bc}</span></td>
              <td class="text-center">${artCount} réf.</td>
              <td class="text-right">${fmt.money(r.ht)}</td>
              <td class="text-right">${fmt.money(r.tva)}</td>
              <td class="text-right"><strong style="color:var(--orange)">${fmt.money(r.ttc)}</strong></td>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="progress-bar-wrap" style="flex:1;min-width:60px"><div class="progress-bar" style="width:${pct}%;background:var(--orange)"></div></div>
                  <span style="font-size:12px;font-weight:700;color:var(--text2);min-width:36px">${pct}%</span>

function ghostResetPassword(){
  const uid=+document.getElementById('ghost-reset-user').value;
  const pwd=document.getElementById('ghost-new-pwd').value.trim();
  if(!uid||!pwd){showAlert('Sélectionnez un utilisateur et saisissez un mot de passe','error');return;}
  const u=db.find('users',uid);
  if(!u)return;
  u.pass=pwd;db.save('users',u);
  document.getElementById('ghost-new-pwd').value='';
  document.getElementById('ghost-reset-user').value='';
  showAlert('Mot de passe de '+u.name+' réinitialisé avec succès');
}

function ghostToggleRole(role){
  const sleeping=db.get('sleeping_roles')||[];
  const idx=sleeping.indexOf(role);
  if(idx>=0)sleeping.splice(idx,1); else sleeping.push(role);
  db.set('sleeping_roles',sleeping);
  renderGhostPanel();
  showAlert('Rôle '+(sleeping.includes(role)?'gelé':'réactivé'));
}

function ghostPurgeNotifications(){
  if(!confirm('Supprimer toutes les notifications ?'))return;
  db.set('notifications',[]);renderGhostPanel();showAlert('Notifications supprimées');
}

function ghostPurgeEvaluations(){
  if(!confirm('Effacer toutes les évaluations fournisseurs ?'))return;
  db.set('evaluations',[]);renderGhostPanel();showAlert('Évaluations supprimées');
}

function ghostExportRaw(){
  const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','notifications','sleeping_roles'];
  const data={};KEYS.forEach(k=>{data[k]=db.get(k)||[];});
  const json=JSON.stringify({exported_by:'FANTOME',date:new Date().toISOString(),data},null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='GC_RAW_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showAlert('Export RAW téléchargé');
}

function exportAnalysis(){
  const orders=db.all('orders');
  const payments=db.all('payments');
  let data,filename;
  if(analysisTab==='suppliers'){
    data=[];
    const supMap={};
    orders.forEach(o=>{
      const sid=o.supplier_id||0;
      if(!supMap[sid])supMap[sid]={supplier_id:sid,nb_bc:0,ht:0,tva:0,ttc:0,paid:0,unpaid:0};
      supMap[sid].nb_bc++;supMap[sid].ht+=bcTotal(o);supMap[sid].tva+=bcTVA(o);supMap[sid].ttc+=bcTTC(o);
      payments.filter(p=>p.bc_id===o.id).forEach(p=>{
        if(p.status==='paid')supMap[sid].paid+=p.montant||0;else supMap[sid].unpaid+=p.montant||0;
      });
    });
    Object.values(supMap).forEach(r=>{
      const sup=db.find('suppliers',r.supplier_id);
      data.push({Fournisseur:sup?sup.name:'–','Nb BC':r.nb_bc,'Total HT':r.ht,'TVA':r.tva,'Total TTC':r.ttc,'Payé':r.paid,'Restant dû':r.unpaid});
    });
    filename='analyse_fournisseurs.xlsx';
  }else{
    const artMap={};
    orders.forEach(o=>{
      (o.lines||[]).forEach(l=>{
        const aid=l.article_id||l.designation;
        if(!artMap[aid])artMap[aid]={designation:l.designation,ref:'',qty:0,ht:0,ttc:0};
        artMap[aid].qty+=l.qty;artMap[aid].ht+=l.qty*(l.prix||0);
        artMap[aid].ttc+=l.qty*(l.prix||0)*(1+(l.tva||18)/100);
        const art=db.find('articles',l.article_id);if(art)artMap[aid].ref=art.ref||'';
      });
    });
    data=Object.values(artMap).map(r=>({Référence:r.ref,Désignation:r.designation,'Qté totale':r.qty,'Total HT':r.ht,'Total TTC':r.ttc}));
    filename='analyse_articles.xlsx';
  }
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Analyse');
  XLSX.writeFile(wb,filename);
  showAlert('Export téléchargé');
}

function saveProfile(){
  const name=document.getElementById('prof-name').value.trim();
  const login=document.getElementById('prof-login').value.trim();
  const oldPass=document.getElementById('prof-pass-old').value;
  const newPass=document.getElementById('prof-pass-new').value;
  const confirmPass=document.getElementById('prof-pass-confirm').value;
  const alertEl=document.getElementById('profile-alert');

  if(!name||!login){
    alertEl.innerHTML='<div class="alert alert-error">Le nom et l\'identifiant sont obligatoires.</div>';return;
  }

  // Check login uniqueness (excluding self)
  const others=db.all('users').filter(u=>u.id!==currentUser.id);
  if(others.find(u=>u.login===login)){
    alertEl.innerHTML='<div class="alert alert-error">Cet identifiant est déjà utilisé.</div>';return;
  }

  // Password change
  let newPasswordToSave=currentUser.pass;
  if(oldPass||newPass||confirmPass){
    if(oldPass!==currentUser.pass){
      alertEl.innerHTML='<div class="alert alert-error">Mot de passe actuel incorrect.</div>';return;
    }
    if(!newPass){
      alertEl.innerHTML='<div class="alert alert-error">Veuillez saisir un nouveau mot de passe.</div>';return;
    }
    if(newPass!==confirmPass){
      alertEl.innerHTML='<div class="alert alert-error">Les mots de passe ne correspondent pas.</div>';return;
    }
    newPasswordToSave=newPass;
  }

  // Save
  const updated={...currentUser,name,login,pass:newPasswordToSave};
  db.save('users',updated);
  currentUser=updated;
  sessionStorage.setItem('gc_session',JSON.stringify(updated));
  renderNav(); // Refresh sidebar avatar & name
  closeModal();
  showAlert('Profil mis à jour avec succès');
}

function toggleRoleSleep(role){
  if(role==='admin')return;
  const sleeping=getSleepingRoles();
  const idx=sleeping.indexOf(role);
  if(idx>=0){
    sleeping.splice(idx,1);
    showAlert(`Rôle ${ROLE_LABELS[role]} réactivé — connexions et actions restaurées`,'success');
  } else {
    sleeping.push(role);
    showAlert(`Rôle ${ROLE_LABELS[role]} mis en sommeil — actions gelées`,'error');
  }
  db.set('sleeping_roles',sleeping);
  renderUsers();
}

function saveUser(id){
  const name=document.getElementById('usr-name').value.trim();
  const login=document.getElementById('usr-login').value.trim();
  const pass=document.getElementById('usr-pass').value;
  const role=document.getElementById('usr-role').value;
  const colorCustom=document.getElementById('usr-color-custom').value;
  if(!name||!login){showAlert('Nom et identifiant sont obligatoires','error');return;}
  if(!id&&!pass){showAlert('Le mot de passe est obligatoire pour un nouvel utilisateur','error');return;}
  // Check login uniqueness
  const existing=db.all('users').find(u=>u.login===login&&u.id!==id);
  if(existing){showAlert('Cet identifiant est déjà utilisé','error');return;}

  const u=id?db.find('users',id):{id:db.nextId('users')};
  u.name=name; u.login=login; u.role=role; u.theme=colorCustom||'#f97316';
  if(pass)u.pass=pass;
  db.save('users',u);

  // If modifying current user, update session and reapply theme
  if(id&&id===currentUser.id){
    currentUser=u;
    sessionStorage.setItem('gc_session',JSON.stringify(u));
    applyUserTheme(u);
    renderNav();
  }
  closeModal();renderUsers();showAlert(id?'Utilisateur mis à jour':'Utilisateur créé');
}

function deleteUser(id){
  if(!confirm('Supprimer cet utilisateur ?'))return;
  db.delete('users',id);renderUsers();showAlert('Utilisateur supprimé');
}

function getNotifications(){
  return (db.get('notifications')||[]).filter(n=>
    n.to_user_id===currentUser.id||
    n.to_role===currentUser.role||
    n.to_role==='all'
  ).sort((a,b)=>b.created_at.localeCompare(a.created_at));
}

function getUnreadCount(){
  return getNotifications().filter(n=>!n.read_by||!n.read_by.includes(currentUser.id)).length;
}

function updateNotifBadge(){
  const count=getUnreadCount();
  const badge=document.getElementById('notif-badge');
  if(!badge)return;
  if(count>0){badge.textContent=count>9?'9+':count;badge.style.display='flex';}
  else{badge.style.display='none';}
}

function toggleNotifPanel(){
  const panel=document.getElementById('notif-panel');
  if(!panel)return;
  const isOpen=panel.style.display==='flex';
  panel.style.display=isOpen?'none':'flex';
  if(!isOpen)renderNotifList();
}

        <span style="font-size:10px;color:var(--text3);white-space:nowrap">${fmt.date(n.created_at.slice(0,10))}</span>
      </div>
      <div style="font-size:13px;color:var(--text2);padding-left:14px;line-height:1.4">${n.message}</div>
      ${n.bc_id?`<div style="padding-left:14px;margin-top:4px"><span onclick="event.stopPropagation();closeNotifPanel();setTimeout(()=>viewOrder(${n.bc_id}),50)" style="font-size:11px;color:var(--orange);font-weight:600;cursor:pointer">📋 Voir le BC →</span></div>`:''}
      ${can('delete')?`<div style="padding-left:14px;margin-top:2px"><span onclick="event.stopPropagation();deleteNotif(${n.id})" style="font-size:10px;color:var(--text3);cursor:pointer">Supprimer</span></div>`:''}
    </div>`;
  }).join('');
  updateNotifBadge();
}

function markRead(id){
  const notifs=db.get('notifications')||[];
  const n=notifs.find(x=>x.id===id);
  if(n){if(!n.read_by)n.read_by=[];if(!n.read_by.includes(currentUser.id))n.read_by.push(currentUser.id);}
  db.set('notifications',notifs);
  renderNotifList();updateNotifBadge();
}

function markAllRead(){
  const notifs=db.get('notifications')||[];
  const mine=getNotifications().map(n=>n.id);
  notifs.forEach(n=>{if(mine.includes(n.id)){if(!n.read_by)n.read_by=[];if(!n.read_by.includes(currentUser.id))n.read_by.push(currentUser.id);}});
  db.set('notifications',notifs);
  renderNotifList();updateNotifBadge();
}

function deleteNotif(id){
  db.set('notifications',(db.get('notifications')||[]).filter(n=>n.id!==id));
  renderNotifList();updateNotifBadge();
}

function sendNotification(bcId){
  const toVal=document.getElementById('notif-to').value;
  const msg=document.getElementById('notif-msg').value.trim();
  if(!msg){showAlert('Écrivez un message','error');return;}
  const notif={
    id:db.nextId('notifications'),
    from_user_id:currentUser.id,
    created_at:new Date().toISOString(),
    message:msg,
    read_by:[],
    bc_id:bcId||null
  };
  if(toVal.startsWith('role:')){notif.to_role=toVal.slice(5);}
  else{notif.to_user_id=+toVal.slice(5);}
  db.save('notifications',notif);
  closeModal();showAlert('Notification envoyée');
  updateNotifBadge();
}

function applyUserTheme(user){
  const color=(user&&user.theme)||'#f97316';
  const hex=color.replace('#','');
  const r=parseInt(hex.slice(0,2),16)||249;
  const g=parseInt(hex.slice(2,4),16)||115;
  const b=parseInt(hex.slice(4,6),16)||22;
  const darker=`rgb(${Math.max(0,r-25)},${Math.max(0,g-25)},${Math.max(0,b-25)})`;
  const light=`rgba(${r},${g},${b},0.10)`;
  document.documentElement.style.setProperty('--orange', color);
  document.documentElement.style.setProperty('--orange2', darker);
  document.documentElement.style.setProperty('--orange-light', light);
}

function launchApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='block';
  applyUserTheme(currentUser);
  renderNav();
  navigate('home');
  setTimeout(updateNotifBadge,200);
  const rb = document.getElementById('reset-btn');
  if(rb) rb.style.display = currentUser&&currentUser.role==='admin' ? 'block' : 'none';
}

function hardReset(){
  if(!confirm('Réinitialiser TOUTES les données ? (Fournisseurs, articles, BC, livraisons, paiements seront remis aux données de démo)')) return;
  ['users','suppliers','articles','orders','deliveries','payments'].forEach(k => localStorage.removeItem('gc_'+k));
  localStorage.removeItem('gc_version');
  location.reload();
}

// Boot - version check and cache-bust
const APP_VERSION = '2.1';
function bootApp(){
  // Check if stored data uses old BC format (BC-YYYY-NNN) → force reset
  const storedOrders = db.get('orders');
  const storedVersion = localStorage.getItem('gc_version');
  if(storedVersion !== APP_VERSION || (storedOrders && storedOrders.some(o => o.numero && o.numero.startsWith('BC-')))){
    console.log('GestiCommande: migrating data to v'+APP_VERSION);
    // Reset only seed data, preserve user-created data but fix BC numbers
    if(storedOrders){
      const fixed = storedOrders.map(o => {
        if(o.numero && o.numero.match(/^BC-(\d{4})-(\d+)$/)){
          const m = o.numero.match(/^BC-(\d{4})-(\d+)$/);
          o.numero = m[2]+'-'+m[1]; // 003-2025
        }
        return o;
      });
      db.set('orders', fixed);
    }
    localStorage.setItem('gc_version', APP_VERSION);
  }
  db.init();
  const saved=sessionStorage.getItem('gc_session');
  if(saved){currentUser=JSON.parse(saved);launchApp();}
}
// ════════════════════════════════════
//  SAUVEGARDE AUTOMATIQUE 13h et 17h
// ════════════════════════════════════
function autoBackupCheck(){
  if(!currentUser) return; // pas connecté
  const now = new Date();
  const hh = now.getHours();
  const mm = now.getMinutes();
  // Déclencher à 13h00 ou 17h00 (dans la fenêtre 00-02 min)
  if((hh===13||hh===17)&&mm<=1){
    const key = 'gc_auto_backup_'+hh+'_'+now.toDateString();
    if(!localStorage.getItem(key)){
      localStorage.setItem(key,'done');
      // Nettoyer les anciennes clés (garder seulement aujourd'hui)
      Object.keys(localStorage).filter(k=>k.startsWith('gc_auto_backup_')&&!k.includes(now.toDateString()))
        .forEach(k=>localStorage.removeItem(k));
      // Lancer la sauvegarde silencieusement
      silentAutoBackup();
    }
  }
}

function silentAutoBackup(){
  const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','notifications','sleeping_roles'];
  const backup={
    version:'auto',
    app:'GestiCommande-RICHBOND',
    date:new Date().toISOString(),
    auto:true,
    data:{}
  };
  KEYS.forEach(k=>{backup.data[k]=db.get(k)||[];});
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const now=new Date();
  const ds=now.toISOString().slice(0,10).replace(/-/g,'');
  const hh=String(now.getHours()).padStart(2,'0');
  a.download='GC_auto_'+ds+'_'+hh+'h.json';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  // Mettre à jour le timestamp
  const nowStr=now.toLocaleString('fr-FR');
  localStorage.setItem('gc_last_backup',nowStr);

  // Notification discrète à l'utilisateur
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:36px;right:12px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;animation:fadeInUp .3s ease';
  toast.innerHTML='<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#10b981" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>Sauvegarde automatique effectuée ('+(now.getHours())+'h00)';
  document.body.appendChild(toast);
  setTimeout(()=>{toast.style.opacity='0';toast.style.transition='opacity .5s';setTimeout(()=>toast.remove(),500);},4000);
}

// Vérifier toutes les minutes
setInterval(autoBackupCheck, 60000);
// Première vérification au démarrage (cas où on ouvre l'app exactement à 13h ou 17h)
setTimeout(autoBackupCheck, 3000);

bootApp();

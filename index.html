<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="description" content="GestiCommande - Gestion des achats et commandes">
<title>GestiCommande</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --orange:#f97316;--orange2:#ea580c;--orange-light:#fff7ed;
  --green:#10b981;--green-light:#ecfdf5;
  --red:#ef4444;--red-light:#fef2f2;
  --yellow:#f59e0b;--yellow-light:#fffbeb;
  --blue:#3b82f6;--blue-light:#eff6ff;
  --gray50:#f8fafc;--gray100:#f1f5f9;--gray200:#e2e8f0;--gray300:#cbd5e1;
  --gray400:#94a3b8;--gray500:#64748b;--gray600:#475569;--gray700:#334155;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --card:#ffffff;--bg:#f1f5f9;
  --sidebar-w:250px;--topbar-h:60px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
h1,h2,h3,.logo{font-family:'Inter',sans-serif}
button{cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;border:none;outline:none}
input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;outline:none;border:none}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);padding:16px}
.login-box{background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,.4)}
.login-logo{font-family:'Inter',sans-serif;font-size:28px;font-weight:800;color:var(--orange);margin-bottom:6px;cursor:default;user-select:none}
.login-sub{color:var(--text2);margin-bottom:36px;font-size:13px}
.login-box label{display:block;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:6px}
.login-box input,.login-box select{width:100%;padding:12px 14px;border:2px solid var(--gray200);border-radius:10px;margin-bottom:20px;transition:border-color .2s;background:#fff;color:var(--text)}
.login-box input:focus,.login-box select:focus{border-color:var(--orange)}
.btn-login{width:100%;padding:14px;background:var(--orange);color:#fff;border-radius:10px;font-weight:700;font-size:15px;font-family:'Inter',sans-serif;transition:background .2s,transform .1s}
.btn-login:hover{background:var(--orange2)}
.btn-login:active{transform:scale(.98)}
.demo-users{margin-top:28px;padding-top:20px;border-top:1px solid var(--gray200);font-size:12px;color:var(--text3)}
.demo-users strong{color:var(--text2);display:block;margin-bottom:10px}
.demo-chip{display:inline-block;padding:4px 10px;border-radius:20px;background:var(--gray100);color:var(--text2);margin:3px;cursor:pointer;transition:background .15s;border:1px solid var(--gray200)}
.demo-chip:hover{background:var(--orange-light);border-color:var(--orange);color:var(--orange2)}
#ghost-access{display:none;margin-bottom:12px}
#ghost-access input{width:100%;padding:10px 12px;border:2px solid #8b5cf6;border-radius:8px;text-align:center;letter-spacing:4px;background:#f5f3ff;font-family:monospace}
#app-shell{display:none;min-height:100vh}
#sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--navy);display:flex;flex-direction:column;transition:transform .3s ease;z-index:200;overflow-y:auto}
#sidebar.closed{transform:translateX(-100%)}
.sidebar-logo{padding:24px 20px 20px;font-size:20px;font-weight:800;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sidebar-logo span{color:var(--orange)}
.sidebar-user{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
.sidebar-user-info .name{color:#fff;font-weight:600;font-size:13px}
.sidebar-user-info .role-badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:2px;display:inline-block}
.role-achat .role-badge{background:rgba(249,115,22,.2);color:var(--orange)}
.role-stock .role-badge{background:rgba(16,185,129,.2);color:var(--green)}
.role-finance .role-badge{background:rgba(59,130,246,.2);color:var(--blue)}
.role-admin .role-badge{background:rgba(245,158,11,.2);color:var(--yellow)}
.role-ghost .role-badge{background:rgba(139,92,246,.2);color:#8b5cf6}
.nav-section{padding:16px 12px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;margin:2px 8px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;font-size:13px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--orange);color:#fff}
.nav-item svg{flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}
.sidebar-footer{margin-top:auto;padding:16px 8px}
.btn-logout{width:100%;padding:10px 16px;border-radius:10px;background:rgba(239,68,68,.15);color:#ef4444;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;transition:background .15s}
.btn-logout:hover{background:rgba(239,68,68,.25)}
#main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .3s}
#main.expanded{margin-left:0}
#topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--gray200);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
#hamburger{display:none;width:36px;height:36px;border-radius:8px;background:transparent;align-items:center;justify-content:center;color:var(--text2)}
#hamburger:hover{background:var(--gray100)}
#page-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
#content{flex:1;padding:24px;max-width:1400px;width:100%}
.card{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--gray100);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:15px}
.card-body{padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border-left:4px solid transparent}
.stat-card.orange{border-color:var(--orange)}
.stat-card.green{border-color:var(--green)}
.stat-card.blue{border-color:var(--blue)}
.stat-card.yellow{border-color:var(--yellow)}
.stat-card.red{border-color:var(--red)}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.stat-value{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--text3)}
.btn{padding:8px 16px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange2)}
.btn-secondary{background:var(--gray100);color:var(--text2);border:1px solid var(--gray200)}
.btn-secondary:hover{background:var(--gray200)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--gray100)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:6px;border-radius:6px;background:transparent;color:var(--text3)}
.btn-icon:hover{background:var(--gray100);color:var(--text)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--gray50);border-bottom:1px solid var(--gray200);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--gray100);transition:background .1s}
tbody tr:hover{background:var(--gray50)}
tbody td{padding:12px 14px;vertical-align:middle}
tbody tr:last-child{border-bottom:none}
.td-actions{display:flex;gap:4px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-draft{background:var(--gray100);color:var(--gray500)}
.badge-sent{background:var(--blue-light);color:var(--blue)}
.badge-partial{background:var(--yellow-light);color:#b45309}
.badge-delivered{background:var(--green-light);color:#065f46}
.badge-closed{background:var(--navy2);color:#94a3b8}
.badge-cancelled{background:var(--red-light);color:var(--red)}
.badge-pending{background:var(--yellow-light);color:#b45309}
.badge-paid{background:var(--green-light);color:#065f46}
.badge-late{background:var(--red-light);color:var(--red)}
.badge-orange{background:var(--orange-light);color:var(--orange2)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.form-control{padding:10px 12px;border:2px solid var(--gray200);border-radius:8px;transition:border-color .15s;background:#fff;color:var(--text);width:100%}
.form-control:focus{border-color:var(--orange)}
.form-control-sm{padding:7px 10px;font-size:13px}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:80px}
#modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(4px)}
#modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;margin:auto;box-shadow:0 25px 50px rgba(0,0,0,.35);animation:modalIn .2s ease}
.modal-sm{max-width:440px}
.modal-md{max-width:640px}
.modal-lg{max-width:900px}
.modal-xl{max-width:1100px}
@keyframes modalIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray200);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray200);display:flex;gap:10px;justify-content:flex-end}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state p{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.empty-state span{font-size:13px}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px}
.alert-success{background:var(--green-light);color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:var(--red-light);color:#991b1b;border:1px solid #fecaca}
.alert-info{background:var(--blue-light);color:#1e40af;border:1px solid #bfdbfe}
.alert-warning{background:var(--yellow-light);color:#92400e;border:1px solid #fde68a}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}
@media(max-width:768px){
  :root{--sidebar-w:260px}
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0!important}
  #hamburger{display:flex}
  #content{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .modal{border-radius:12px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .login-box{padding:32px 24px}
}
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #main{margin:0!important}
  #content{padding:0}
  .card{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}
.text-right{text-align:right}
.text-center{text-align:center}
.text-muted{color:var(--text3)}
.font-bold{font-weight:700}
.gap-8{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.divider{height:1px;background:var(--gray200);margin:16px 0}
.tag{display:inline-block;padding:2px 8px;background:var(--gray100);border-radius:4px;font-size:11px;color:var(--text2)}
.progress-bar-wrap{height:6px;background:var(--gray200);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.MODULE_TILES{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.module-tile{position:relative;background:#fff;border-radius:16px;padding:22px 16px 18px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);border:2px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.module-tile:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.module-badge{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:20px;text-align:center}
.module-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.module-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.module-desc{font-size:11px;color:var(--text3);line-height:1.4}
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.search-bar{display:flex;gap:8px;flex:1;min-width:250px}
.search-bar input{flex:1;padding:8px 12px;border:2px solid var(--gray200);border-radius:8px;font-size:13px}
.search-bar input:focus{border-color:var(--orange)}
.bc-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.bc-table th{padding:8px;background:var(--gray50);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:2px solid var(--gray200)}
.bc-table td{padding:8px;border-bottom:1px solid var(--gray100)}
.bc-table input,.bc-table select{padding:4px 6px;border:1px solid var(--gray200);border-radius:6px;width:100%;font-size:11px}
.bc-table input:focus,.bc-table select:focus{border-color:var(--orange);outline:none}
.bc-total-row{font-weight:700;background:var(--gray50)}
.bc-totals{margin-top:16px;display:flex;justify-content:flex-end}
.bc-totals-box{background:var(--gray50);border-radius:10px;padding:16px;min-width:260px}
.bc-totals-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}
.bc-totals-row.total{font-weight:700;font-size:14px;padding-top:12px;margin-top:8px;border-top:2px solid var(--gray300)}
.chart-wrapper{position:relative;height:300px;margin-top:20px}
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" onclick="handleLogoClick()">Gesti<span>Commande</span></div>
    <div id="ghost-access">
      <input type="password" id="ghost-key" placeholder="●●●●●●●●●●●●" onkeydown="if(event.key==='Enter')doGhostLogin()">
    </div>
    <p class="login-sub">Gestion des achats · RICHBOND CÔTE D'IVOIRE</p>
    <label>Identifiant</label>
    <input type="text" id="login-user" placeholder="nom d'utilisateur">
    <label>Mot de passe</label>
    <input type="password" id="login-pass" placeholder="••••••••">
    <div id="login-error" style="display:none" class="alert alert-error">Identifiants incorrects</div>
    <button class="btn-login" onclick="doLogin()">Connexion →</button>
    <div class="demo-users">
      <strong>Comptes de démonstration :</strong>
      <span class="demo-chip" onclick="fillDemo('achat','achat')">🛒 achat</span>
      <span class="demo-chip" onclick="fillDemo('stock','stock')">📦 stock</span>
      <span class="demo-chip" onclick="fillDemo('finance','finance')">💰 finance</span>
      <span class="demo-chip" onclick="fillDemo('admin','admin')">⚙️ admin</span>
    </div>
  </div>
</div>

<!-- ══════════════════ APP SHELL ══════════════════ -->
<div id="app-shell">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <nav id="sidebar">
    <div class="sidebar-logo">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#f97316" stroke-width="2.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 0a3 3 0 11-6 0 3 3 0 016 0zm3 0a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Gesti<span>Commande</span>
    </div>
    <div class="sidebar-user" id="sidebar-user-info"></div>
    <div id="nav-menu"></div>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="doLogout()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Déconnexion
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleSidebar()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span id="page-title">Tableau de bord</span>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ══════════════════ MODALS ══════════════════ -->
<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<script>

    {id:2,ref:'PAP-002',designation:'Papier A3 80g/m² - Rame 250 feuilles',unite:'Rame',prix:7.20,supplier_id:1,tva:18},
    {id:3,ref:'ENC-001',designation:'Encre noire HP 305XL',unite:'Cartouche',prix:14.90,supplier_id:2,tva:18},

const db={
  get:(k)=>JSON.parse(localStorage.getItem('gc_'+k)||'null'),
  set:(k,v)=>localStorage.setItem('gc_'+k,JSON.stringify(v)),
  init(){if(!db.get('users')){Object.entries(SEED).forEach(([k,v])=>db.set(k,v));}},
  nextId(col){const items=db.get(col)||[];return items.length>0?Math.max(...items.map(i=>i.id))+1:1;},
  all:(col)=>db.get(col)||[],
  find:(col,id)=>(db.get(col)||[]).find(i=>i.id===id),
  save(col,item){const items=db.all(col);const idx=items.findIndex(i=>i.id===item.id);if(idx>=0)items[idx]=item; else items.push({...item,id:db.nextId(col)});db.set(col,items);},
  delete(col,id){db.set(col,(db.all(col)).filter(i=>i.id!==id))}
};

function bcTotal(o){return (o.lines||[]).reduce((s,l)=>s+(l.qty*(l.prix||0)),0);}
function bcTVA(o){if(o.tva_enabled===false)return 0;return (o.lines||[]).reduce((s,l)=>s+(l.qty*(l.prix||0)*(l.tva||18)/100),0);}
function bcTTC(o){return bcTotal(o)+bcTVA(o);}

        <thead><tr><th>N° BC</th><th>Date</th><th>Fournisseur</th><th>TTC</th><th>Statut</th></tr></thead>
        <tbody>
          ${orders.length?orders.slice().reverse().slice(0,6).map(o=>{const sup=db.find('suppliers',o.supplier_id);return `<tr><td><strong style="color:var(--orange)">${sanitize(o.numero)}</strong></td><td>${fmt.date(o.date)}</td><td>${sup?sanitize(sup.name):'–'}</td><td style="text-align:right"><strong>${fmt.money(bcTTC(o))}</strong></td><td>${statusBadge(o.status)}</td></tr>`;}).join(''):`<tr><td colspan="5"><div class="empty-state"><p>Aucun bon de commande</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderOrders(){
  if(!can('bc_read')){document.getElementById('content').innerHTML='<p>Accès refusé</p>';return;}
  const orders=db.all('orders');
  document.getElementById('content').innerHTML=`
  <div class="list-header">
    <h2 style="margin:0">Gestion des bons de commande</h2>
    ${can('bc_write')?`<button class="btn btn-primary" onclick="openOrderModal()">+ Nouveau BC</button>`:''}
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>N° BC</th><th>Date</th><th>Fournisseur</th><th>TTC</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody>
          ${orders.length?orders.map(o=>{const sup=db.find('suppliers',o.supplier_id);return `<tr><td onclick="openOrderDetail(${o.id})" style="cursor:pointer;color:var(--orange);font-weight:700">${sanitize(o.numero)}</td><td>${fmt.date(o.date)}</td><td>${sup?sanitize(sup.name):'–'}</td><td style="text-align:right"><strong>${fmt.money(bcTTC(o))}</strong></td><td>${statusBadge(o.status)}</td><td><div class="td-actions">${can('bc_write')?`<button class="btn-icon" onclick="openOrderModal(${o.id})" title="Éditer"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button><button class="btn-icon" onclick="delOrder(${o.id})" title="Supprimer"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>`:''}
</div></td></tr>`;}).join(''):`<tr><td colspan="6"><div class="empty-state"><p>Aucun bon de commande</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function openOrderModal(id){
  const order=id?db.find('orders',id):{numero:'',date:fmt.today(),supplier_id:1,status:'draft',lines:[],notes:'',conditions:'30j',lieu:''};
  const suppliers=db.all('suppliers');
  const articles=db.all('articles');
  
  let linesHtml='';
  (order.lines||[]).forEach((l,i)=>{
    const art=articles.find(a=>a.id===l.article_id);
    linesHtml+=`<tr><td><input type="number" value="${l.article_id}" onchange="this.dataset.aid=this.value" style="width:50px"/></td><td><input type="text" value="${sanitize(l.designation)}" style="width:150px"/></td><td><input type="number" value="${l.qty}" style="width:50px"/></td><td><input type="number" step="0.01" value="${l.prix}" style="width:60px"/></td><td><input type="number" value="${l.tva||18}" style="width:40px"/></td><td style="text-align:right"><strong>${fmt.money(l.qty*l.prix*(1+l.tva/100))}</strong></td><td><button class="btn-icon" onclick="this.parentElement.parentElement.remove()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button></td></tr>`;
  });

  const total=order.lines?order.lines.reduce((s,l)=>s+(l.qty*l.prix),0):0;
  const tva=order.lines?order.lines.reduce((s,l)=>s+(l.qty*l.prix*l.tva/100),0):0;

  showModal(`
  <div class="modal-header">
    <span class="modal-title">${id?'Éditer':'Créer'} un bon de commande</span>
    <button onclick="closeModal()" style="font-size:20px;opacity:.6">×</button>
  </div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group"><label class="form-label">N° BC</label><input type="text" id="bc_numero" class="form-control" value="${sanitize(order.numero)}" placeholder="ex: 001-2025"></div>
      <div class="form-group"><label class="form-label">Date</label><input type="date" id="bc_date" class="form-control" value="${order.date}"></div>
      <div class="form-group"><label class="form-label">Fournisseur</label><select id="bc_supplier" class="form-control">${suppliers.map(s=>`<option value="${s.id}" ${s.id===order.supplier_id?'selected':''}>${sanitize(s.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Statut</label><select id="bc_status" class="form-control"><option value="draft" ${order.status==='draft'?'selected':''}>Brouillon</option><option value="sent" ${order.status==='sent'?'selected':''}>Envoyé</option><option value="partial" ${order.status==='partial'?'selected':''}>Partiel</option><option value="delivered" ${order.status==='delivered'?'selected':''}>Livré</option></select></div>
      <div class="form-group full"><label class="form-label">Notes</label><textarea id="bc_notes" class="form-control">${sanitize(order.notes)}</textarea></div>
      <div class="form-group"><label class="form-label">Conditions</label><input type="text" id="bc_conditions" class="form-control" value="${sanitize(order.conditions)}" placeholder="ex: 30j"></div>
      <div class="form-group"><label class="form-label">Lieu de livraison</label><input type="text" id="bc_lieu" class="form-control" value="${sanitize(order.lieu)}"></div>
    </div>

    <div style="margin-top:24px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;font-size:14px;font-weight:700">Lignes de commande</h3>
        <button class="btn btn-sm btn-secondary" onclick="addOrderLine()">+ Ajouter une ligne</button>
      </div>
      <div class="table-wrap">
        <table class="bc-table">
          <thead><tr><th>Article</th><th>Désignation</th><th>Qté</th><th>Prix U.</th><th>TVA %</th><th>TTC</th><th></th></tr></thead>
          <tbody id="bc-lines">
            ${linesHtml}
          </tbody>
        </table>
      </div>
    </div>

    <div class="bc-totals">
      <div class="bc-totals-box">
        <div class="bc-totals-row"><span>Total HT:</span><span style="text-align:right">${fmt.money(total)}</span></div>
        <div class="bc-totals-row"><span>TVA (18%):</span><span style="text-align:right">${fmt.money(tva)}</span></div>
        <div class="bc-totals-row total"><span>Total TTC:</span><span style="text-align:right">${fmt.money(total+tva)}</span></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="saveOrder(${id||0})">Enregistrer</button>
  </div>`, 'modal-xl');
}

function addOrderLine(){
  const tbody=document.getElementById('bc-lines');
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input type="number" value="1" style="width:50px"/></td><td><input type="text" placeholder="Désignation" style="width:150px"/></td><td><input type="number" value="1" style="width:50px"/></td><td><input type="number" step="0.01" value="0" style="width:60px"/></td><td><input type="number" value="18" style="width:40px"/></td><td style="text-align:right"><strong>0 F CFA</strong></td><td><button class="btn-icon" onclick="this.parentElement.remove()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button></td>`;
  tbody.appendChild(tr);
}

function saveOrder(id){
  const lines=[];
  document.querySelectorAll('#bc-lines tr').forEach(tr=>{
    const inputs=tr.querySelectorAll('input');
    lines.push({article_id:parseInt(inputs[0].value),designation:inputs[1].value,qty:parseInt(inputs[2].value),prix:parseFloat(inputs[3].value),tva:parseInt(inputs[4].value)});
  });
  const order={id:id||db.nextId('orders'),numero:document.getElementById('bc_numero').value,date:document.getElementById('bc_date').value,supplier_id:parseInt(document.getElementById('bc_supplier').value),status:document.getElementById('bc_status').value,lines,notes:document.getElementById('bc_notes').value,conditions:document.getElementById('bc_conditions').value,lieu:document.getElementById('bc_lieu').value};
  db.save('orders',order);
  closeModal();
  showAlert('Bon de commande enregistré!');
  renderOrders();
}

function delOrder(id){if(confirm('Supprimer ce bon ?')){db.delete('orders',id);renderOrders();showAlert('Bon supprimé!');}}

function openOrderDetail(id){
  const order=db.find('orders',id);
  const sup=db.find('suppliers',order.supplier_id);
  const total=bcTotal(order);
  const tva=bcTVA(order);
  showModal(`
  <div class="modal-header">
    <span class="modal-title">BC ${sanitize(order.numero)}</span>
    <button onclick="closeModal()" style="font-size:20px;opacity:.6">×</button>
  </div>
  <div class="modal-body">
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px">
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:4px">Fournisseur</div><div style="font-weight:600">${sup?sanitize(sup.name):'–'}</div></div>
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:4px">Date</div><div style="font-weight:600">${fmt.date(order.date)}</div></div>
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:4px">Statut</div>${statusBadge(order.status)}</div>
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:4px">Conditions</div><div style="font-weight:600">${sanitize(order.conditions)}</div></div>
    </div>
    <div class="divider"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Désignation</th><th style="text-align:right">Qté</th><th style="text-align:right">Prix U.</th><th style="text-align:right">TTC</th></tr></thead>
        <tbody>
          ${order.lines.map(l=>`<tr><td>${sanitize(l.designation)}</td><td style="text-align:right">${l.qty}</td><td style="text-align:right">${fmt.money(l.prix)}</td><td style="text-align:right"><strong>${fmt.money(l.qty*l.prix*(1+l.tva/100))}</strong></td></tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="bc-totals" style="margin-top:20px">
      <div class="bc-totals-box">
        <div class="bc-totals-row"><span>Total HT:</span><span style="text-align:right">${fmt.money(total)}</span></div>
        <div class="bc-totals-row"><span>TVA:</span><span style="text-align:right">${fmt.money(tva)}</span></div>
        <div class="bc-totals-row total"><span>Total TTC:</span><span style="text-align:right">${fmt.money(bcTTC(order))}</span></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
    ${can('bc_write')?`<button class="btn btn-primary" onclick="openOrderModal(${id})">Éditer</button>`:''}
  </div>`, 'modal-lg');
}

function renderGhostPanel(){
  if(currentUser.role!=='ghost'){document.getElementById('content').innerHTML='<p>Accès refusé</p>';return;}
  document.getElementById('content').innerHTML=`
  <div style="max-width:800px">
    <div style="padding:20px;background:rgba(139,92,246,.1);border-radius:12px;border:1px solid #8b5cf6;margin-bottom:20px">
      <div style="font-size:18px;font-weight:700;color:#8b5cf6;margin-bottom:8px">👻 Panneau Fantôme (Super Admin)</div>
      <p style="color:var(--text2);font-size:13px">Vous avez un accès administrateur complet. Utilisez avec responsabilité.</p>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Outils d'administration</span></div>
      <div class="card-body">
        <button class="btn btn-danger" onclick="hardReset()" style="margin-right:10px">🔄 Réinitialiser les données</button>
        <button class="btn btn-secondary" onclick="exportData()">💾 Exporter les données</button>
        <button class="btn btn-secondary" onclick="showStats()">📊 Statistiques système</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-header"><span class="card-title">Utilisateurs</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Login</th><th>Rôle</th></tr></thead>
          <tbody>
            ${db.all('users').map(u=>`<tr><td>${sanitize(u.name)}</td><td>${sanitize(u.login)}</td><td>${sanitize(u.role)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function hardReset(){
  if(confirm('⚠️ Réinitialiser TOUTES les données ? Cette action est irréversible !')){
    localStorage.clear();
    db.init();
    showAlert('Données réinitialisées!','success');
    navigate('dashboard');
  }
}

function exportData(){
  const data=Object.fromEntries(Object.keys(SEED).map(k=>[k,db.all(k)]));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`backup-${fmt.today()}.json`;
  a.click();
  showAlert('Données exportées!','success');
}

function showStats(){
  const stats={users:db.all('users').length,suppliers:db.all('suppliers').length,articles:db.all('articles').length,orders:db.all('orders').length,deliveries:db.all('deliveries').length,payments:db.all('payments').length};
  alert('📊 Statistiques:\n\n'+Object.entries(stats).map(([k,v])=>`${k}: ${v}`).join('\n'));
}

window.addEventListener('DOMContentLoaded',()=>{db.init();});

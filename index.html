//  BACKUP & RESTORE
// ═══════════════════════════════════════════════
function createBackup(){
  const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','sleeping_roles'];
  const backup={version:'1.0',app:'GestiCommande-RICHBOND',date:new Date().toISOString(),date_fr:fmt.date(fmt.today()),data:{}};
  KEYS.forEach(k=>{backup.data[k]=db.get(k)||[];});
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const ds=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const ts=new Date().toTimeString().slice(0,5).replace(':','h');
  a.download='GestiCommande_backup_'+ds+'_'+ts+'.json';
  a.click();URL.revokeObjectURL(url);
  const now=new Date().toLocaleString('fr-FR');
  localStorage.setItem('gc_last_backup',now);
  const infoEl=document.getElementById('backup-info');
  if(infoEl)infoEl.innerHTML='<span style="color:var(--green);font-weight:600">Sauvegarde créée le '+now+'</span>';
  const lastEl=document.getElementById('last-backup-date');
  if(lastEl)lastEl.textContent=now;
  showAlert('Sauvegarde téléchargée avec succès');
}

function restoreBackup(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const backup=JSON.parse(e.target.result);
      if(!backup.data||!backup.version){showAlert('Fichier invalide','error');return;}
      const d=backup.date_fr||'?';
      const stats=Object.entries(backup.data).map(([k,v])=>''+({orders:'BC',suppliers:'Fournisseurs',articles:'Articles',deliveries:'Livraisons',payments:'Paiements',evaluations:'Évaluations',users:'Utilisateurs'}[k]||k)+': '+(Array.isArray(v)?v.length:'?')).join(' · ');
      const safeBackup=JSON.stringify(backup).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
      showModal(`
      <div class="modal modal-md">
        <div class="modal-header"><span class="modal-title">Confirmer la restauration</span></div>
        <div class="modal-body">
          <div class="alert alert-warning"><strong>Cette action remplace TOUTES vos données actuelles. Elle est irréversible.</strong></div>
          <div style="background:var(--gray50);border-radius:10px;padding:14px;font-size:13px">
            <div style="font-weight:700;margin-bottom:6px">Fichier : ${file.name}</div>
            <div style="color:var(--text3)">Sauvegarde du ${d}</div>
            <div style="margin-top:8px;font-size:12px;color:var(--blue)">${stats}</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
          <button class="btn btn-danger" id="btn-confirm-restore">Oui, restaurer</button>
        </div>
      </div>`);
      // Store backup for confirmation
      window._pendingRestore=backup;
      setTimeout(()=>{
        const btn=document.getElementById('btn-confirm-restore');
        if(btn)btn.onclick=()=>confirmRestore(window._pendingRestore);
      },50);
    }catch(err){showAlert('Erreur lecture : '+err.message,'error');}
  };
  reader.readAsText(file);
  event.target.value='';
}

function confirmRestore(backup){
  try{
    const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','sleeping_roles'];
    KEYS.forEach(k=>{if(backup.data[k]!==undefined)db.set(k,backup.data[k]);});
    closeModal();
    const restored=db.all('users').find(u=>u.id===currentUser.id);
    if(restored){currentUser=restored;sessionStorage.setItem('gc_session',JSON.stringify(restored));}
    showAlert('Données restaurées avec succès !');
    setTimeout(()=>{renderNav();navigate('home');},600);
  }catch(err){closeModal();showAlert('Erreur restauration : '+err.message,'error');}
}

function handleDrop(event,type){
  event.preventDefault();
  document.getElementById('drop-'+type).style.borderColor='var(--gray300)';
  const file=event.dataTransfer.files[0];
  if(file)processExcelFile(file,type);
}

function handleFile(event,type){
  const file=event.target.files[0];
  if(file)processExcelFile(file,type);
}

function processExcelFile(file,type){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:''});
      importData(data,type);
    }catch(err){
      document.getElementById('import-'+type+'-result').innerHTML=`<div class="alert alert-error">Erreur de lecture : ${err.message}</div>`;
    }
  };
  reader.readAsBinaryString(file);
}

function importData(rows,type){
  let count=0,errors=[];
  if(type==='articles'){
    rows.forEach((row,i)=>{
      const designation=(row.designation||row.Désignation||row.DESIGNATION||'').toString().trim();
      if(!designation){errors.push(`Ligne ${i+2}: désignation manquante`);return;}
      // Match supplier by name
      let sup_id=null;
      const supName=(row.fournisseur_nom||row.fournisseur||row.Fournisseur||'').toString().trim();
      if(supName){
        const sup=db.all('suppliers').find(s=>s.name.toLowerCase()===supName.toLowerCase());
        if(sup)sup_id=sup.id;
      }
      const article={
        id:db.nextId('articles'),
        ref:(row.ref||row.Ref||row.REF||'').toString().trim(),
        designation,
        unite:(row.unite||row.Unite||row.Unité||'Pièce').toString().trim(),
        prix:parseFloat(row.prix||row.Prix||row.PRIX||0)||0,
        tva:parseFloat(row.tva||row.TVA||18)||18,
        supplier_id:sup_id
      };
      db.save('articles',article);count++;
    });
  }else if(type==='suppliers'){
    rows.forEach((row,i)=>{
      const fid=(row.fournisseur_id||row['Identifiant fournisseur']||'').toString().trim();
      const name=(row.name||row.Name||row.nom||row['Raison sociale']||'').toString().trim();
      if(!name&&!fid){errors.push(`Ligne ${i+2}: nom et identifiant manquants`);return;}
      const supplier={
        id:db.nextId('suppliers'),
        fournisseur_id:fid||nextFournisseurId(),
        name:name||fid,
        phone:(row.phone||row.telephone||row['Numéro de téléphone']||row['Téléphone']||'').toString().trim(),
        address:(row.address||row.adresse||row['Adresse']||'').toString().trim(),
        compte_contribuable:(row.compte_contribuable||row['N° compte contribuable']||'').toString().trim(),
        regime_imposition:(row.regime_imposition||row["Régime d'imposition"]||'').toString().trim(),
        email:(row.email||row['Adresse mail']||'').toString().trim(),
        situation_geo:(row.situation_geo||row['Situation géographique']||'').toString().trim(),
        conditions:(row.conditions||row['Délai de paiement']||'').toString().trim(),
        activite:(row.activite||row['Activité spécifique']||'').toString().trim(),
        contact:(row.contact||row['Personne ressource']||'').toString().trim(),
      };
      db.save('suppliers',supplier);count++;
    });
  }
  const msg=`<div class="alert alert-success">✓ ${count} ${type==='articles'?'article(s)':'fournisseur(s)'} importé(s) avec succès${errors.length?`<br><span style="color:var(--red-500)">Erreurs: ${errors.join(', ')}</span>`:''}</div>`;
  document.getElementById('import-'+type+'-result').innerHTML=msg;
  if(type==='articles')renderArticles(); else renderSuppliers();
}

  let data,filename;
  if(type==='articles'){
    data=[{ref:'ART-001',designation:'Exemple article',unite:'Pièce',prix:10.00,tva:18,fournisseur_nom:'Nom du fournisseur'}];
    filename='modele_articles.xlsx';
  }else{
    data=[{
      fournisseur_id:'F-R001',
      name:'Nom de la société',
      phone:'00 00 00 00 00',
      address:'Adresse complète',
      compte_contribuable:'CC-XXXXX',
      regime_imposition:'Réel',
      email:'contact@exemple.com',
      situation_geo:'Quartier, Ville',
      conditions:'30j',
      activite:'Activité spécifique',
      contact:'Personne ressource'
    }];
    filename='modele_fournisseurs.xlsx';
  }
  const ws=XLSX.utils.json_to_sheet(data);

  XLSX.writeFile(wb,filename);
}

function exportData(type){
  let data,filename;
  if(type==='articles'){
    data=db.all('articles').map(a=>{
      const sup=db.find('suppliers',a.supplier_id);
      return{'Référence':a.ref,'Désignation':a.designation,'Unité':a.unite,'Prix HT':a.prix,'TVA (%)':a.tva,'Fournisseur':sup?sup.name:''};
    });
    filename=`articles_${fmt.today()}.xlsx`;
  }else if(type==='suppliers'){
    data=db.all('suppliers').map(s=>({
      'Identifiant':s.fournisseur_id||'',
      'Raison sociale':s.name||'',
      'Téléphone':s.phone||'',
      'Adresse':s.address||'',
      'N° compte contribuable':s.compte_contribuable||'',
      "Régime d'imposition":s.regime_imposition||'',
      'Adresse mail':s.email||'',
      'Situation géographique':s.situation_geo||'',
      'Délai de paiement':s.conditions||'',
      'Activité spécifique':s.activite||'',
      'Personne ressource':s.contact||''
    }));
    filename=`fournisseurs_${fmt.today()}.xlsx`;
  }
  if(data){
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Export');
    XLSX.writeFile(wb,filename);
    showAlert('Export téléchargé');
  }
}

function toggleAllExp(group,state){
  const selMap={status:'.exp-status',supplier:'.exp-supplier',col:'.exp-col'};
  document.querySelectorAll(selMap[group]).forEach(cb=>{
    cb.checked=state;
    if(group==='status'){
      const lbl=document.getElementById('exp-status-label-'+cb.value);
      if(lbl){lbl.style.borderColor=state?'var(--orange)':'var(--gray200)';lbl.style.background=state?'var(--orange-light)':'#fff';}
    } else if(group==='supplier'){
      const lbl=document.getElementById('exp-sup-label-'+cb.value);
      if(lbl){lbl.style.borderColor=state?'var(--orange)':'var(--gray200)';lbl.style.background=state?'var(--orange-light)':'#fff';}
    } else {
      const lbl=document.getElementById(cb.id+'-label');
      if(lbl){lbl.style.borderColor=state?'var(--blue)':'var(--gray200)';lbl.style.background=state?'var(--blue-light)':'#fff';}
    }
  });
  updateExportCount();
}

function updateExportCount(){
  const selStatus=[...document.querySelectorAll('.exp-status:checked')].map(c=>c.value);
  const selSup=[...document.querySelectorAll('.exp-supplier:checked')].map(c=>+c.value);
  const from=document.getElementById('exp-date-from')?.value||'';
  const to=document.getElementById('exp-date-to')?.value||'';
  const orders=db.all('orders').filter(o=>{
    if(selStatus.length&&!selStatus.includes(o.status))return false;
    if(selSup.length&&!selSup.includes(o.supplier_id))return false;
    if(from&&o.date<from)return false;
    if(to&&o.date>to)return false;
    return true;
  });
  const el=document.getElementById('exp-count-info');
  if(el){
    const ttc=orders.reduce((s,o)=>s+bcTTC(o),0);
    el.innerHTML=orders.length>0
      ?`📊 <strong>${orders.length} BC</strong> sélectionné(s) · Total TTC : <strong style="color:var(--orange)">${fmt.money(ttc)}</strong>`
      :`<span style="color:var(--red)">⚠ Aucun BC ne correspond aux filtres</span>`;
  }
}

function runExportBC(){
  const selStatus=[...document.querySelectorAll('.exp-status:checked')].map(c=>c.value);
  const selSup=[...document.querySelectorAll('.exp-supplier:checked')].map(c=>+c.value);
  const from=document.getElementById('exp-date-from')?.value||'';
  const to=document.getElementById('exp-date-to')?.value||'';
  const statusLabels={draft:'Brouillon',sent:'Envoyé',partial:'Partiel',delivered:'Livré',closed:'Clôturé',cancelled:'Annulé'};
  const lineStatusLabels={pending:'En attente',ordered:'Commandé',partial:'Partiel',delivered:'Livré',cancelled:'Annulé'};

  const col=id=>document.getElementById(id)?.checked;

  const orders=db.all('orders').filter(o=>{
    if(selStatus.length&&!selStatus.includes(o.status))return false;
    if(selSup.length&&!selSup.includes(o.supplier_id))return false;
    if(from&&o.date<from)return false;
    if(to&&o.date>to)return false;
    return true;
  });

  if(!orders.length){showAlert('Aucun BC à exporter','error');return;}

  const wb=XLSX.utils.book_new();

  // ── SHEET 1 : Récapitulatif BC ──
  const summaryData=orders.map(o=>{
    const sup=db.find('suppliers',o.supplier_id)||{};
    const pay=db.all('payments').filter(p=>p.bc_id===o.id);
    const del=db.all('deliveries').filter(d=>d.bc_id===o.id);
    const row={};
    if(col('col-num'))row['N° BC']=o.numero;
    if(col('col-date'))row['Date']=fmt.date(o.date);
    if(col('col-sup'))row['Fournisseur']=sup.name||'';
    if(col('col-contact'))row['Contact']=sup.contact||'';
    if(col('col-email'))row['Email']=sup.email||'';
    if(col('col-phone'))row['Téléphone']=sup.phone||'';
    if(col('col-status'))row['Statut']=statusLabels[o.status]||o.status;
    if(col('col-conditions'))row['Conditions']=o.conditions||'';
    if(col('col-lieu'))row['Lieu livraison']=o.lieu||'';
    if(col('col-ht'))row['Total HT (F CFA)']=Math.round(bcTotal(o));
    if(col('col-tva'))row['TVA (F CFA)']=Math.round(bcTVA(o));
    if(col('col-ttc'))row['Total TTC (F CFA)']=Math.round(bcTTC(o));
    if(col('col-notes'))row['Notes']=o.notes||'';
    if(col('col-payment')){
      row['Statut paiement']=pay.length?({pending:'En attente',paid:'Payé',late:'En retard'}[pay[0].status]||''):'';
      row['Montant réglé (F CFA)']=pay.filter(p=>p.status==='paid').reduce((s,p)=>s+(p.montant||0),0);
      row['Restant dû (F CFA)']=pay.filter(p=>p.status!=='paid').reduce((s,p)=>s+(p.montant||0),0);
      row['Échéance paiement']=pay.length?fmt.date(pay[0].date_echeance):'';
    }
    if(col('col-delivery')){
      row['Statut livraison']=del.length?({pending:'En attente',partial:'Partielle',complete:'Complète'}[del[0].status]||''):'';
    }
    return row;
  });

  const ws1=XLSX.utils.json_to_sheet(summaryData);

  // Style header row
  const range=XLSX.utils.decode_range(ws1['!ref']);
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r:0,c});
    if(!ws1[addr])continue;
    ws1[addr].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'F97316'}},alignment:{horizontal:'center'}};
  }

  // Auto column width
  const colWidths=summaryData.length?Object.keys(summaryData[0]).map(k=>({wch:Math.max(k.length+2,12)})):[];
  ws1['!cols']=colWidths;
  XLSX.utils.book_append_sheet(wb,ws1,'Récapitulatif BC');

  // ── SHEET 2 : Lignes de commande (si coché) ──
  if(col('col-lines')){
    const linesData=[];
    orders.forEach(o=>{
      const sup=db.find('suppliers',o.supplier_id)||{};
      (o.lines||[]).forEach((l,i)=>{
        const art=db.find('articles',l.article_id)||{};
        linesData.push({
          'N° BC':o.numero,
          'Date':fmt.date(o.date),
          'Fournisseur':sup.name||'',
          'Statut BC':statusLabels[o.status]||o.status,
          '#':i+1,
          'Référence':art.ref||'',
          'Désignation':l.designation||art.designation||'',
          'Unité':art.unite||'',
          'Quantité':l.qty,
          'Prix unitaire HT':l.prix||0,
          'TVA (%)':l.tva||18,
          'Total HT (F CFA)':Math.round(l.qty*(l.prix||0)),
          'Total TTC (F CFA)':Math.round(l.qty*(l.prix||0)*(1+(l.tva||18)/100)),
          'Statut livraison':lineStatusLabels[l.line_status||'pending']||''
        });
      });
    });
    if(linesData.length){
      const ws2=XLSX.utils.json_to_sheet(linesData);
      const r2=XLSX.utils.decode_range(ws2['!ref']);
      for(let c=r2.s.c;c<=r2.e.c;c++){
        const addr=XLSX.utils.encode_cell({r:0,c});
        if(!ws2[addr])continue;
        ws2[addr].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'0F172A'}},alignment:{horizontal:'center'}};
      }
      ws2['!cols']=Object.keys(linesData[0]).map(k=>({wch:Math.max(k.length+2,10)}));
      XLSX.utils.book_append_sheet(wb,ws2,'Lignes de commande');
    }
  }

  const filename=`BC_export_${fmt.today()}.xlsx`;
  XLSX.writeFile(wb,filename);
  closeModal();
  showAlert(`${orders.length} BC exportés avec succès`);
}

//  ANALYSES

let analysisTab='suppliers'; // 'suppliers' | 'articles'
let analysisPeriod='all';
let analysisSortSupCol='ttc'; let analysisSortSupDir=-1;
let analysisSortArtCol='ttc'; let analysisSortArtDir=-1;

function sortAnalysisSup(col){
  if(analysisSortSupCol===col)analysisSortSupDir*=-1;
  else{analysisSortSupCol=col;analysisSortSupDir=-1;}
  renderAnalyses();
}
function sortAnalysisArt(col){
  if(analysisSortArtCol===col)analysisSortArtDir*=-1;
  else{analysisSortArtCol=col;analysisSortArtDir=-1;}
  renderAnalyses();
}

function _ath(col,label,isArt){
  const sc=isArt?analysisSortArtCol:analysisSortSupCol;
  const sd=isArt?analysisSortArtDir:analysisSortSupDir;
  const fn=isArt?'sortAnalysisArt':'sortAnalysisSup';
  const active=sc===col;
  const arrow=active?(sd===1?'▲':'▼'):'⇅';
  return `<th style="cursor:pointer;user-select:none" onclick="${fn}('${col}')">${label} <span style="opacity:${active?1:.3};font-size:10px">${arrow}</span></th>`;
}

function renderAnalyses(){
  const orders=db.all('orders');
  const suppliers=db.all('suppliers');
  const articles=db.all('articles');
  const payments=db.all('payments');

  // Period filter
  let fromDate=null;
  const now=new Date();
  if(analysisPeriod==='month'){fromDate=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);}
  else if(analysisPeriod==='quarter'){const q=Math.floor(now.getMonth()/3);fromDate=new Date(now.getFullYear(),q*3,1).toISOString().slice(0,10);}
  else if(analysisPeriod==='year'){fromDate=new Date(now.getFullYear(),0,1).toISOString().slice(0,10);}

  const filteredOrders=orders.filter(o=>!fromDate||o.date>=fromDate);
  const totalHT=filteredOrders.reduce((s,o)=>s+bcTotal(o),0);
  const totalTTC=filteredOrders.reduce((s,o)=>s+bcTTC(o),0);

  // ── BY SUPPLIER ──
  const supMap={};
  filteredOrders.forEach(o=>{
    const sid=o.supplier_id||0;
    if(!supMap[sid])supMap[sid]={supplier_id:sid,nb_bc:0,ht:0,tva:0,ttc:0,paid:0,unpaid:0,bcs:[]};
    supMap[sid].nb_bc++;
    supMap[sid].ht+=bcTotal(o);
    supMap[sid].tva+=bcTVA(o);
    supMap[sid].ttc+=bcTTC(o);
    supMap[sid].bcs.push(o);
    const pay=payments.filter(p=>p.bc_id===o.id);
    pay.forEach(p=>{
      if(p.status==='paid')supMap[sid].paid+=p.montant||0;
      else supMap[sid].unpaid+=p.montant||0;
    });
  });
  let supRows=Object.values(supMap);
  supRows.sort((a,b)=>{
    let va,vb;
    const col=analysisSortSupCol;
    if(col==='name'){va=(db.find('suppliers',a.supplier_id)||{name:'–'}).name;vb=(db.find('suppliers',b.supplier_id)||{name:'–'}).name;}
    else if(col==='nb'){{va=a.nb_bc;vb=b.nb_bc;}}
    else if(col==='ht'){{va=a.ht;vb=b.ht;}}
    else{va=a.ttc;vb=b.ttc;}
    return va<vb?analysisSortSupDir:va>vb?-analysisSortSupDir:0;
  });

  // ── BY ARTICLE ──
  const artMap={};
  filteredOrders.forEach(o=>{
    const sup=db.find('suppliers',o.supplier_id);
    (o.lines||[]).forEach(l=>{
      const aid=l.article_id||('free_'+l.designation);
      if(!artMap[aid])artMap[aid]={
        article_id:l.article_id,designation:l.designation,ref:'',unite:'',
        nb_cmd:0,qty_total:0,ht:0,ttc:0,
        prix_list:[],prix_min:null,prix_max:null,prix_moy:0,
        bc_list:[],orders:new Set()
      };
      artMap[aid].nb_cmd++;
      artMap[aid].qty_total+=l.qty;
      artMap[aid].ht+=l.qty*(l.prix||0);
      artMap[aid].ttc+=l.qty*(l.prix||0)*(1+(l.tva||18)/100);
      artMap[aid].orders.add(o.id);
      if(l.prix>0){
        artMap[aid].prix_list.push(l.prix);
        if(artMap[aid].prix_min===null||l.prix<artMap[aid].prix_min)artMap[aid].prix_min=l.prix;
        if(artMap[aid].prix_max===null||l.prix>artMap[aid].prix_max)artMap[aid].prix_max=l.prix;
      }
      artMap[aid].bc_list.push({
        bc_id:o.id,numero:o.numero,date:o.date,
        fournisseur:sup?sup.name:'–',
        fournisseur_id:sup?sup.fournisseur_id||'':'',
        conditions:o.conditions||'',
        qty:l.qty,prix:l.prix,
        status:o.status
      });
      const art=db.find('articles',l.article_id);
      if(art){artMap[aid].ref=art.ref||'';artMap[aid].unite=art.unite||'';}
    });
  });
  // Compute prix moyen
  Object.values(artMap).forEach(r=>{
    if(r.prix_list.length)r.prix_moy=r.prix_list.reduce((a,b)=>a+b,0)/r.prix_list.length;
  });
  let artRows=Object.values(artMap);
  artRows.sort((a,b)=>{
    let va,vb;
    const col=analysisSortArtCol;
    if(col==='designation'){va=a.designation;vb=b.designation;}
    else if(col==='qty'){va=a.qty_total;vb=b.qty_total;}
    else if(col==='ht'){va=a.ht;vb=b.ht;}
    else if(col==='prix_moy'){va=a.prix_moy;vb=b.prix_moy;}
    else{va=a.ttc;vb=b.ttc;}
    return va<vb?analysisSortArtDir:va>vb?-analysisSortArtDir:0;
  });

  const pLabels={all:'Toute la période',month:'Ce mois',quarter:'Ce trimestre',year:'Cette année'};

  document.getElementById('content').innerHTML=`
  <!-- KPIs -->
  <div class="stats-grid" style="margin-bottom:20px">
    <div class="stat-card orange">
      <div class="stat-label">Commandes (${pLabels[analysisPeriod]})</div>
      <div class="stat-value">${filteredOrders.length}</div>
      <div class="stat-sub">${suppliers.length} fournisseurs actifs</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">Total HT</div>
      <div class="stat-value">${fmt.money(totalHT)}</div>
    </div>
    <div class="stat-card navy" style="border-color:#0f172a">
      <div class="stat-label">Total TTC</div>
      <div class="stat-value">${fmt.money(totalTTC)}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">TVA totale</div>
      <div class="stat-value">${fmt.money(totalTTC-totalHT)}</div>
    </div>
  </div>

  <!-- Controls -->
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
    <div style="display:flex;background:#fff;border:1px solid var(--gray200);border-radius:10px;overflow:hidden">
      ${['suppliers','articles'].map(t=>`
        <button onclick="analysisTab='${t}';renderAnalyses()" style="padding:8px 18px;font-weight:600;font-size:13px;border:none;background:${analysisTab===t?'var(--navy)':'#fff'};color:${analysisTab===t?'#fff':'var(--text2)'};cursor:pointer;transition:all .15s">
          ${t==='suppliers'?'👥 Par fournisseur':'📦 Par article'}
        </button>`).join('')}
    </div>
    <div style="display:flex;background:#fff;border:1px solid var(--gray200);border-radius:10px;overflow:hidden">
      ${['all','month','quarter','year'].map(p=>`
        <button onclick="analysisPeriod='${p}';renderAnalyses()" style="padding:8px 14px;font-size:12px;font-weight:600;border:none;background:${analysisPeriod===p?'var(--orange)':'#fff'};color:${analysisPeriod===p?'#fff':'var(--text2)'};cursor:pointer;transition:all .15s">
          ${pLabels[p]}
        </button>`).join('')}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="exportAnalysis()">⬇ Exporter</button>
  </div>

  <!-- TABLE SUPPLIERS -->
  ${analysisTab==='suppliers'?`
  <div class="card">
    <div class="card-header">
      <span class="card-title">Dépenses par fournisseur</span>
      <span class="text-muted" style="font-size:12px">${supRows.length} fournisseur(s) · ${pLabels[analysisPeriod]}</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${_ath('name','Fournisseur',false)}
          ${_ath('nb','Nb BC',false)}
          <th>Articles commandés</th>
          ${_ath('ht','Total HT',false)}
          <th>TVA</th>
          ${_ath('ttc','Total TTC',false)}
          <th>Part (%)</th>
          <th>Payé</th>
          <th>Restant dû</th>
        </tr></thead>
        <tbody>
          ${supRows.map(r=>{
            const sup=db.find('suppliers',r.supplier_id);
            const pct=totalTTC>0?((r.ttc/totalTTC)*100).toFixed(1):0;
            const artCount=[...new Set(r.bcs.flatMap(o=>(o.lines||[]).map(l=>l.article_id)))].length;
            return `<tr>

        </tr></tfoot>
      </table>
    </div>
  </div>

  <!-- Detail accordion by supplier -->
  <div style="margin-top:20px">
    <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:14px;margin-bottom:12px">Détail des commandes par fournisseur</div>
    ${supRows.map(r=>{
      const sup=db.find('suppliers',r.supplier_id);
      return `<div class="card" style="margin-bottom:12px">
        <div class="card-header" style="cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
          <span class="card-title">${sup?sup.name:'Sans fournisseur'} <span style="font-weight:400;color:var(--text3);font-size:13px">${r.nb_bc} BC · ${fmt.money(r.ttc)} TTC</span></span>
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>

          <div class="table-wrap">
            <table>
              <thead><tr><th>N° BC</th><th>Date</th><th>HT</th><th>TTC</th><th>Statut</th><th></th></tr></thead>
              <tbody>

function exportAnalysis(){
  const orders=db.all('orders');
  const payments=db.all('payments');
  let data,filename;
  if(analysisTab==='suppliers'){
    data=[];
    const supMap={};
    orders.forEach(o=>{
      const sid=o.supplier_id||0;
      if(!supMap[sid])supMap[sid]={supplier_id:sid,nb_bc:0,ht:0,tva:0,ttc:0,paid:0,unpaid:0};
      supMap[sid].nb_bc++;supMap[sid].ht+=bcTotal(o);supMap[sid].tva+=bcTVA(o);supMap[sid].ttc+=bcTTC(o);
      payments.filter(p=>p.bc_id===o.id).forEach(p=>{
        if(p.status==='paid')supMap[sid].paid+=p.montant||0;else supMap[sid].unpaid+=p.montant||0;
      });
    });
    Object.values(supMap).forEach(r=>{
      const sup=db.find('suppliers',r.supplier_id);
      data.push({Fournisseur:sup?sup.name:'–','Nb BC':r.nb_bc,'Total HT':r.ht,'TVA':r.tva,'Total TTC':r.ttc,'Payé':r.paid,'Restant dû':r.unpaid});
    });
    filename='analyse_fournisseurs.xlsx';
  }else{
    const artMap={};
    orders.forEach(o=>{
      (o.lines||[]).forEach(l=>{
        const aid=l.article_id||l.designation;
        if(!artMap[aid])artMap[aid]={designation:l.designation,ref:'',qty:0,ht:0,ttc:0};
        artMap[aid].qty+=l.qty;artMap[aid].ht+=l.qty*(l.prix||0);
        artMap[aid].ttc+=l.qty*(l.prix||0)*(1+(l.tva||18)/100);
        const art=db.find('articles',l.article_id);if(art)artMap[aid].ref=art.ref||'';
      });
    });
    data=Object.values(artMap).map(r=>({Référence:r.ref,Désignation:r.designation,'Qté totale':r.qty,'Total HT':r.ht,'Total TTC':r.ttc}));
    filename='analyse_articles.xlsx';
  }
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Analyse');
  XLSX.writeFile(wb,filename);
  showAlert('Export téléchargé');
}

function saveProfile(){
  const name=document.getElementById('prof-name').value.trim();
  const login=document.getElementById('prof-login').value.trim();
  const oldPass=document.getElementById('prof-pass-old').value;
  const newPass=document.getElementById('prof-pass-new').value;
  const confirmPass=document.getElementById('prof-pass-confirm').value;
  const alertEl=document.getElementById('profile-alert');

  if(!name||!login){
    alertEl.innerHTML='<div class="alert alert-error">Le nom et l\'identifiant sont obligatoires.</div>';return;
  }

  // Check login uniqueness (excluding self)
  const others=db.all('users').filter(u=>u.id!==currentUser.id);
  if(others.find(u=>u.login===login)){
    alertEl.innerHTML='<div class="alert alert-error">Cet identifiant est déjà utilisé.</div>';return;
  }

  // Password change
  let newPasswordToSave=currentUser.pass;
  if(oldPass||newPass||confirmPass){
    if(oldPass!==currentUser.pass){
      alertEl.innerHTML='<div class="alert alert-error">Mot de passe actuel incorrect.</div>';return;
    }
    if(!newPass){
      alertEl.innerHTML='<div class="alert alert-error">Veuillez saisir un nouveau mot de passe.</div>';return;
    }
    if(newPass!==confirmPass){
      alertEl.innerHTML='<div class="alert alert-error">Les mots de passe ne correspondent pas.</div>';return;
    }
    newPasswordToSave=newPass;
  }

  // Save
  const updated={...currentUser,name,login,pass:newPasswordToSave};
  db.save('users',updated);
  currentUser=updated;
  sessionStorage.setItem('gc_session',JSON.stringify(updated));
  renderNav(); // Refresh sidebar avatar & name
  closeModal();
  showAlert('Profil mis à jour avec succès');
}

                ${u.role==='admin'?'<span style="font-size:11px;color:var(--green);font-weight:600">✅ Admin</span>':asleep?'<span style="font-size:11px;color:#dc2626;font-weight:600">😴 En sommeil</span>':'<span style="font-size:11px;color:var(--green);font-weight:600">✅ Actif</span>'}
              </td>
              <td><div class="td-actions">
                <button class="btn btn-sm btn-secondary" onclick="openUserModal(${u.id})">Modifier</button>
                ${u.id!==currentUser.id&&u.role!=='admin'?`<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Supprimer</button>`:''}
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Tâches gelées (si des rôles sont en sommeil) -->
  ${sleeping.length?`
  <div class="card" style="margin-top:20px;border:2px solid #fecaca">
    <div class="card-header" style="background:#fef2f2">
      <span class="card-title" style="color:#991b1b">😴 Tâches gelées — visibles admin uniquement</span>
      <span style="font-size:12px;color:#dc2626">Rôles en sommeil : ${sleeping.map(r=>ROLE_LABELS[r]).join(', ')}</span>
    </div>
    <div class="card-body">
      ${sleeping.map(role=>{
        const frozenNav=NAV.filter(n=>n.roles.includes(role)&&!n.roles.includes('admin'));
        const rolePerms={
          achat:['Créer / modifier des BC','Gérer fournisseurs & articles','Voir les paiements','Importer des données'],
          stock:['Enregistrer des réceptions','Gérer les articles','Voir les BC','Importer des données'],
          finance:['Enregistrer des paiements','Modifier les paiements','Voir les BC']
        };
        return `<div style="margin-bottom:16px">
          <div style="font-weight:700;font-size:13px;color:#991b1b;margin-bottom:8px">Rôle ${ROLE_LABELS[role]} — actions gelées :</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${(rolePerms[role]||[]).map(a=>`<span style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600">🔒 ${a}</span>`).join('')}
          </div>
          <div style="margin-top:10px">
            <button onclick="toggleRoleSleep('${role}')" class="btn btn-success btn-sm">🔓 Réactiver ${ROLE_LABELS[role]}</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`:''}`;
}

function toggleRoleSleep(role){
  if(role==='admin')return;
  const sleeping=getSleepingRoles();
  const idx=sleeping.indexOf(role);
  if(idx>=0){
    sleeping.splice(idx,1);
    showAlert(`Rôle ${ROLE_LABELS[role]} réactivé — connexions et actions restaurées`,'success');
  } else {
    sleeping.push(role);
    showAlert(`Rôle ${ROLE_LABELS[role]} mis en sommeil — actions gelées`,'error');
  }
  db.set('sleeping_roles',sleeping);
  renderUsers();
}

          <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px">
            <input type="radio" name="usr-color" value="${c.value}" ${u&&u.theme===c.value?'checked':!u&&c.value==='#f97316'?'checked':''} style="display:none" id="uc-${c.value.slice(1)}">
            <div onclick="document.querySelectorAll('.color-swatch').forEach(x=>x.style.outline='none');this.style.outline='3px solid #333';document.getElementById('uc-${c.value.slice(1)}').checked=true;document.getElementById('usr-color-custom').value='${c.value}'"
              class="color-swatch"
              style="width:32px;height:32px;border-radius:50%;background:${c.value};cursor:pointer;outline:${u&&u.theme===c.value?'3px solid #333':!u&&c.value==='#f97316'?'3px solid #333':'none'};outline-offset:2px;transition:outline .1s"></div>

            <input class="form-control" id="usr-color-hex" value="${u?u.theme||'#f97316':'#f97316'}" placeholder="#f97316" style="flex:1" oninput="document.getElementById('usr-color-custom').value=this.value">

  setTimeout(()=>{
    const cp=document.getElementById('usr-color-custom');
    const hx=document.getElementById('usr-color-hex');
    if(cp&&hx)cp.addEventListener('input',()=>{hx.value=cp.value;});

function saveUser(id){
  const name=document.getElementById('usr-name').value.trim();
  const login=document.getElementById('usr-login').value.trim();
  const pass=document.getElementById('usr-pass').value;
  const role=document.getElementById('usr-role').value;
  const colorCustom=document.getElementById('usr-color-custom').value;
  if(!name||!login){showAlert('Nom et identifiant sont obligatoires','error');return;}
  if(!id&&!pass){showAlert('Le mot de passe est obligatoire pour un nouvel utilisateur','error');return;}
  // Check login uniqueness
  const existing=db.all('users').find(u=>u.login===login&&u.id!==id);
  if(existing){showAlert('Cet identifiant est déjà utilisé','error');return;}

  const u=id?db.find('users',id):{id:db.nextId('users')};
  u.name=name; u.login=login; u.role=role; u.theme=colorCustom||'#f97316';
  if(pass)u.pass=pass;
  db.save('users',u);
  logAction(id?'Modifié':'Créé','Utilisateur',u.name+' ('+u.login+')',`rôle: ${u.role}`);

  // If modifying current user, update session and reapply theme
  if(id&&id===currentUser.id){
    currentUser=u;
    sessionStorage.setItem('gc_session',JSON.stringify(u));
    applyUserTheme(u);
    renderNav();
  }
  closeModal();renderUsers();showAlert(id?'Utilisateur mis à jour':'Utilisateur créé');
}

function deleteUser(id){
  if(!confirm('Supprimer cet utilisateur ?'))return;
  const _u=db.find('users',id);
  logAction('Supprimé','Utilisateur',_u?_u.name+' ('+_u.login+')':('#'+id));
  db.delete('users',id);renderUsers();showAlert('Utilisateur supprimé');
}

function getNotifications(){
  return (db.get('notifications')||[]).filter(n=>
    n.to_user_id===currentUser.id||
    n.to_role===currentUser.role||
    n.to_role==='all'
  ).sort((a,b)=>b.created_at.localeCompare(a.created_at));
}

function getUnreadCount(){
  return getNotifications().filter(n=>!n.read_by||!n.read_by.includes(currentUser.id)).length;
}

function updateNotifBadge(){
  const count=getUnreadCount();
  const badge=document.getElementById('notif-badge');
  if(!badge)return;
  if(count>0){badge.textContent=count>9?'9+':count;badge.style.display='flex';}
  else{badge.style.display='none';}
}

function toggleNotifPanel(){
  const panel=document.getElementById('notif-panel');
  if(!panel)return;
  const isOpen=panel.style.display==='flex';
  panel.style.display=isOpen?'none':'flex';
  if(!isOpen)renderNotifList();
}

function renderNotifList(){
  const notifs=getNotifications();
  const list=document.getElementById('notif-list');
  if(!list)return;
  if(!notifs.length){
    list.innerHTML='<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">Aucune notification</div>';
    return;
  }
  list.innerHTML=notifs.map(n=>{
    const isRead=n.read_by&&n.read_by.includes(currentUser.id);
    const sender=db.find('users',n.from_user_id);
    const toLabel=n.to_role==='all'?'Tous':n.to_role?({achat:'Achats',stock:'Magasin',finance:'Finance',admin:'Admin'}[n.to_role]||n.to_role):(db.find('users',n.to_user_id)||{name:'?'}).name;
    return `<div onclick="markRead(${n.id})" style="padding:12px 16px;border-bottom:1px solid var(--gray100);cursor:pointer;background:${isRead?'#fff':'#fff8f0'};transition:background .15s"
      onmouseenter="this.style.background='var(--gray50)'" onmouseleave="this.style.background='${isRead?'#fff':'#fff8f0'}'">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:6px">
          ${!isRead?'<span style="width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;display:inline-block"></span>':'<span style="width:8px;height:8px;flex-shrink:0;display:inline-block"></span>'}
          <strong style="font-size:12px;color:var(--text)">${sender?sender.name:'Système'}</strong>
          <span style="font-size:10px;color:var(--text3)">→ ${toLabel}</span>
        </div>
        <span style="font-size:10px;color:var(--text3);white-space:nowrap">${fmt.date(n.created_at.slice(0,10))}</span>
      </div>
      <div style="font-size:13px;color:var(--text2);padding-left:14px;line-height:1.4">${n.message}</div>
      ${n.bc_id?`<div style="padding-left:14px;margin-top:4px"><span onclick="event.stopPropagation();closeNotifPanel();setTimeout(()=>viewOrder(${n.bc_id}),50)" style="font-size:11px;color:var(--orange);font-weight:600;cursor:pointer">📋 Voir le BC →</span></div>`:''}
      ${can('delete')?`<div style="padding-left:14px;margin-top:2px"><span onclick="event.stopPropagation();deleteNotif(${n.id})" style="font-size:10px;color:var(--text3);cursor:pointer">Supprimer</span></div>`:''}
    </div>`;
  }).join('');
  updateNotifBadge();
}

function markRead(id){
  const notifs=db.get('notifications')||[];
  const n=notifs.find(x=>x.id===id);
  if(n){if(!n.read_by)n.read_by=[];if(!n.read_by.includes(currentUser.id))n.read_by.push(currentUser.id);}
  db.set('notifications',notifs);
  renderNotifList();updateNotifBadge();
}

function markAllRead(){
  const notifs=db.get('notifications')||[];
  const mine=getNotifications().map(n=>n.id);
  notifs.forEach(n=>{if(mine.includes(n.id)){if(!n.read_by)n.read_by=[];if(!n.read_by.includes(currentUser.id))n.read_by.push(currentUser.id);}});
  db.set('notifications',notifs);
  renderNotifList();updateNotifBadge();
}

function deleteNotif(id){
  db.set('notifications',(db.get('notifications')||[]).filter(n=>n.id!==id));
  renderNotifList();updateNotifBadge();
}

function closeNotifPanel(){
  const panel=document.getElementById('notif-panel');
  if(panel)panel.style.display='none';
}

function openSendNotifModal(bcId=null){
  const users=db.all('users').filter(u=>u.id!==currentUser.id);
  showModal(`
  <div class="modal modal-md">
    <div class="modal-header">
      <span class="modal-title">💬 Envoyer une notification</span>
      <button class="btn-icon" onclick="closeModal()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button>

        <select class="form-control" id="notif-to">
          <option value="role:all">📢 Tout le monde</option>
          <option value="role:achat">👥 Service Achats</option>
          <option value="role:stock">📦 Magasin / Stock</option>
          <option value="role:finance">💰 Finance</option>

          </optgroup>
        </select>
      </div>
      ${bcId?`<div class="alert alert-info" style="margin-bottom:16px">📋 Lié au BC : <strong>${(db.find('orders',bcId)||{}).numero||bcId}</strong></div>`:''}
      <div class="form-group">
        <label class="form-label">Message *</label>
        <textarea class="form-control" id="notif-msg" rows="4" placeholder="Votre message..."></textarea>
      </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="sendNotification(${bcId||'null'})">Envoyer</button>
    </div>
  </div>`);
}

function sendNotification(bcId){
  const toVal=document.getElementById('notif-to').value;
  const msg=document.getElementById('notif-msg').value.trim();
  if(!msg){showAlert('Écrivez un message','error');return;}
  const notif={
    id:db.nextId('notifications'),
    from_user_id:currentUser.id,
    created_at:new Date().toISOString(),
    message:msg,
    read_by:[],
    bc_id:bcId||null
  };
  if(toVal.startsWith('role:')){notif.to_role=toVal.slice(5);}
  else{notif.to_user_id=+toVal.slice(5);}
  db.save('notifications',notif);
  closeModal();showAlert('Notification envoyée');
  updateNotifBadge();
}

});

};

function applyTheme(name, custom=null){
  const theme=custom||(THEMES[name]||THEMES['Soleil (défaut)']);
  const root=document.documentElement;
  root.style.setProperty('--orange', theme.primary);
  root.style.setProperty('--orange2', theme.primary2);
  root.style.setProperty('--orange-light', theme.primaryLight);
  root.style.setProperty('--navy', theme.navy);
  root.style.setProperty('--navy2', theme.navy2);
  root.style.setProperty('--green', theme.accent);
  root.style.setProperty('--green-light', theme.accentLight);
  localStorage.setItem('gc_theme_name', name);
  if(custom)localStorage.setItem('gc_theme_custom', JSON.stringify(custom));
}

function toggleDarkMode(){
  const isDark=document.body.classList.toggle('dark-mode');
  localStorage.setItem('gc_dark_mode', isDark?'1':'0');
  document.getElementById('theme-icon-moon').style.display=isDark?'none':'block';
  document.getElementById('theme-icon-sun').style.display=isDark?'block':'none';
  logAction(isDark?'Thème sombre activé':'Thème clair activé','Système','');
}

function loadDarkModePref(){
  const isDark=localStorage.getItem('gc_dark_mode')==='1';
  if(isDark){
    document.body.classList.add('dark-mode');
    const moon=document.getElementById('theme-icon-moon');
    const sun=document.getElementById('theme-icon-sun');
    if(moon)moon.style.display='none';
    if(sun)sun.style.display='block';
  }
}

function loadSavedTheme(){
  const name=localStorage.getItem('gc_theme_name');
  if(!name)return;
  if(name==='Personnalisé'){
    const custom=localStorage.getItem('gc_theme_custom');
    if(custom){try{applyTheme('Personnalisé',JSON.parse(custom));}catch(e){}}
  } else if(THEMES[name]){
    applyTheme(name);
  }
}

function applyCustomTheme(){
  const p=document.getElementById('th-primary').value;
  const n=document.getElementById('th-navy').value;
  const a=document.getElementById('th-accent').value;
  const hexToRgba=(hex,alpha)=>{
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  };
  const darken=(hex)=>{
    const r=Math.max(0,parseInt(hex.slice(1,3),16)-25);
    const g=Math.max(0,parseInt(hex.slice(3,5),16)-25);
    const b=Math.max(0,parseInt(hex.slice(5,7),16)-25);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  };
  const custom={
    primary:p, primary2:darken(p), primaryLight:hexToRgba(p,0.10),
    navy:n, navy2:darken(n),
    accent:a, accentLight:hexToRgba(a,0.10)
  };
  applyTheme('Personnalisé',custom);
  logAction('Thème personnalisé appliqué','Système','',`primaire:${p}, accent:${a}`);
  showAlert('Couleurs personnalisées appliquées');
}

function applyUserTheme(user){
  const color=(user&&user.theme)||'#f97316';
  const hex=color.replace('#','');
  const r=parseInt(hex.slice(0,2),16)||249;
  const g=parseInt(hex.slice(2,4),16)||115;
  const b=parseInt(hex.slice(4,6),16)||22;
  const darker=`rgb(${Math.max(0,r-25)},${Math.max(0,g-25)},${Math.max(0,b-25)})`;
  const light=`rgba(${r},${g},${b},0.10)`;
  document.documentElement.style.setProperty('--orange', color);
  document.documentElement.style.setProperty('--orange2', darker);
  document.documentElement.style.setProperty('--orange-light', light);
}

function hardReset(){

  DB_KEYS.forEach(k=>localStorage.removeItem('gc_'+k));
  localStorage.removeItem('gc_version');
  sessionStorage.removeItem('gc_session');
  location.reload();
}

// Boot async — version check + Supabase + localStorage
const APP_VERSION = '3.1';
async function bootApp(){
  // Version check — force reset si version change
  const storedVersion=localStorage.getItem('gc_version');
  if(storedVersion && storedVersion!==APP_VERSION){
    console.log(`ProcureFlow X: migration ${storedVersion} → ${APP_VERSION}`);
    // Ne reset que les collections qui ont changé de structure
    ['demandes','comparaisons'].forEach(k=>localStorage.removeItem('gc_'+k));
    localStorage.setItem('gc_version',APP_VERSION);
  }

  // Migrer les anciens numéros de BC si besoin
  const storedOrders=localStorage.getItem('gc_orders');
  if(storedOrders){
    try{
      const orders=JSON.parse(storedOrders);
      if(orders.some(o=>o.numero&&o.numero.startsWith('BC-'))){
        const fixed=orders.map(o=>{
          if(o.numero&&o.numero.match(/^BC-(\d{4})-(\d+)$/)){
            const m=o.numero.match(/^BC-(\d{4})-(\d+)$/);
            o.numero=m[2]+'-'+m[1];
          }
          return o;
        });
        localStorage.setItem('gc_orders',JSON.stringify(fixed));
      }
    }catch(e){}
  }

  // Charger les données (IndexedDB + localStorage)
  try{ await db.loadAll(); }catch(e){ console.warn('db.loadAll() error:',e); }
  db.init();

  // Restaurer les préférences d'affichage
  try{loadSavedTheme();}catch(e){}
  try{loadDarkModePref();}catch(e){}

  // Auto-login si session active
  const saved=sessionStorage.getItem('gc_session');
  if(saved){
    try{
      currentUser=JSON.parse(saved);
      // Rafraîchir depuis la DB pour avoir les dernières infos
      const fresh=db.find('users',currentUser.id);
      if(fresh) currentUser=fresh;
      launchApp();
    }catch(e){
      sessionStorage.removeItem('gc_session');
    }
  }
}
bootApp();

function submitDA(id){

  closeModal(); renderDemandes(); showAlert(`${da.numero} soumise pour approbation`);
}
function approveDA(id){
  const da=db.find('demandes',id); if(!da) return;
  da.status='approved'; da.approuve_par=currentUser.name; da.date_approbation=fmt.today();
  db.save('demandes',da);
  logAction('Approuvée','Demande DA',da.numero);
  closeModal(); renderDemandes(); showAlert(`${da.numero} approuvée ✓`);
  setTimeout(()=>viewDA(id),300);
}
function rejectDA(id){
  const motif=prompt('Motif du rejet :'); if(motif===null) return;
  const da=db.find('demandes',id); if(!da) return;
  da.status='rejected'; da.motif_rejet=motif;
  db.save('demandes',da);
  logAction('Rejetée','Demande DA',da.numero,motif);
  closeModal(); renderDemandes(); showAlert(`${da.numero} rejetée`,'error');
}

function daLineRowHtml(idx,l={},arts){
  return `<tr id="da-row-${idx}">
    <td style="color:var(--text3);font-weight:700;text-align:center">${idx+1}</td>
    <td><input type="text" id="da-l${idx}-des" class="form-control form-control-sm" value="${(l.designation||'').replace(/"/g,'&quot;')}" placeholder="Nom de l'article / besoin" oninput=""></td>
    <td><select id="da-l${idx}-art" class="form-control form-control-sm" onchange="daFillFromCatalogue(${idx})">
      <option value="">-- Catalogue (optionnel) --</option>
      ${arts.map(a=>`<option value="${a.id}"${l.article_id===a.id?' selected':''}>${a.ref} – ${a.designation.substring(0,30)}</option>`).join('')}
    </select></td>
    <td><input type="number" id="da-l${idx}-qty" class="form-control form-control-sm" value="${l.qty||1}" min="0.01" step="any" style="text-align:center"></td>
    <td><input type="text" id="da-l${idx}-unite" class="form-control form-control-sm" value="${l.unite||''}" placeholder="Rame, Pcs, Kg…"></td>
    <td><input type="text" id="da-l${idx}-com" class="form-control form-control-sm" value="${(l.commentaire||'').replace(/"/g,'&quot;')}" placeholder="Commentaire…"></td>
    <td><button type="button" onclick="daRemoveRow(${idx})" style="width:28px;height:28px;border-radius:6px;background:var(--red-light);color:var(--red);border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center">✕</button></td>
  </tr>`;
}

function daFillFromCatalogue(idx){
  const sel=document.getElementById(`da-l${idx}-art`); if(!sel||!sel.value) return;
  const art=db.find('articles',+sel.value); if(!art) return;
  const desEl=document.getElementById(`da-l${idx}-des`);
  const unEl=document.getElementById(`da-l${idx}-unite`);
  if(desEl&&!desEl.value) desEl.value=art.designation;
  if(unEl&&!unEl.value) unEl.value=art.unite||'';
}

function daAddLine(){
  const idx=_daLineCount++;
  const arts=db.all('articles');
  const tbody=document.getElementById('da-lines-body'); if(!tbody) return;
  const tr=document.createElement('tr'); tr.id=`da-row-${idx}`;
  tr.innerHTML=daLineRowHtml(idx,{},arts).replace(/^<tr[^>]*>/,'').replace(/<\/tr>$/,'');
  tbody.appendChild(tr);
  document.getElementById(`da-l${idx}-des`)?.focus();
}

function daRemoveRow(idx){
  const rows=document.querySelectorAll('#da-lines-body tr');
  if(rows.length<=1){alert('La demande doit avoir au moins une ligne.');return;}
  document.getElementById(`da-row-${idx}`)?.remove();
}

function _collectDALinesFromForm(){
  const lines=[];
  document.querySelectorAll('#da-lines-body tr').forEach(row=>{
    const idx=row.id.replace('da-row-','');
    const desEl=document.getElementById(`da-l${idx}-des`);
    if(!desEl) return;
    const des=desEl.value.trim();
    const artId=+document.getElementById(`da-l${idx}-art`)?.value||null;
    const qty=parseFloat(document.getElementById(`da-l${idx}-qty`)?.value)||0;
    const unite=document.getElementById(`da-l${idx}-unite`)?.value.trim()||'';
    const com=document.getElementById(`da-l${idx}-com`)?.value.trim()||'';
    if(!des&&!artId) return;
    const art=artId?db.find('articles',artId):null;
    lines.push({article_id:artId,designation:des||(art?.designation||''),qty,unite:unite||(art?.unite||''),commentaire:com});
  });
  return lines;
}

function saveDA(id,targetStatus){
  const designation=document.getElementById('da-designation')?.value.trim();
  const demandeur=document.getElementById('da-demandeur')?.value.trim();
  const service=document.getElementById('da-service')?.value;
  if(!designation){alert('La désignation est obligatoire.');return;}
  if(!demandeur){alert('Le demandeur est obligatoire.');return;}
  const lines=_collectDALinesFromForm();
  if(!lines.length){alert('Ajoutez au moins un article.');return;}
  const invalidLine=lines.find(l=>!l.qty||l.qty<=0);
  if(invalidLine){alert(`La quantité de "${invalidLine.designation}" doit être supérieure à 0.`);return;}
  const missingUnite=lines.find(l=>!l.unite);
  if(missingUnite){alert(`Renseignez l'unité pour "${missingUnite.designation}".`);return;}

  const existing=id&&id!=='null'?db.find('demandes',+id):null;
  const item={
    id:existing?existing.id:db.nextId('demandes'),
    numero:existing?existing.numero:nextDANum(),
    date:fmt.today(),
    demandeur, service, designation,
    priorite:document.getElementById('da-priorite')?.value||'normale',
    date_souhaitee:document.getElementById('da-date-souhaitee')?.value||null,
    objectifs:document.getElementById('da-objectifs')?.value.trim()||'',
    notes:document.getElementById('da-notes')?.value.trim()||'',
    lines, status:targetStatus,
    approuve_par:existing?.approuve_par||null,
    date_approbation:existing?.date_approbation||null,
    motif_rejet:existing?.motif_rejet||null
  };
  db.save('demandes',item);
  logAction(existing?'Modifiée':'Créée','Demande DA',item.numero,`${lines.length} article(s) · statut: ${targetStatus}`);
  closeModal(); renderDemandes();
  showAlert(existing?`${item.numero} mise à jour`:`${item.numero} ${targetStatus==='submitted'?'soumise pour approbation':'enregistrée en brouillon'}`);
}

// Créer une comparaison depuis une DA approuvée
function createComparaisonFromDA(daId){
  const da=db.find('demandes',daId); if(!da) return;
  if(da.status!=='approved'){showAlert('La DA doit être approuvée d\'abord.','error');return;}
  // Créer la comparaison avec les articles de la DA
  const comp={
    id:db.nextId('comparaisons'),
    numero:nextCompNum(),
    da_id:daId,
    date:fmt.today(),
    objet:da.designation,
    status:'open',
    offres:da.lines.map(l=>({
      article_id:l.article_id,
      designation:l.designation,
      qty:l.qty,
      unite:l.unite,
      supplier_offers:[]
    })),
    notes:'',
    conclusion:''
  };
  db.save('comparaisons',comp);
  // Passer la DA en "comparing"
  da.status='comparing'; db.save('demandes',da);
  logAction('Créée','Comparaison',comp.numero,`depuis ${da.numero}`);
  showAlert(`Comparaison ${comp.numero} créée`);
  navigate('comparaisons');
  setTimeout(()=>viewComparaison(comp.id),300);
}

  // Calcul best price par article
  function bestOffer(offre){
    const valid=offre.supplier_offers.filter(s=>s.prix_unit>0);

    return valid.reduce((a,b)=>a.prix_unit<b.prix_unit?a:b);

  // Colonnes fournisseurs (union de tous les supplier_ids utilisés)
  const allSupIds=[...new Set((c.offres||[]).flatMap(o=>o.supplier_offers.map(s=>s.supplier_id)))];

  showModal(`<div class="modal modal-xl">

      </div>
      <div class="gap-8">
        <button class="btn btn-secondary btn-sm no-print" onclick="printComparaison(${id})">🖨 Imprimer</button>
        <button class="btn-icon" onclick="closeModal()"><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
    </div>
    <div class="modal-body">

function toggleCompSupplier(compId,supplierId,checked){
  const c=db.find('comparaisons',compId); if(!c) return;
  if(checked){
    // Ajouter ce fournisseur à tous les articles qui ne l'ont pas
    (c.offres||[]).forEach(o=>{
      if(!o.supplier_offers.find(s=>s.supplier_id===supplierId))
        o.supplier_offers.push({supplier_id:supplierId,prix_unit:0,delai:'',notes:''});
    });
  } else {
    // Retirer ce fournisseur de tous les articles
    (c.offres||[]).forEach(o=>{ o.supplier_offers=o.supplier_offers.filter(s=>s.supplier_id!==supplierId); });
  }
  db.save('comparaisons',c);
  setTimeout(()=>viewComparaison(compId),50);
}

function saveCompPrice(compId,artIdx,supplierId,val){
  const c=db.find('comparaisons',compId); if(!c) return;
  const offre=c.offres[artIdx]; if(!offre) return;
  let so=offre.supplier_offers.find(s=>s.supplier_id===supplierId);
  if(!so){so={supplier_id:supplierId,prix_unit:0,delai:'',notes:''};offre.supplier_offers.push(so);}
  so.prix_unit=parseFloat(val)||0;
  db.save('comparaisons',c);
  logAction('Modifiée','Comparaison',c.numero,`Prix saisi – art. ${artIdx+1} fournisseur #${supplierId}`);
}

function saveCompDelai(compId,artIdx,supplierId,val){
  const c=db.find('comparaisons',compId); if(!c) return;
  const offre=c.offres[artIdx]; if(!offre) return;
  let so=offre.supplier_offers.find(s=>s.supplier_id===supplierId);
  if(!so){so={supplier_id:supplierId,prix_unit:0,delai:'',notes:''};offre.supplier_offers.push(so);}
  so.delai=val;
  db.save('comparaisons',c);
}

function saveCompConclusion(compId){
  const c=db.find('comparaisons',compId); if(!c) return;
  c.conclusion=document.getElementById('comp-conclusion')?.value.trim()||'';
  db.save('comparaisons',c);
  logAction('Modifiée','Comparaison',c.numero,'Conclusion mise à jour');
  showAlert('Conclusion sauvegardée');
}

function closeComparaison(compId){
  if(!confirm('Clôturer cette comparaison ? Elle passera en lecture seule.')) return;
  const c=db.find('comparaisons',compId); if(!c) return;
  c.status='closed'; db.save('comparaisons',c);
  // Mettre à jour la DA si applicable
  if(c.da_id){const da=db.find('demandes',c.da_id);if(da&&da.status==='comparing'){da.status='approved';db.save('demandes',da);}}
  logAction('Clôturée','Comparaison',c.numero);
  closeModal(); renderComparaisons(); showAlert(`${c.numero} clôturée`);
}

function ghostResetPassword(){
  const uid=+document.getElementById('ghost-reset-user').value;
  const pwd=document.getElementById('ghost-new-pwd').value.trim();
  if(!uid||!pwd){showAlert('Sélectionnez un utilisateur et saisissez un mot de passe','error');return;}
  const u=db.find('users',uid);if(!u)return;
  u.pass=pwd;db.save('users',u);
  logAction('Mot de passe réinitialisé','Utilisateur',u.name+' ('+u.login+')');
  document.getElementById('ghost-new-pwd').value='';
  document.getElementById('ghost-reset-user').value='';
  showAlert('Mot de passe de '+u.name+' réinitialisé');
}
function ghostToggleRole(role){
  const sleeping=db.get('sleeping_roles')||[];
  const idx=sleeping.indexOf(role);
  const willSleep=idx<0;
  if(idx>=0)sleeping.splice(idx,1); else sleeping.push(role);
  db.set('sleeping_roles',sleeping);
  logAction(willSleep?'Rôle gelé':'Rôle réactivé','Système',role);
  renderGhostPanel();
  showAlert('Rôle '+(sleeping.includes(role)?'gelé':'réactivé'));
}
function ghostPurgeNotifications(){if(!confirm('Supprimer toutes les notifications ?'))return;db.set('notifications',[]);renderGhostPanel();showAlert('Notifications supprimées');}
function ghostPurgeEvaluations(){if(!confirm('Effacer toutes les évaluations ?'))return;db.set('evaluations',[]);renderGhostPanel();showAlert('Évaluations supprimées');}
function ghostExportRaw(){
  const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','notifications','sleeping_roles'];
  const data={};KEYS.forEach(k=>{data[k]=db.get(k)||[];});
  const json=JSON.stringify({exported_by:'ADMIN_SYSTEM',date:new Date().toISOString(),data},null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='GC_RAW_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showAlert('Export RAW téléchargé');
}

function saveAccess(col,id){
  const item=db.find(col,id);if(!item)return;
  const ROLES=['achat','stock','finance'];
  const viewRoles=ROLES.filter(r=>document.getElementById('acc-view-'+r)?.checked);
  const editRoles=ROLES.filter(r=>document.getElementById('acc-edit-'+r)?.checked);
  item.access_roles=viewRoles.length===ROLES.length?[]:viewRoles;
  item.edit_roles=editRoles.length===ROLES.length?[]:editRoles;
  item.locked=document.getElementById('acc-locked')?.checked||false;
  db.save(col,item);
  const _typeLabel={orders:'BC',suppliers:'Fournisseur',articles:'Article'}[col]||col;
  const _itemLabel=item.numero||item.name||item.designation||('#'+id);
  logAction('Accès modifié',_typeLabel,_itemLabel,item.locked?'verrouillé':'');
  closeModal();showAlert('Accès mis à jour');
  if(col==='orders')renderOrders();
  else if(col==='suppliers')renderSuppliers();
  else if(col==='articles')renderArticles();
}

// ═══════════════════════════════════════════════
function autoBackupCheck(){
  if(!currentUser)return;
  const now=new Date();const hh=now.getHours();const mm=now.getMinutes();
  if((hh===13||hh===17)&&mm<=1){
    const key='gc_auto_backup_'+hh+'_'+now.toDateString();
    if(!localStorage.getItem(key)){
      localStorage.setItem(key,'done');
      Object.keys(localStorage).filter(k=>k.startsWith('gc_auto_backup_')&&!k.includes(now.toDateString())).forEach(k=>localStorage.removeItem(k));
      silentAutoBackup();
    }
  }
}
function silentAutoBackup(){
  const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','notifications','sleeping_roles'];
  const backup={version:'auto',app:'GestiCommande-RICHBOND',date:new Date().toISOString(),auto:true,data:{}};
  KEYS.forEach(k=>{backup.data[k]=db.get(k)||[];});
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const now=new Date();
  a.download='GC_auto_'+now.toISOString().slice(0,10).replace(/-/g,'')+'_'+String(now.getHours()).padStart(2,'0')+'h.json';
  a.style.display='none';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
  const nowStr=now.toLocaleString('fr-FR');localStorage.setItem('gc_last_backup',nowStr);
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:36px;right:12px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px';
  toast.innerHTML='<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#10b981" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>Sauvegarde automatique effectuée ('+now.getHours()+'h00)';
  document.body.appendChild(toast);
  setTimeout(()=>{toast.style.opacity='0';toast.style.transition='opacity .5s';setTimeout(()=>toast.remove(),500);},4000);
}

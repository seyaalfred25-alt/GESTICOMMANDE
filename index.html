<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GestiCommande</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --orange:#f97316;--orange2:#ea580c;--orange-light:#fff7ed;
  --green:#10b981;--green-light:#ecfdf5;
  --red:#ef4444;--red-light:#fef2f2;
  --yellow:#f59e0b;--yellow-light:#fffbeb;
  --blue:#3b82f6;--blue-light:#eff6ff;
  --gray50:#f8fafc;--gray100:#f1f5f9;--gray200:#e2e8f0;--gray300:#cbd5e1;
  --gray400:#94a3b8;--gray500:#64748b;--gray600:#475569;--gray700:#334155;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --card:#ffffff;--bg:#f1f5f9;
  --sidebar-w:250px;--topbar-h:60px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;
  min-height:100vh;min-height:100dvh;
  width:100%;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
html{height:100%;height:100dvh}
#app-shell{min-height:100vh;min-height:100dvh;width:100%}
#main{min-height:100vh;min-height:100dvh}
h1,h2,h3,.logo{font-family:'Inter',sans-serif}
button{cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;border:none;outline:none}
input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;outline:none;border:none}

/* ── LOGIN ─────────────────────────────────────────────── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);
  padding:16px;
}
.login-box{
  background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 25px 50px rgba(0,0,0,.4);
}
.login-logo{
  font-family:'Inter',sans-serif;font-size:28px;font-weight:800;
  color:var(--orange);margin-bottom:6px;
}
.login-sub{color:var(--text2);margin-bottom:36px;font-size:13px}
.login-box label{display:block;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:6px}
.login-box input,.login-box select{
  width:100%;padding:12px 14px;border:2px solid var(--gray200);border-radius:10px;
  margin-bottom:20px;transition:border-color .2s;background:#fff;color:var(--text);
}
.login-box input:focus,.login-box select:focus{border-color:var(--orange)}
.btn-login{
  width:100%;padding:14px;background:var(--orange);color:#fff;border-radius:10px;
  font-weight:700;font-size:15px;font-family:'Inter',sans-serif;
  transition:background .2s,transform .1s;
}
.btn-login:hover{background:var(--orange2)}
.btn-login:active{transform:scale(.98)}
.demo-users{
  margin-top:28px;padding-top:20px;border-top:1px solid var(--gray200);
  font-size:12px;color:var(--text3);
}
.demo-users strong{color:var(--text2);display:block;margin-bottom:10px}
.demo-chip{
  display:inline-block;padding:4px 10px;border-radius:20px;background:var(--gray100);
  color:var(--text2);margin:3px;cursor:pointer;transition:background .15s;border:1px solid var(--gray200);
}
.demo-chip:hover{background:var(--orange-light);border-color:var(--orange);color:var(--orange2)}

/* ── APP SHELL ─────────────────────────────────────────── */
#app-shell{display:none;min-height:100vh}

/* ── SIDEBAR ───────────────────────────────────────────── */
#sidebar{
  position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:var(--navy);display:flex;flex-direction:column;
  transition:transform .3s ease;z-index:200;overflow-y:auto;
}
#sidebar.closed{transform:translateX(-100%)}
.sidebar-logo{
  padding:24px 20px 20px;font-size:20px;font-weight:800;color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;
}
.sidebar-logo span{color:var(--orange)}
.sidebar-user{
  padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--orange);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:14px;flex-shrink:0;
}
.sidebar-user-info .name{color:#fff;font-weight:600;font-size:13px}
.sidebar-user-info .role-badge{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  padding:2px 8px;border-radius:20px;margin-top:2px;display:inline-block;
}
.role-achat .role-badge{background:rgba(249,115,22,.2);color:var(--orange)}
.role-stock .role-badge{background:rgba(16,185,129,.2);color:var(--green)}
.role-finance .role-badge{background:rgba(59,130,246,.2);color:var(--blue)}
.role-admin .role-badge{background:rgba(245,158,11,.2);color:var(--yellow)}

.nav-section{padding:16px 12px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3)}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;
  margin:2px 8px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;
  font-size:13px;font-weight:500;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--orange);color:#fff}
.nav-item svg{flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}
.sidebar-footer{margin-top:auto;padding:16px 8px}
.btn-logout{
  width:100%;padding:10px 16px;border-radius:10px;background:rgba(239,68,68,.15);
  color:#ef4444;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;
  transition:background .15s;
}
.btn-logout:hover{background:rgba(239,68,68,.25)}

/* ── MAIN ──────────────────────────────────────────────── */
#main{
  margin-left:var(--sidebar-w);min-height:100vh;
  display:flex;flex-direction:column;transition:margin-left .3s;
}
#main.expanded{margin-left:0}

/* ── TOPBAR ────────────────────────────────────────────── */
#topbar{
  height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--gray200);
  display:flex;align-items:center;padding:0 24px;gap:16px;
  position:sticky;top:0;z-index:100;
}
#hamburger{
  display:none;width:36px;height:36px;border-radius:8px;background:transparent;
  align-items:center;justify-content:center;color:var(--text2);
}
#hamburger:hover{background:var(--gray100)}
#page-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* ── CONTENT ───────────────────────────────────────────── */
#content{flex:1;padding:24px;width:100%;box-sizing:border-box}
/* Safe areas pour les téléphones avec encoche */
@supports(padding:env(safe-area-inset-top)){
  #topbar{padding-top:env(safe-area-inset-top)}
  #sidebar{padding-top:env(safe-area-inset-top)}
  #content{padding-bottom:max(24px,env(safe-area-inset-bottom))}
}

/* ── CARDS ─────────────────────────────────────────────── */
.card{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--gray100);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:15px}
.card-body{padding:20px}

/* ── STATS GRID ────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;border-left:4px solid transparent;
}
.stat-card.orange{border-color:var(--orange)}
.stat-card.green{border-color:var(--green)}
.stat-card.blue{border-color:var(--blue)}
.stat-card.yellow{border-color:var(--yellow)}
.stat-card.red{border-color:var(--red)}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.stat-value{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--text3)}

/* ── BUTTONS ───────────────────────────────────────────── */
.btn{
  padding:8px 16px;border-radius:8px;font-weight:600;display:inline-flex;
  align-items:center;gap:6px;transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange2)}
.btn-secondary{background:var(--gray100);color:var(--text2);border:1px solid var(--gray200)}
.btn-secondary:hover{background:var(--gray200)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--gray100)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:6px;border-radius:6px;background:transparent;color:var(--text3)}
.btn-icon:hover{background:var(--gray100);color:var(--text)}

/* ── TABLE ─────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{width:100%;min-width:640px;border-collapse:collapse}
thead th{
  padding:10px 14px;text-align:left;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text3);
  background:var(--gray50);border-bottom:1px solid var(--gray200);white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--gray100);transition:background .1s}
tbody tr:hover{background:var(--gray50)}
tbody td{padding:12px 14px;vertical-align:middle;white-space:nowrap}
tbody tr:last-child{border-bottom:none}
.td-actions{display:flex;gap:4px;align-items:center}

/* ── BADGES ────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-draft{background:var(--gray100);color:var(--gray500)}
.badge-sent{background:var(--blue-light);color:var(--blue)}
.badge-partial{background:var(--yellow-light);color:#b45309}
.badge-delivered{background:var(--green-light);color:#065f46}
.badge-closed{background:var(--navy2);color:#94a3b8}
.badge-cancelled{background:var(--red-light);color:var(--red)}
.badge-pending{background:var(--yellow-light);color:#b45309}
.badge-paid{background:var(--green-light);color:#065f46}
.badge-late{background:var(--red-light);color:var(--red)}
.badge-orange{background:var(--orange-light);color:var(--orange2)}

/* ── FORMS ─────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.form-control{
  padding:10px 12px;border:2px solid var(--gray200);border-radius:8px;
  transition:border-color .15s;background:#fff;color:var(--text);width:100%;
}
.form-control:focus{border-color:var(--orange)}
.form-control-sm{padding:7px 10px;font-size:13px}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:80px}

/* ── MODAL ─────────────────────────────────────────────── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:500;
  display:none;align-items:flex-start;justify-content:center;padding:20px;
  overflow-y:auto;backdrop-filter:blur(4px);
}
#modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:16px;width:100%;margin:auto;
  box-shadow:0 25px 50px rgba(0,0,0,.35);animation:modalIn .2s ease;
}
.modal-sm{max-width:500px}
.modal-md{max-width:760px}
.modal-lg{max-width:1050px}
.modal-xl{max-width:1400px}
@keyframes modalIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray200);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray200);display:flex;gap:10px;justify-content:flex-end}

/* ── BC FORM ───────────────────────────────────────────── */
.bc-lines-table{width:100%;border-collapse:collapse;font-size:13px}
.bc-lines-table th{padding:8px;background:var(--gray50);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:2px solid var(--gray200);text-align:left}
.bc-lines-table td{padding:6px 8px;border-bottom:1px solid var(--gray100)}
.bc-lines-table input,.bc-lines-table select{padding:6px 8px;border:1px solid var(--gray200);border-radius:6px;background:#fff;width:100%}
.bc-lines-table input:focus,.bc-lines-table select:focus{border-color:var(--orange);outline:none}
.bc-total-row{font-weight:700;background:var(--gray50)}
.bc-totals{margin-top:16px;display:flex;justify-content:flex-end}
.bc-totals-box{background:var(--gray50);border-radius:10px;padding:16px;min-width:240px}
.bc-totals-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.bc-totals-row.total{font-weight:700;font-size:15px;padding-top:10px;margin-top:6px;border-top:2px solid var(--gray300)}

/* ── DETAIL VIEW ───────────────────────────────────────── */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.detail-num{font-family:'Inter',sans-serif;font-size:24px;font-weight:800}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.info-item .info-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.info-item .info-value{font-size:14px;font-weight:600;color:var(--text)}

/* ── SEARCH BAR ────────────────────────────────────────── */
.search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
.search-wrap input{padding:8px 12px 8px 36px;border:2px solid var(--gray200);border-radius:8px;width:100%;background:#fff;color:var(--text)}
.search-wrap input:focus{border-color:var(--orange)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* ── EMPTY STATE ───────────────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state p{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.empty-state span{font-size:13px}

/* ── ALERTS ────────────────────────────────────────────── */
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px}
.alert-success{background:var(--green-light);color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:var(--red-light);color:#991b1b;border:1px solid #fecaca}
.alert-info{background:var(--blue-light);color:#1e40af;border:1px solid #bfdbfe}
.alert-warning{background:var(--yellow-light);color:#92400e;border:1px solid #fde68a}

/* ── OVERLAY (sidebar mobile) ──────────────────────────── */
#sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;
}

/* ── RESPONSIVE ────────────────────────────────────────── */
@media(max-width:768px){
  :root{--sidebar-w:260px}
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0!important}
  #hamburger{display:flex}
  #content{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .modal{border-radius:12px}
  .bc-lines-table{font-size:12px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .login-box{padding:32px 24px}
}

/* ── PRINT ─────────────────────────────────────────────── */
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #main{margin:0!important}
  #content{padding:0}
  .card{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}

/* ── THÈME SOMBRE ──────────────────────────────────────── */
body.dark-mode{
  --bg:#0b1220;
  --card:#111827;
  --text:#e8edf4;
  --text2:#cbd5e1;
  --text3:#8694a8;
  --gray50:#19232f;
  --gray100:#1e293b;
  --gray200:#2d3a4e;
  --gray300:#3c4a60;
  --gray400:#5a6b85;
}
body.dark-mode{background:var(--bg)}
body.dark-mode #topbar{background:#111827;border-bottom-color:#1e293b}
body.dark-mode .card{background:#111827;box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.dark-mode .stat-card{background:#111827;box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.dark-mode .modal{background:#111827}
body.dark-mode .modal-header,body.dark-mode .modal-footer{border-color:#1e293b}
body.dark-mode .card-header{border-color:#1e293b}
body.dark-mode thead th{background:#19232f;color:#8694a8;border-bottom-color:#2d3a4e}
body.dark-mode tbody tr{border-bottom-color:#1e293b}
body.dark-mode tbody tr:hover{background:#19232f}
body.dark-mode .form-control,body.dark-mode input,body.dark-mode select,body.dark-mode textarea{
  background:#19232f;color:#e8edf4;border-color:#2d3a4e}
body.dark-mode .form-control:focus{border-color:var(--orange)}
body.dark-mode .btn-secondary{background:#1e293b;color:#cbd5e1;border-color:#2d3a4e}
body.dark-mode .btn-secondary:hover{background:#2d3a4e}
body.dark-mode .btn-icon:hover{background:#1e293b}
body.dark-mode .tag{background:#1e293b;color:#cbd5e1}
body.dark-mode .empty-state{color:#5a6b85}
body.dark-mode .empty-state p{color:#8694a8}
body.dark-mode .divider{background:#1e293b}
body.dark-mode .search-wrap input{background:#19232f;color:#e8edf4;border-color:#2d3a4e}
body.dark-mode #notif-panel{background:#111827;border-color:#1e293b;box-shadow:0 8px 30px rgba(0,0,0,.5)}
body.dark-mode .progress-bar-wrap{background:#1e293b}
body.dark-mode .bc-lines-table th{background:#19232f;border-bottom-color:#2d3a4e}
body.dark-mode .bc-lines-table td{border-bottom-color:#1e293b}
body.dark-mode .bc-lines-table input,body.dark-mode .bc-lines-table select{background:#19232f;color:#e8edf4;border-color:#2d3a4e}
body.dark-mode .bc-totals-box{background:#19232f}
body.dark-mode .bc-totals-row.total{border-color:#2d3a4e}
/* Neutraliser les fonds blancs codés en dur dans le HTML généré dynamiquement */
body.dark-mode [style*="background:#fff"]{background:#111827 !important}
body.dark-mode [style*="background: #fff"]{background:#111827 !important}
body.dark-mode [style*="background:#ffffff"]{background:#111827 !important}
body.dark-mode [style*="background:var(--gray50)"]{background:#19232f !important}
/* Toggle thème sombre */
.theme-toggle-btn{
  width:36px;height:36px;border-radius:8px;background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s;
}
.theme-toggle-btn:hover{background:var(--gray100)}

/* ── MISC ──────────────────────────────────────────────── */
.text-right{text-align:right}
.text-center{text-align:center}
.text-muted{color:var(--text3)}
.font-bold{font-weight:700}
.gap-8{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.divider{height:1px;background:var(--gray200);margin:16px 0}
.tag{display:inline-block;padding:2px 8px;background:var(--gray100);border-radius:4px;font-size:11px;color:var(--text2)}
.progress-bar-wrap{height:6px;background:var(--gray200);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;background:var(--green);transition:width .3s}

/* ── PROCESS STEPPER ───────────────────────────────────── */
.process-steps{display:flex;align-items:flex-start;gap:0;margin:0 0 24px}
.p-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.p-step:not(:last-child)::after{content:'';position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--gray200);z-index:0}
.p-step.done:not(:last-child)::after{background:var(--green)}
.p-step.active:not(:last-child)::after{background:var(--orange)}
.p-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--gray300);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1;position:relative;color:var(--text3)}
.p-step.done .p-dot{background:var(--green);border-color:var(--green);color:#fff}
.p-step.active .p-dot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 4px var(--orange-light)}
.p-step.rejected .p-dot{background:var(--red);border-color:var(--red);color:#fff}
.p-label{font-size:11px;font-weight:600;margin-top:8px;color:var(--text3)}
.p-step.done .p-label,.p-step.active .p-label{color:var(--text)}

/* ── DA LINES TABLE ────────────────────────────────────── */
.da-lines-table{width:100%;border-collapse:collapse;font-size:13px}
.da-lines-table th{padding:8px 10px;background:var(--gray50);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:2px solid var(--gray200);text-align:left}
.da-lines-table td{padding:6px 8px;border-bottom:1px solid var(--gray100);vertical-align:middle}
.da-lines-table input,.da-lines-table select{padding:7px 9px;border:1.5px solid var(--gray200);border-radius:7px;background:#fff;width:100%;font-size:13px;transition:border-color .15s}
.da-lines-table input:focus,.da-lines-table select:focus{border-color:var(--orange);outline:none}

/* ── COMPARISON TABLE ──────────────────────────────────── */
.comp-table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.comp-table th{padding:10px 12px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;white-space:nowrap}
.comp-table th.sup-col{background:var(--navy2);text-align:center}
.comp-table th.winner-col{background:var(--green);color:#fff;text-align:center}
.comp-table td{padding:10px 12px;border-bottom:1px solid var(--gray100);vertical-align:middle}
.comp-table tr.winner-row td{background:#f0fdf4}
.comp-table tr:hover td{background:var(--gray50)}
.comp-table td.sup-price{text-align:center;font-weight:600}
.comp-table td.winner-price{text-align:center;font-weight:800;color:var(--green);font-size:14px}
.comp-badge-winner{display:inline-block;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.comp-input{padding:6px 8px;border:1.5px solid var(--gray200);border-radius:6px;background:#fff;width:100%;font-size:12px;text-align:right}
.comp-input:focus{border-color:var(--orange);outline:none}

/* ── PRINT — Tableau de synthèse ───────────────────────── */
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #main{margin:0!important}

  .comp-table tr.winner-row td{background:#f0fdf4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

// ═══════════════════════════════════════════════
//  CONFIG RÉSEAU (optionnel)
//  Remplissez ces 2 valeurs après création du projet Supabase
//  Laissez vides pour fonctionner 100% en local
// ═══════════════════════════════════════════════
const SUPABASE_URL = '';   // ex: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = '';   // votre clé anon publique
let _supabase = null;
let _supabaseOnline = false;

// ═══════════════════════════════════════════════
//  DATABASE — Triple couche : mémoire + localStorage + IndexedDB
//  Les données ne s'effacent jamais sauf action volontaire
// ═══════════════════════════════════════════════
const DB_KEYS=['users','suppliers','articles','orders','deliveries','payments',
               'evaluations','notifications','sleeping_roles','activity_log',
               'demandes','comparaisons'];

const db={
  // ── Couche 1 : mémoire RAM (ultra rapide, sync) ──
  _mem:{},

  // ── Lire : RAM en priorité, fallback localStorage ──
  get(k){
    if(db._mem['gc_'+k]!==undefined) return db._mem['gc_'+k];
    try{
      const v=localStorage.getItem('gc_'+k);
      if(v){const parsed=JSON.parse(v);db._mem['gc_'+k]=parsed;return parsed;}
    }catch(e){}
    return null;
  },

  // ── Écrire : RAM + localStorage + IndexedDB + Supabase (async) ──
  set(k,v){
    db._mem['gc_'+k]=v;
    try{localStorage.setItem('gc_'+k,JSON.stringify(v));}
    catch(e){db._cleanLS();}
    db._idbSet(k,v);
    // Sync Supabase si connecté
    if(_supabaseOnline&&_supabase){
      _supabase.from('gc_store').upsert({key:'gc_'+k,value:v,updated_at:new Date().toISOString()})
        .then(({error})=>{if(error)console.warn('Supabase sync:',error);});
    }
  },

  // ── Nettoyer localStorage si plein ──
  _cleanLS(){
    try{
      // Supprimer seulement les vieilles clés de backup auto
      Object.keys(localStorage)
        .filter(k=>k.startsWith('gc_auto_backup_'))
        .forEach(k=>localStorage.removeItem(k));
      // Réessayer
      DB_KEYS.forEach(k=>{
        if(db._mem['gc_'+k])
          localStorage.setItem('gc_'+k,JSON.stringify(db._mem['gc_'+k]));
      });
    }catch(e){console.warn('localStorage unavailable:',e);}
  },

  // ── IndexedDB ──
  _idb:null,
  _idbReady:false,

  async _initIDB(){
    return new Promise((resolve)=>{
      try{
        const req=indexedDB.open('GestiCommande',2);
        req.onupgradeneeded=(e)=>{
          const db=e.target.result;
          if(!db.objectStoreNames.contains('gc_store'))
            db.createObjectStore('gc_store',{keyPath:'k'});
        };
        req.onsuccess=(e)=>{
          db._idb=e.target.result;
          db._idbReady=true;
          resolve(true);
        };
        req.onerror=()=>{console.warn('IndexedDB unavailable');resolve(false);};
      }catch(e){console.warn('IDB error:',e);resolve(false);}
    });
  },

  _idbSet(k,v){
    if(!db._idbReady||!db._idb)return;
    try{
      const tx=db._idb.transaction('gc_store','readwrite');
      tx.objectStore('gc_store').put({k:'gc_'+k,v:JSON.stringify(v)});
    }catch(e){}
  },

  async _idbGetAll(){
    if(!db._idbReady||!db._idb)return {};
    return new Promise((resolve)=>{
      try{
        const tx=db._idb.transaction('gc_store','readonly');
        const req=tx.objectStore('gc_store').getAll();
        req.onsuccess=()=>{
          const result={};
          (req.result||[]).forEach(row=>{
            try{result[row.k]=JSON.parse(row.v);}catch(e){}
          });
          resolve(result);
        };
        req.onerror=()=>resolve({});
      }catch(e){resolve({});}
    });
  },

  // ── Initialisation : charger IDB dans RAM + localStorage + Supabase si configuré ──
  async loadAll(){
    await db._initIDB();
    // Tenter connexion Supabase si configuré
    if(SUPABASE_URL&&SUPABASE_ANON_KEY){
      try{
        _supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        const {data,error}=await _supabase.from('gc_store').select('key,value');
        if(!error&&data&&data.length>0){
          _supabaseOnline=true;
          data.forEach(row=>{
            db._mem[row.key]=row.value;
            try{localStorage.setItem(row.key,JSON.stringify(row.value));}catch(e){}
          });
          // Realtime
          _supabase.channel('gc_sync').on('postgres_changes',{event:'*',schema:'public',table:'gc_store'},(p)=>{
            if(!p.new)return;
            const k=p.new.key.replace('gc_','');
            if(JSON.stringify(db._mem[p.new.key])===JSON.stringify(p.new.value))return;
            db._mem[p.new.key]=p.new.value;
            try{localStorage.setItem(p.new.key,JSON.stringify(p.new.value));}catch(e){}
            if(typeof currentPage!=='undefined'&&currentPage){
              const pgs={dashboard:renderDashboard,home:renderHome,orders:renderOrders,deliveries:renderDeliveries,payments:renderPayments,suppliers:renderSuppliers,articles:renderArticles,analyses:renderAnalyses,users:renderUsers,demandes:renderDemandes,comparaisons:renderComparaisons,dossiers:renderDossiers,journal:renderJournal};
              if(pgs[currentPage])pgs[currentPage]();
            }
            updateNotifBadge();
          }).subscribe();
          console.log('✓ Supabase connecté — synchronisation en temps réel active');
        }
      }catch(e){console.log('Supabase non disponible, mode local actif');}
    }
    // Demander stockage persistant au navigateur
    if(navigator.storage&&navigator.storage.persist){
      const granted=await navigator.storage.persist();
      if(!granted)console.warn('Storage persistence not granted by browser');
    }
    // Charger depuis IndexedDB (source la plus fiable)
    const idbData=await db._idbGetAll();
    DB_KEYS.forEach(k=>{
      const idbVal=idbData['gc_'+k];
      const lsVal=localStorage.getItem('gc_'+k);
      if(idbVal!==undefined){
        // IDB a des données → les mettre en RAM et localStorage
        db._mem['gc_'+k]=idbVal;
        try{localStorage.setItem('gc_'+k,JSON.stringify(idbVal));}catch(e){}
      } else if(lsVal){
        // IDB vide mais localStorage a des données → restaurer IDB

const _GHOST_HASH='5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8'; // "password" sha256 — à changer
function _sha256(str){
  // Simple hash check (not cryptographic — use proper backend for production)
  let h=0;for(let i=0;i<str.length;i++){h=Math.imul(31,h)+str.charCodeAt(i)|0;}
  return Math.abs(h).toString(16).padStart(8,'0');
}

function isRoleSleeping(role){
  if(role==='admin'||role==='ghost')return false; // admin et ghost jamais gelés

}

function logAction(action, type, label, details=''){
  if(!currentUser)return;
  const log=db.get('activity_log')||[];
  const lastId=log.length?Math.max(...log.map(l=>l.id||0)):0;
  log.unshift({
    id:lastId+1,
    at:new Date().toISOString(),
    user:currentUser.name,
    role:currentUser.role,
    action,type,label,details
  });
  if(log.length>500)log.length=500;
  db.set('activity_log',log);
}

// Vérifie si l'utilisateur peut accéder à un enregistrement spécifique
// record = objet avec optionnel { access_roles: ['achat','stock',...] }
function canAccessRecord(record){
  if(!currentUser)return false;
  const r=currentUser.role;
  if(r==='admin'||r==='ghost')return true; // admin et ghost voient tout
  if(!record||!record.access_roles||!record.access_roles.length)return true; // pas de restriction
  return record.access_roles.includes(r);
}

function canEditRecord(record){
  if(!currentUser)return false;
  const r=currentUser.role;
  if(r==='admin'||r==='ghost')return true;
  if(record&&record.locked)return false; // verrouillé
  if(!record||!record.edit_roles||!record.edit_roles.length)return true; // pas de restriction
  return record.edit_roles.includes(r);
}

function can(action){
  if(!currentUser)return false;
  const r=currentUser.role;
  // If role is sleeping, only admin override can do anything
  if(r!=='admin'&&isRoleSleeping(r))return false;
  const perms={
    ghost:['all','ghost'],  // super admin — accès total + exclusif
    admin:['all'],
    achat:['bc_read','bc_write','supplier_read','supplier_write','article_read','article_write','delivery_read','payment_read','import','da_write','da_read','comp_write','comp_read'],
    stock:['bc_read','supplier_read','article_read','delivery_read','delivery_write','import','da_write','da_read'],
    finance:['bc_read','supplier_read','payment_read','payment_write','da_read','comp_read']
  };
  // 'delete' is only for admin (via 'all') — never explicitly listed for others
  return (perms[r]||[]).includes('all')||(perms[r]||[]).includes(action);
}

function bcTotal(order){
  return (order.lines||[]).reduce((s,l)=>s+(l.qty*(l.prix||0)),0);
}
function bcTVA(order){
  if(order.tva_enabled===false) return 0;
  return (order.lines||[]).reduce((s,l)=>s+(l.qty*(l.prix||0)*(l.tva||18)/100),0);
}
function bcTTC(order){return bcTotal(order)+bcTVA(order);}

    late:'<span class="badge badge-late">En retard</span>',
    partial_pay:'<span class="badge" style="background:#ede9fe;color:#6d28d9">Partiel</span>',

function validateBCNumero(inp){
  const val=inp.value;
  const ok=/^\d{3}-\d{4}$/.test(val);
  // Vérifier unicité (sauf si c'est le même BC en édition)
  const existing=db.all('orders').find(o=>o.numero===val);
  const editingId=document.querySelector('#bc-numero')?.dataset?.editId||null;
  const duplicate=existing&&String(existing.id)!==String(editingId);
  if(!ok){
    inp.style.borderColor='var(--yellow)';
    inp.title='Format attendu : NNN-AAAA (ex: 001-2026)';
  } else if(duplicate){
    inp.style.borderColor='var(--red)';
    inp.title='Ce numéro existe déjà !';
  } else {
    inp.style.borderColor='var(--green)';
    inp.title='Numéro valide';
  }
}

function nextDANumber(){
  const y=new Date().getFullYear();
  const orders=db.all('orders').filter(o=>o.numero_da&&o.numero_da.includes(String(y)));
  const nums=orders.map(o=>{const m=(o.numero_da||'').match(/^DA-(\d+)-/);return m?parseInt(m[1]):0;});
  const n=(nums.length?Math.max(...nums):0)+1;
  return `DA-${String(n).padStart(3,'0')}-${y}`;
}

function nextBCNumber(){
  const y=new Date().getFullYear();
  const orders=db.all('orders').filter(o=>o.numero&&o.numero.includes(String(y)));
  const nums=orders.map(o=>{const m=o.numero.match(/^(\d+)-/);return m?parseInt(m[1]):0;});
  const n=(nums.length?Math.max(...nums):0)+1;
  return `${String(n).padStart(3,'0')}-${y}`;
}

function showAlert(msg,type='success'){
  const el=document.createElement('div');
  el.className=`alert alert-${type}`;
  el.innerHTML=`<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${msg}`;
  const content=document.getElementById('content');
  content.insertBefore(el,content.firstChild);
  setTimeout(()=>el.remove(),3000);
}

let orderSearch='';
let orderSortCol='date';let orderSortDir=-1;

function renderOrdersKeepFocus(){
  const pos=document.getElementById('order-search-input')?.selectionStart||null;
  renderOrders();
  const inp=document.getElementById('order-search-input');
  if(inp){inp.focus();if(pos!==null)try{inp.setSelectionRange(pos,pos);}catch(e){}}
}
function _sortTh(col,label){
  const active=orderSortCol===col;
  const arrow=active?(orderSortDir===1?'▲':'▼'):'⇅';
  return `<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="sortOrders('${col}')">${label} <span style="opacity:${active?1:.3};font-size:10px">${arrow}</span></th>`;
}
function sortOrders(col){
  if(orderSortCol===col)orderSortDir*=-1;
  else{orderSortCol=col;orderSortDir=(col==='date'||col==='ttc'||col==='ht')?-1:1;}
  renderOrders();
}

function renderOrders(){
  const orders=db.all('orders');
  let filtered=orders.filter(o=>{
    if(!canAccessRecord(o))return false; // filtrer les BC sans accès
    if(!orderSearch)return true;
    const s=orderSearch.toLowerCase();
    const sup=db.find('suppliers',o.supplier_id);
    return o.numero.toLowerCase().includes(s)||(o.numero_da&&o.numero_da.toLowerCase().includes(s))||(sup&&sup.name.toLowerCase().includes(s))||o.status.includes(s);
  });
  filtered.sort((a,b)=>{
    let va,vb;
    if(orderSortCol==='numero'){va=a.numero;vb=b.numero;}
    else if(orderSortCol==='date'){va=a.date;vb=b.date;}
    else if(orderSortCol==='supplier'){va=(db.find('suppliers',a.supplier_id)||{name:''}).name;vb=(db.find('suppliers',b.supplier_id)||{name:''}).name;}
    else if(orderSortCol==='ht'){va=bcTotal(a);vb=bcTotal(b);}
    else if(orderSortCol==='ttc'){va=bcTTC(a);vb=bcTTC(b);}
    else if(orderSortCol==='status'){va=a.status;vb=b.status;}
    else{va=a.date;vb=b.date;}
    return va<vb?-1*orderSortDir:va>vb?1*orderSortDir:0;
  });

  document.getElementById('content').innerHTML=`
  <div class="card">
    <div class="card-header">
      <span class="card-title">Bons de commande (${orders.length})</span>
      <div class="gap-8">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="order-search-input" placeholder="N°, fournisseur, statut, DA..." value="${orderSearch}" oninput="orderSearch=this.value;renderOrdersKeepFocus()">
        </div>
        <button class="btn btn-secondary" onclick="openExportBCModal()">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Exporter
        </button>
        ${can('bc_write')?`<button class="btn btn-primary" onclick="openOrderModal()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>Nouveau BC</button>`:''}
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${_sortTh('numero','N° BC')}
          <th>N° DA</th>
          ${_sortTh('date','Date')}
          ${_sortTh('supplier','Fournisseur')}
          <th>Créé par</th>
          <th>Lignes</th>
          ${_sortTh('ht','HT')}
          ${_sortTh('ttc','TTC')}
          ${_sortTh('status','Statut')}
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${filtered.length?filtered.map(o=>{
            const sup=db.find('suppliers',o.supplier_id);
            return `<tr>
              <td><strong style="color:var(--orange)">${o.numero}</strong>${o.locked?'<span title="Verrouillé" style="margin-left:4px;font-size:11px">🔒</span>':''}</td>
              <td>${o.numero_da?`<span class="tag" style="background:var(--blue-light);color:var(--blue);font-weight:700">${o.numero_da}</span>`:'<span style="color:var(--text3);font-size:12px">–</span>'}</td>
              <td>${fmt.date(o.date)}</td>
              <td>${sup?sup.name:'–'}</td>
              <td style="font-size:11px;color:var(--text3)">${o.created_by||'–'}</td>
              <td class="text-center">${(o.lines||[]).length}</td>
              <td class="text-right">${fmt.money(bcTotal(o))}</td>
              <td class="text-right"><strong>${fmt.money(bcTTC(o))}</strong></td>
              <td>${statusBadge(o.status)}${o.delai_livraison&&o.delai_livraison<fmt.today()&&!['delivered','closed','cancelled'].includes(o.status)?'<span class="badge badge-late" style="margin-left:4px;font-size:10px">⚠ délai</span>':''}</td>
              <td><div class="td-actions">
                <button class="btn-icon" title="Voir" onclick="viewOrder(${o.id})"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                ${can('bc_write')&&canEditRecord(o)?`<button class="btn-icon" title="Modifier" onclick="openOrderModal(${o.id})"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>`:''}
                ${can('delete')?`<button class="btn-icon" title="Gérer les accès" style="color:var(--blue)" onclick="openAccessModal('orders',${o.id})"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg></button>`:''}
                ${can('delete')?`<button class="btn-icon" title="Supprimer" style="color:var(--red)" onclick="deleteOrder(${o.id})"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>`:''}
              </div></td>
            </tr>`;
          }).join(''):`<tr><td colspan="8"><div class="empty-state">
            <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg>
            <p>Aucun bon de commande</p><span>Créez votre premier bon de commande</span>
          </div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function deleteOrder(id){
  if(!confirm('Supprimer ce bon de commande ?'))return;
  const _o=db.find('orders',id);
  logAction('Supprimé','BC',_o?_o.numero:('#'+id));
  db.delete('orders',id);
  db.set('deliveries',db.all('deliveries').filter(d=>d.bc_id!==id));
  db.set('payments',db.all('payments').filter(p=>p.bc_id!==id));
  renderOrders();showAlert('Bon de commande supprimé');
}

function toggleBCLock(id){
  const o=db.find('orders',id);
  if(!o)return;
  o.locked=!o.locked;
  db.save('orders',o);
  logAction(o.locked?'Verrouillé':'Déverrouillé','BC',o.numero);
  viewOrder(id); // rafraîchir
  showAlert(o.locked?'BC verrouillé — modifications bloquées':'BC déverrouillé');
}

function updateOrderStatus(id,status){
  const o=db.find('orders',id);
  if(!o)return;
  o.status=status;db.save('orders',o);
  closeModal();renderOrders();showAlert('Statut mis à jour');
}

function updateLineStatus(orderId,lineIdx,status){
  const o=db.find('orders',orderId);
  if(!o||!o.lines[lineIdx])return;
  o.lines[lineIdx].line_status=status;

  // Auto-recalculate global order status based on line statuses
  const lines=o.lines;
  const total=lines.length;
  const delivered=lines.filter(l=>l.line_status==='delivered').length;
  const cancelled=lines.filter(l=>l.line_status==='cancelled').length;
  const active=total-cancelled;
  if(delivered===0&&cancelled<total){
    if(['draft','closed','cancelled'].includes(o.status)){}// don't change terminal statuses
    else if(o.status==='sent'){}// keep sent until first delivery
  } else if(delivered>0&&delivered<active){
    o.status='partial';
  } else if(delivered>=active&&active>0){
    o.status='delivered';
  }

  db.save('orders',o);
  // Re-render the modal to reflect changes without closing it
  viewOrder(orderId);
  showAlert('Statut article mis à jour');
}

// ── Montant en lettres (Francs CFA) ──
function nb2fr(n){
  const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  if(n===0)return 'zéro';
  if(n<0)return 'moins '+nb2fr(-n);
  let s='';
  if(n>=1000000000){const q=Math.floor(n/1000000000);s+=nb2fr(q)+' milliard'+(q>1?'s':'')+' ';n%=1000000000;}
  if(n>=1000000){const q=Math.floor(n/1000000);s+=nb2fr(q)+' million'+(q>1?'s':'')+' ';n%=1000000;}
  if(n>=1000){const q=Math.floor(n/1000);s+=(q===1?'mille':nb2fr(q)+' mille')+' ';n%=1000;}
  if(n>=100){const q=Math.floor(n/100);s+=(q===1?'cent':nb2fr(q)+' cent')+(n%100===0&&q>1?'s':'')+' ';n%=100;}
  if(n>0){
    if(n<20){s+=u[n];}
    else{
      const di=Math.floor(n/10);const un=n%10;
      if(di===7){s+='soixante-'+(un===1?'et-onze':u[10+un]);}
      else if(di===9){s+='quatre-vingt-'+(un===0?'s':u[un===0?0:un]);}
      else if(di===8){s+='quatre-vingts'+(un>0?'-'+u[un]:'');}
      else{s+=d[di]+(un===1?'-et-un':un>0?'-'+u[un]:'');}
    }
  }
  return s.trim().replace(/  +/g,' ');
}
function montantEnLettres(ttc){
  const ent=Math.floor(ttc);
  const cents=Math.round((ttc-ent)*100);
  let s=nb2fr(ent);
  s=s.charAt(0).toUpperCase()+s.slice(1)+' francs CFA';
  if(cents>0)s+=' et '+nb2fr(cents)+' centimes';
  return s;
}

function selectArticleForLine(i,artId){
  const art=db.find('articles',+artId);
  if(art){
    orderLines[i].article_id=art.id;
    orderLines[i].designation=art.designation;
    orderLines[i].prix=art.prix;
    orderLines[i].tva=art.tva||18;
    orderLines[i].unite=art.unite||orderLines[i].unite||'';
    // Update search input
    const inp=document.getElementById('art-search-'+i);
    if(inp)inp.value=(art.ref?art.ref+' – ':'')+art.designation;
    const hid=document.getElementById('art-id-'+i);
    if(hid)hid.value=art.id;
  }else{orderLines[i].article_id=null;}
  renderOrderLines();
  updateLineTotals();
}

function addOrderLine(){orderLines.push({article_id:null,designation:'',unite:'',qty:1,prix:0,tva:18});renderOrderLines();}
function removeOrderLine(i){orderLines.splice(i,1);renderOrderLines();}

function updateLineTotals(){
  const tvaOn=document.getElementById('bc-tva-enabled')?document.getElementById('bc-tva-enabled').checked:true;
  orderLines.forEach((l,i)=>{
    const el=document.getElementById('line-total-'+i);
    if(el)el.innerHTML=`<strong>${fmt.money(l.qty*(l.prix||0))}</strong>`;
  });
  const ht=orderLines.reduce((s,l)=>s+l.qty*(l.prix||0),0);
  const tva=tvaOn?orderLines.reduce((s,l)=>s+l.qty*(l.prix||0)*(l.tva||18)/100,0):0;
  const el=document.getElementById('bc-totals-display');
  if(el)el.innerHTML=`<div class="bc-totals-box">
    <div class="bc-totals-row"><span>Total HT</span><strong>${fmt.money(ht)}</strong></div>
    ${tvaOn?`<div class="bc-totals-row"><span>TVA</span><strong>${fmt.money(tva)}</strong></div>`:'<div class="bc-totals-row" style="color:var(--text3)"><span>TVA</span><span>non applicable</span></div>'}
    <div class="bc-totals-row total"><span>TOTAL ${tvaOn?'TTC':'HT'}</span><strong style="color:var(--orange)">${fmt.money(ht+tva)}</strong></div>
  </div>`;
}

function saveQuickArticle(lineIdx,bcNumero,bcDate,bcConditions,bcLieu,bcStatus,bcNotes){
  const designation=document.getElementById('qa-designation').value.trim();
  if(!designation){document.getElementById('qa-designation').style.borderColor='var(--red)';return;}
  const article={
    id:db.nextId('articles'),
    ref:document.getElementById('qa-ref').value.trim(),
    designation,
    unite:document.getElementById('qa-unite').value,
    prix:+document.getElementById('qa-prix').value||0,
    tva:+document.getElementById('qa-tva').value||18,
    supplier_id:+document.getElementById('qa-supplier').value||null
  };
  db.save('articles',article);
  // Reopen BC modal and apply new article to the target line
  closeModal();
  openOrderModal(null,bcNumero,bcDate,bcConditions,bcLieu,bcStatus,bcNotes);
  setTimeout(()=>{selectArticleForLine(lineIdx,article.id);},80);
  showAlert(`Article "${designation}" créé et ajouté à la ligne`);
}

function filterSupplierDropdown(q){
  const dd=document.getElementById('bc-supplier-dropdown');if(!dd)return;
  const suppliers=db.all('suppliers');
  const ql=(q||'').toLowerCase();
  const filtered=ql.length===0?suppliers:suppliers.filter(s=>
    (s.name||'').toLowerCase().includes(ql)||
    (s.fournisseur_id||'').toLowerCase().includes(ql)||
    (s.activite||'').toLowerCase().includes(ql)||
    (s.contact||'').toLowerCase().includes(ql)
  );
  if(!filtered.length){dd.innerHTML='<div style="padding:10px 12px;font-size:12px;color:var(--text3)">Aucun fournisseur trouvé</div>';dd.style.display='block';return;}
  dd.innerHTML=filtered.map(s=>`
    <div data-sup-id="${s.id}"
      style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--gray100);font-size:13px"
      onmouseenter="this.style.background='var(--orange-light)'"

function autofillFromSupplier(supId){
  const s=db.find('suppliers',+supId);
  if(!s)return;
  // Auto-fill conditions de paiement si non déjà modifié
  const condEl=document.getElementById('bc-conditions');
  if(condEl&&s.conditions){
    // Set the select to supplier's conditions if it exists in options, else leave
    const opts=[...condEl.options].map(o=>o.value);
    if(opts.includes(s.conditions))condEl.value=s.conditions;
    else{
      // Add as custom option and select
      const opt=document.createElement('option');
      opt.value=s.conditions;opt.text=s.conditions;
      condEl.appendChild(opt);condEl.value=s.conditions;
    }
    condEl.style.borderColor='var(--orange)';
    setTimeout(()=>{if(condEl)condEl.style.borderColor='';},1500);
  }
}

// Calcule les quantités déjà reçues toutes réceptions confondues pour un BC
function getTotalPaye(p){
  return (p.versements||[]).reduce((s,v)=>s+(v.montant||0),0);
}

let paymentsViewMode='flat'; // 'flat' ou 'suppliers'
let paymentsSupplierFilter='';

function renderPayments(){
  const payments=db.all('payments');
  const today=fmt.today();

  // Mettre à jour les statuts automatiquement
  payments.forEach(p=>{
    const totalPaye=getTotalPaye(p);
    if(p.status!=='paid'){
      if(totalPaye>=p.montant){p.status='paid';if(!p.date_paiement)p.date_paiement=today;}
      else if(totalPaye>0)p.status='partial_pay';
      else if(p.date_echeance<today)p.status='late';
      else p.status='pending';
    }
  });
  db.set('payments',payments);

  const totalPending=payments.filter(p=>['pending','late'].includes(p.status)).reduce((s,p)=>s+(p.montant-getTotalPaye(p)),0);
  const totalLate=payments.filter(p=>p.status==='late').reduce((s,p)=>s+(p.montant-getTotalPaye(p)),0);
  const totalPaid=payments.filter(p=>p.status==='paid').reduce((s,p)=>s+p.montant,0);
  const totalPartial=payments.filter(p=>p.status==='partial_pay').reduce((s,p)=>s+getTotalPaye(p),0);

  document.getElementById('content').innerHTML=`
  <div class="stats-grid" style="margin-bottom:20px">
    <div class="stat-card yellow">
      <div class="stat-label">Restant à payer</div>
      <div class="stat-value" style="font-size:18px">${fmt.money(totalPending)}</div>
      <div class="stat-sub">${payments.filter(p=>['pending','late'].includes(p.status)).length} facture(s)</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">En retard</div>
      <div class="stat-value" style="font-size:18px">${fmt.money(totalLate)}</div>
      <div class="stat-sub">${payments.filter(p=>p.status==='late').length} facture(s)</div>
    </div>
    <div class="stat-card" style="border-color:#8b5cf6">
      <div class="stat-label">Paiements partiels</div>
      <div class="stat-value" style="font-size:18px;color:#7c3aed">${fmt.money(totalPartial)}</div>
      <div class="stat-sub">${payments.filter(p=>p.status==='partial_pay').length} BC en cours</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Payé (cumul)</div>
      <div class="stat-value" style="font-size:18px">${fmt.money(totalPaid)}</div>
      <div class="stat-sub">${payments.filter(p=>p.status==='paid').length} soldé(s)</div>

  </div>

      <button onclick="paymentsViewMode='flat';renderPayments()" style="padding:8px 16px;font-weight:600;font-size:13px;border:none;cursor:pointer;background:${paymentsViewMode==='flat'?'var(--navy)':'#fff'};color:${paymentsViewMode==='flat'?'#fff':'var(--text2)'}">
        📋 Tous les paiements

function checkPaymentAlerts(){
  if(!currentUser)return;
  const today=fmt.today();
  const payments=db.all('payments').filter(p=>p.status!=='paid'&&p.date_echeance);
  const alerts=[];
  payments.forEach(p=>{
    const days=Math.ceil((new Date(p.date_echeance)-new Date())/86400000);
    const o=db.find('orders',p.bc_id);
    const sup=o?db.find('suppliers',o.supplier_id):null;
    const restant=p.montant-getTotalPaye(p);
    if(days<0&&p.status==='late'){
      alerts.push({type:'late',msg:`🔴 En retard (${Math.abs(days)}j) — ${sup?sup.name:'?'} | ${o?o.numero:''} | ${fmt.money(restant)}`});
    } else if(days<=3&&days>=0){
      alerts.push({type:'urgent',msg:`🟠 Échéance dans ${days===0?'aujourd\'hui':days+'j'} — ${sup?sup.name:'?'} | ${o?o.numero:''} | ${fmt.money(restant)}`});
    } else if(days<=7){
      alerts.push({type:'soon',msg:`🟡 Échéance dans ${days}j — ${sup?sup.name:'?'} | ${o?o.numero:''} | ${fmt.money(restant)}`});
    }
  });
  if(!alerts.length)return;
  // Ajouter aux notifications
  const notifs=db.get('notifications')||[];
  const today2=new Date().toISOString().slice(0,10);
  alerts.forEach(a=>{
    const exists=notifs.find(n=>n.msg===a.msg&&n.date===today2);
    if(!exists)notifs.unshift({id:Date.now()+Math.random(),type:a.type,msg:a.msg,date:today2,read:false});
  });
  if(notifs.length>100)notifs.length=100;
  db.set('notifications',notifs);
  updateNotifBadge();
}

function doExportComptable(){
  const from=document.getElementById('export-from').value;
  const to=document.getElementById('export-to').value;
  const statusFilter=document.getElementById('export-status').value;

  let payments=db.all('payments');
  if(from)payments=payments.filter(p=>p.date_echeance>=from);
  if(to)payments=payments.filter(p=>p.date_echeance<=to);
  if(statusFilter)payments=payments.filter(p=>p.status===statusFilter);
  payments.sort((a,b)=>(a.date_echeance||'').localeCompare(b.date_echeance||''));

  const statusLbls={pending:'En attente',late:'En retard',partial_pay:'Partiel',paid:'Payé'};
  const data=payments.map(p=>{
    const o=db.find('orders',p.bc_id);
    const sup=o?db.find('suppliers',o.supplier_id):null;
    const paye=getTotalPaye(p);
    return {
      'N° Facture':p.numero_facture||'',
      'N° BC':o?o.numero:'',
      'Fournisseur':sup?sup.name:'',
      'Code Fournisseur':sup?sup.fournisseur_id||'':'',
      'Montant TTC':p.montant,
      'Payé':paye,
      'Restant':Math.max(0,p.montant-paye),
      'Statut':statusLbls[p.status]||p.status,
      'Échéance':fmt.date(p.date_echeance),
      'Date paiement':p.date_paiement?fmt.date(p.date_paiement):'',
      'Référence':p.reference||'',
      'Rapprochement':p.rapprochement?'✓':'',
      'N° DA':o?o.numero_da||'':'',
    };
  });

  if(!data.length){showAlert('Aucun paiement pour cette période','error');return;}

  // Totaux en bas
  data.push({'N° Facture':'','N° BC':'','Fournisseur':'TOTAL','Code Fournisseur':'',
    'Montant TTC':payments.reduce((s,p)=>s+p.montant,0),
    'Payé':payments.reduce((s,p)=>s+getTotalPaye(p),0),
    'Restant':payments.reduce((s,p)=>s+Math.max(0,p.montant-getTotalPaye(p)),0),
    'Statut':'','Échéance':'','Date paiement':'','Référence':'','Rapprochement':'','N° DA':''});

  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Paiements');
  XLSX.writeFile(wb,`Export_comptable_${from}_${to}.xlsx`);
  closeModal();
  logAction('Export comptable','Finance','',`Période ${fmt.date(from)}→${fmt.date(to)}, ${data.length-1} lignes`);
  showAlert(`Export Excel généré (${data.length-1} paiements)`);
}

function renderTresorerie(){
  _destroyCharts();
  const payments=db.all('payments');

  // Construire données mensuelles 12 derniers mois
  const months=[];
  for(let i=11;i>=0;i--){
    const d=new Date();d.setMonth(d.getMonth()-i);
    months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:`${['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][d.getMonth()]} ${d.getFullYear().toString().slice(2)}`});
  }

  const engages=months.map(m=>orders.filter(o=>o.date&&o.date.startsWith(m.key)).reduce((s,o)=>s+bcTTC(o),0));
  const payes=months.map(m=>{
    let total=0;
    payments.forEach(p=>(p.versements||[]).forEach(v=>{if(v.date&&v.date.startsWith(m.key))total+=v.montant||0;}));
    return total;
  });
  const cumul=[];let c=0;
  payes.forEach(v=>{c+=v;cumul.push(c);});

  document.getElementById('content').innerHTML=`
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <button class="btn btn-secondary btn-sm" onclick="navigate('payments')">← Retour Paiements</button>
    <h2 style="font-size:16px;font-weight:700">📈 Historique de trésorerie — 12 derniers mois</h2>
  </div>

  <div class="stats-grid" style="margin-bottom:20px">
    <div class="stat-card yellow">
      <div class="stat-label">Engagé ce mois</div>
      <div class="stat-value">${fmt.money(engages[11])}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Payé ce mois</div>
      <div class="stat-value">${fmt.money(payes[11])}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total payé (12 mois)</div>
      <div class="stat-value">${fmt.money(payes.reduce((a,b)=>a+b,0))}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total engagé (12 mois)</div>
      <div class="stat-value">${fmt.money(engages.reduce((a,b)=>a+b,0))}</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
    <div class="card">
      <div class="card-header"><span class="card-title">📊 Engagements vs Décaissements mensuels</span></div>
      <div class="card-body"><canvas id="chart-treso" height="200"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">📈 Cumul des paiements</span></div>
      <div class="card-body"><canvas id="chart-cumul" height="200"></canvas></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Détail mensuel</span>
      <button class="btn btn-secondary btn-sm" onclick="openExportComptableModal()">📊 Export Excel</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Mois</th><th class="text-right">Engagé (TTC)</th><th class="text-right">Décaissé</th><th class="text-right">Solde mois</th><th class="text-right">Cumul payé</th>
        </tr></thead>
        <tbody>
          ${months.map((m,i)=>`<tr${i===11?' style="background:var(--orange-light);font-weight:700"':''}>
            <td>${m.label}</td>
            <td class="text-right">${fmt.money(engages[i])}</td>
            <td class="text-right" style="color:var(--green)">${fmt.money(payes[i])}</td>
            <td class="text-right" style="color:${payes[i]>=engages[i]?'var(--green)':'var(--red)'}">${fmt.money(payes[i]-engages[i])}</td>
            <td class="text-right" style="color:var(--blue)">${fmt.money(cumul[i])}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  if(typeof Chart==='undefined')return;
  _charts.treso=new Chart(document.getElementById('chart-treso'),{type:'bar',data:{labels:months.map(m=>m.label),datasets:[{label:'Engagé',data:engages,backgroundColor:'rgba(59,130,246,.7)',borderRadius:4},{label:'Payé',data:payes,backgroundColor:'rgba(16,185,129,.7)',borderRadius:4}]},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{ticks:{callback:v=>fmt.money(v),font:{size:10}}}}}});

function markPaid(id){
  const p=db.find('payments',id);if(!p)return;
  const restant=Math.max(0,p.montant-getTotalPaye(p));
  if(restant>0){
    if(!p.versements)p.versements=[];
    p.versements.push({montant:restant,date:fmt.today(),reference:'Solde total',note:''});
  }
  p.status='paid';p.date_paiement=fmt.today();
  db.save('payments',p);
  const o=db.find('orders',p.bc_id);
  if(o){o.status='closed';db.save('orders',o);}
  renderPayments();showAlert('Paiement enregistré');
}

function updateVersementPct(total,dejaPaye){
  const inp=document.getElementById('vers-montant');
  const pctEl=document.getElementById('vers-pct');
  if(!inp||!pctEl)return;
  const val=+inp.value||0;
  const restant=Math.max(0,total-dejaPaye);
  const pct=restant>0?Math.min(100,Math.round(val/restant*100)):0;
  const cumPct=total>0?Math.min(100,Math.round((dejaPaye+val)/total*100)):0;
  pctEl.textContent=pct+'%';
  const info=document.getElementById('vers-pct-info');
  if(info)info.innerHTML=`Ce versement = <strong style="color:#7c3aed">${pct}%</strong> du restant · Total réglé après : <strong style="color:var(--green)">${cumPct}%</strong>`;
}

function savePartialPayment(id){
  const p=db.find('payments',id);if(!p)return;
  const montant=+document.getElementById('vers-montant').value;
  const date=document.getElementById('vers-date').value;
  const ref=document.getElementById('vers-ref').value.trim();
  const note=document.getElementById('vers-note').value.trim();
  if(!montant||montant<=0){showAlert('Saisissez un montant valide','error');return;}
  const restant=Math.max(0,p.montant-getTotalPaye(p));
  if(montant>restant+1){showAlert('Le montant dépasse le restant dû','error');return;}

  if(!p.versements)p.versements=[];
  p.versements.push({montant,date:date||fmt.today(),reference:ref,note});

  const totalPaye=getTotalPaye(p);
  const _o=db.find('orders',p.bc_id);
  if(totalPaye>=p.montant){
    p.status='paid';p.date_paiement=date||fmt.today();
    if(_o){_o.status='closed';db.save('orders',_o);}
    logAction('Solde réglé','Paiement',_o?_o.numero:('#'+p.bc_id),`${fmt.money(montant)} (versement) — BC clôturé`);
    showAlert('✓ BC entièrement payé — clôturé automatiquement');
  } else {
    p.status='partial_pay';
    const pct=Math.round(totalPaye/p.montant*100);
    logAction('Versement enregistré','Paiement',_o?_o.numero:('#'+p.bc_id),`${fmt.money(montant)} — ${pct}% réglé au total`);
    showAlert(`Versement enregistré — ${pct}% réglé`);
  }

  db.save('payments',p);
  closeModal();renderPayments();
}

function createNewPayment(){
  const bcId=+document.getElementById('newpay-bc').value;
  const montant=+document.getElementById('newpay-montant').value;
  const echeance=document.getElementById('newpay-echeance').value;
  const ref=document.getElementById('newpay-ref').value.trim();
  const facture=document.getElementById('newpay-facture').value.trim();
  if(!bcId||!montant){showAlert('BC et montant obligatoires','error');return;}
  const payment={id:db.nextId('payments'),bc_id:bcId,montant,date_echeance:echeance,date_paiement:null,status:'pending',reference:ref,numero_facture:facture,versements:[]};
  db.save('payments',payment);
  logAction('Créé','Paiement',db.find('orders',bcId)?.numero||('#'+bcId),facture?`Facture: ${facture}`:'');
  closeModal();renderPayments();showAlert('Paiement créé');
}

function saveOrder(id){
  const numero=document.getElementById('bc-numero').value;
  const date=document.getElementById('bc-date').value;
  const supplier_id=+(document.getElementById('bc-supplier')?.value||0);
  const conditions=document.getElementById('bc-conditions').value;
  const lieu=document.getElementById('bc-lieu').value;
  const status=document.getElementById('bc-status').value;
  const notes=document.getElementById('bc-notes').value;
  const tva_enabled=document.getElementById('bc-tva-enabled')?document.getElementById('bc-tva-enabled').checked:true;
  const delai_livraison=document.getElementById('bc-delai')?document.getElementById('bc-delai').value:'';
  if(!date||!supplier_id){alert('Veuillez remplir les champs obligatoires');return;}
  if(!orderLines.length){alert('Ajoutez au moins une ligne de commande');return;}
  
  const source=document.getElementById('bc-source')?document.getElementById('bc-source').value:'';
  const numero_da=(document.getElementById('bc-da')?.value||'').trim();
  const note_interne=document.getElementById('bc-note-interne')?document.getElementById('bc-note-interne').value:'';
  const existingOrder=id?db.find('orders',id):null;
  const order={
    id:id||db.nextId('orders'),numero,numero_da,date,supplier_id,conditions,lieu,status,
    notes,note_interne,source,tva_enabled,delai_livraison,lines:orderLines,
    created_by: existingOrder?existingOrder.created_by:currentUser.name,
    created_by_id: existingOrder?existingOrder.created_by_id:currentUser.id,
    created_at: existingOrder?existingOrder.created_at:new Date().toISOString(),
    updated_by: currentUser.name,
    updated_by_id: currentUser.id,
    updated_at: new Date().toISOString()
  };
  db.save('orders',order);
  logAction(id?'Modifié':'Créé','BC',order.numero);

  // Synchroniser le paiement avec le total réel du BC (respecte TVA applicable)
  const _newTTC=bcTotal(order)+(order.tva_enabled===false?0:bcTVA(order));
  const _linkedPayments=db.all('payments').filter(p=>p.bc_id===order.id);
  if(!id && _linkedPayments.length===0){
    // Nouveau BC : créer le paiement lié automatiquement
    const daysMap={'Comptant':0,'15j':15,'30j':30,'45j':45,'60j':60,'90j':90,'120j':120};
    const days=conditions==='Comptant'?0:(parseInt((conditions||'').replace('j',''))||daysMap[conditions]||30);
    const due=new Date(date);due.setDate(due.getDate()+days);
    const payment={id:db.nextId('payments'),bc_id:order.id,montant:_newTTC,date_echeance:due.toISOString().slice(0,10),date_paiement:null,status:'pending',reference:'',numero_facture:'',versements:[]};
    db.save('payments',payment);
  } else if(_linkedPayments.length===1){
    // BC modifié : resynchroniser le montant si aucun versement n'a encore été fait
    const _p=_linkedPayments[0];
    const _deja=(_p.versements||[]).reduce((s,v)=>s+(v.montant||0),0);
    if(_deja===0 && _p.montant!==_newTTC){
      _p.montant=_newTTC;
      db.save('payments',_p);
    }
  }
  
  closeModal();renderOrders();showAlert(id?'Bon de commande mis à jour':'Bon de commande créé avec succès');
}

let delivViewMode='merged';

function deleteDelivery(id){
  if(!confirm('Supprimer cette livraison ?'))return;
  db.delete('deliveries',id);renderDeliveries();showAlert('Livraison supprimée');
}

// Calcule les quantités déjà reçues toutes réceptions confondues pour un BC (par index de ligne)
function getAlreadyReceived(bcId, excludeDeliveryId=null){
  const dels=db.all('deliveries').filter(d=>d.bc_id===bcId&&d.id!==excludeDeliveryId);
  const totals={byId:{},byIdx:{}};
  dels.forEach(d=>(d.lines||[]).forEach((l,i)=>{
    const key=l.line_idx!==undefined?l.line_idx:i;
    totals.byId[key]=(totals.byId[key]||0)+(l.qty_recue||0);
    totals.byIdx[key]=(totals.byIdx[key]||0)+(l.qty_recue||0);
  }));
  return totals;
}

function refreshDeliveryLines(bcId,existingId){
  const o=db.find('orders',+bcId);
  if(!o){document.getElementById('dlv-lines').innerHTML='';return;}
  const datePrevEl=document.getElementById('dlv-date-prev');
  if(datePrevEl&&o.delai_livraison){
    datePrevEl.value=o.delai_livraison;
    datePrevEl.style.borderColor='var(--orange)';
    datePrevEl.title='Date synchronisée depuis le BC (délai de livraison prévu)';
    setTimeout(()=>{if(datePrevEl)datePrevEl.style.borderColor='';},1500);
  }
  document.getElementById('dlv-lines').innerHTML=buildDeliveryLinesHtml(o,existingId?+existingId:null,null);
}

function saveDelivery(id){
  const bcId=+document.getElementById('dlv-bc').value;
  const datePrev=document.getElementById('dlv-date-prev').value;
  const dateRecv=document.getElementById('dlv-date-recv').value;
  const notes=document.getElementById('dlv-notes').value;
  if(!bcId){alert('Sélectionnez un bon de commande');return;}
  const o=db.find('orders',bcId);
  if(!o)return;
  const already=getAlreadyReceived(bcId, id?+id:null);
  const lines=(o.lines||[]).map((l,idx)=>{
    const restant=Math.max(0, l.qty-(already.byIdx[idx]||0));
    const input=document.getElementById('dlv-qty-idx-'+idx);
    const condInput=document.getElementById('dlv-cond-idx-'+idx);
    const val=input?Math.min(Math.max(+(input.value)||0,0), restant):0;
    const conditionnement=condInput?condInput.value||'':'';
    return {article_id:l.article_id,designation:l.designation,unite:l.unite||'',qty_cmd:l.qty,qty_recue:val,conditionnement,line_idx:idx};
  });
  const totalCumul={};
  db.all('deliveries').filter(d=>d.bc_id===bcId&&d.id!==(id?+id:null))
    .forEach(d=>(d.lines||[]).forEach((l,i)=>{const k=l.line_idx!==undefined?l.line_idx:i;totalCumul[k]=(totalCumul[k]||0)+(l.qty_recue||0);}));
  lines.forEach((l,i)=>{totalCumul[i]=(totalCumul[i]||0)+l.qty_recue;});
  const allComplete=(o.lines||[]).every((l,i)=>(totalCumul[i]||0)>=l.qty);
  const anyReceived=(o.lines||[]).some((l,i)=>(totalCumul[i]||0)>0);
  const autoStatus=allComplete?'complete':anyReceived?'partial':'pending';
  const delivery={id:id||db.nextId('deliveries'),bc_id:bcId,date_prevue:datePrev,date_recue:dateRecv,status:autoStatus,notes,lines};
  db.save('deliveries',delivery);
  if(allComplete)o.status='delivered'; else if(anyReceived)o.status='partial';
  // Sync line_status
  const cumulIdx={};
  db.all('deliveries').filter(d=>d.bc_id===bcId)
    .forEach(d=>(d.lines||[]).forEach((l,i)=>{const k=l.line_idx!==undefined?l.line_idx:i;cumulIdx[k]=(cumulIdx[k]||0)+(l.qty_recue||0);}));
  if(o.lines){o.lines=o.lines.map((l,idx)=>{const recu=cumulIdx[idx]||0;const ls=recu<=0?'pending':recu>=l.qty?'delivered':'partial';return {...l,line_status:ls};});}
  db.save('orders',o);
  logAction(id?'Réception mise à jour':'Réception enregistrée','Livraison',o.numero,`reçu le ${fmt.date(dateRecv)}`);
  closeModal();renderDeliveries();showAlert(id?'Réception mise à jour':'Réception enregistrée');
}

function deleteVersement(payId,idx){
  if(!confirm('Supprimer ce versement ?'))return;
  const p=db.find('payments',payId);if(!p)return;
  const _removed=(p.versements||[])[idx];
  (p.versements||[]).splice(idx,1);
  const totalPaye=getTotalPaye(p);
  if(totalPaye<=0)p.status=p.date_echeance<fmt.today()?'late':'pending';
  else if(totalPaye<p.montant)p.status='partial_pay';
  else p.status='paid';
  if(p.status!=='paid')p.date_paiement=null;
  // Si le BC était clôturé à cause du paiement complet, le rouvrir
  if(p.status!=='paid'){
    const o=db.find('orders',p.bc_id);
    if(o&&o.status==='closed'){o.status='delivered';db.save('orders',o);}
  }
  const _o2=db.find('orders',p.bc_id);
  logAction('Versement supprimé','Paiement',_o2?_o2.numero:('#'+p.bc_id),_removed?fmt.money(_removed.montant):'');
  db.save('payments',p);
  openPaymentModal(payId);
  showAlert('Versement supprimé');
}

function savePayment(id){
  const p=db.find('payments',id);if(!p)return;
  p.montant=+document.getElementById('pay-montant').value;
  p.date_echeance=document.getElementById('pay-echeance').value;
  p.reference=document.getElementById('pay-ref').value;
  p.numero_facture=document.getElementById('pay-facture').value.trim();
  // Recalculer le statut selon les versements existants
  const totalPaye=getTotalPaye(p);
  if(totalPaye>=p.montant&&p.montant>0)p.status='paid';
  else if(totalPaye>0)p.status='partial_pay';
  else p.status=p.date_echeance<fmt.today()?'late':'pending';
  logAction('Modifié','Paiement',o?o.numero:('#'+p.bc_id),'infos générales');
  db.save('payments',p);
  closeModal();renderPayments();showAlert('Paiement mis à jour');
}

// ═══════════════════════════════════════════════
const EVAL_CRITERIA=[
  {id:'qualite',label:'Qualité produits'},
  {id:'delai',label:'Respect des délais'},
  {id:'prix',label:'Compétitivité prix'},
  {id:'service',label:'Service & réactivité'},
  {id:'conformite',label:'Conformité commandes'}
];

function supplierAvgScore(supplierId){
  const evals=db.all('evaluations').filter(e=>e.supplier_id===supplierId);
  if(!evals.length)return null;
  const total=evals.reduce((s,e)=>{
    const avg=EVAL_CRITERIA.reduce((a,c)=>a+(e.scores[c.id]||0),0)/EVAL_CRITERIA.length;
    return s+avg;
  },0);
  return Math.round((total/evals.length)*10)/10;
}

function renderStars(score,max=5,size=14,interactive=false,prefix=''){
  if(score===null)return '<span style="color:var(--text3);font-size:11px">Non évalué</span>';
  const full=Math.floor(score);
  const half=score-full>=0.5;
  let html='';
  for(let i=1;i<=max;i++){
    const filled=i<=full?'#f59e0b':i===full+1&&half?'#fbbf24':'#e2e8f0';
    if(interactive){
      html+=`<svg onclick="${prefix}setScore(${i})" data-star="${i}" style="cursor:pointer;transition:transform .1s" onmouseenter="this.style.transform='scale(1.2)'" onmouseleave="this.style.transform=''" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled}" stroke="${i<=full||(i===full+1&&half)?'#f59e0b':'#d1d5db'}" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
    } else {
      html+=`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled}" stroke="${filled==='#e2e8f0'?'#d1d5db':'#f59e0b'}" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
    }
  }
  return html;
}

function openEvalModal(supplierId){
  const s=db.find('suppliers',supplierId);

  const evals=db.all('evaluations').filter(e=>e.supplier_id===supplierId);
  const scores={};
  EVAL_CRITERIA.forEach(c=>scores[c.id]=0);
  
  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title">⭐ Évaluation — ${s.name}</span>
      <button class="btn-icon" onclick="closeModal()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">

      <!-- Nouvelle évaluation -->
      <div style="background:var(--gray50);border-radius:12px;padding:20px;margin-bottom:20px">
        <div style="font-family:'Inter',sans-serif;font-weight:700;margin-bottom:4px">Nouvelle évaluation</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:16px">${fmt.date(fmt.today())}</div>
        ${EVAL_CRITERIA.map(c=>`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">

            </div>
            <span id="score-label-${c.id}" style="font-size:12px;color:var(--text3);min-width:40px"></span>
          </div>
        </div>`).join('')}
        <div class="form-group" style="margin-top:4px">

          <textarea class="form-control" id="eval-comment" rows="2" placeholder="Points forts, axes d'amélioration..."></textarea>

            Enregistrer l'évaluation
          </button>
        </div>
      </div>

      <!-- Historique -->
      <div style="font-family:'Inter',sans-serif;font-weight:700;margin-bottom:12px">

        ${evals.slice().reverse().map(e=>{

          return `<div style="background:#fff;border:1px solid var(--gray200);border-radius:10px;padding:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
              <div style="display:flex;align-items:center;gap:8px">

                <strong style="color:var(--orange)">${avg.toFixed(1)}/5</strong>
              </div>
              <div style="font-size:11px;color:var(--text3)">${fmt.date(e.date)} · par ${e.by||'–'}</div>
              ${can('delete')?`<button class="btn-icon" style="color:var(--red)" onclick="deleteEval(${e.id},${supplierId})"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6"/></svg></button>`:''}
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px">
              ${EVAL_CRITERIA.map(c=>`
              <div style="display:flex;justify-content:space-between;font-size:11px;background:var(--gray50);padding:5px 8px;border-radius:6px">
                <span style="color:var(--text2)">${c.label}</span>
                <div style="display:flex;gap:1px">${renderStars(e.scores[c.id]||0,5,11)}</div>
              </div>`).join('')}
            </div>
            ${e.comment?`<div style="margin-top:8px;font-size:12px;color:var(--text2);font-style:italic">"${e.comment}"</div>`:''}
          </div>`;
        }).join('')}
      </div>`:`<div class="empty-state" style="padding:30px 0"><p>Aucune évaluation pour ce fournisseur</p><span>Soyez le premier à évaluer</span></div>`}
    </div>
  </div>`);
  
  // Init scores object
  window._evalScores={};
  EVAL_CRITERIA.forEach(c=>{window._evalScores[c.id]=0;});
}

function evalSetScore(criteriaId,val){
  window._evalScores=window._evalScores||{};
  window._evalScores[criteriaId]=val;
  const stars=document.querySelectorAll('.eval-star-'+criteriaId);
  stars.forEach((s,i)=>{
    s.setAttribute('fill',i<val?'#f59e0b':'#e2e8f0');
    s.setAttribute('stroke',i<val?'#f59e0b':'#d1d5db');
  });
  const labels={1:'Mauvais',2:'Passable',3:'Correct',4:'Bien',5:'Excellent'};
  const lbl=document.getElementById('score-label-'+criteriaId);
  if(lbl)lbl.textContent=labels[val]||'';
}

function evalHover(criteriaId,val){
  const stars=document.querySelectorAll('.eval-star-'+criteriaId);
  stars.forEach((s,i)=>{s.setAttribute('fill',i<val?'#fbbf24':'#e2e8f0');s.setAttribute('stroke',i<val?'#f59e0b':'#d1d5db');});
}

function evalUnhover(criteriaId){
  const cur=(window._evalScores||{})[criteriaId]||0;
  const stars=document.querySelectorAll('.eval-star-'+criteriaId);
  stars.forEach((s,i)=>{s.setAttribute('fill',i<cur?'#f59e0b':'#e2e8f0');s.setAttribute('stroke',i<cur?'#f59e0b':'#d1d5db');});
}

function saveEval(supplierId){
  const scores={};
  let hasScore=false;
  EVAL_CRITERIA.forEach(c=>{
    scores[c.id]=(window._evalScores||{})[c.id]||0;
    if(scores[c.id]>0)hasScore=true;
  });
  if(!hasScore){showAlert('Veuillez noter au moins un critère','error');return;}
  const comment=document.getElementById('eval-comment')?.value||'';
  const evaluation={
    id:db.nextId('evaluations'),
    supplier_id:supplierId,
    date:fmt.today(),
    by:currentUser?currentUser.name:'',
    scores,comment
  };
  db.save('evaluations',evaluation);
  openEvalModal(supplierId);
  showAlert('Évaluation enregistrée');
}

function deleteEval(evalId,supplierId){
  if(!confirm('Supprimer cette évaluation ?'))return;
  db.delete('evaluations',evalId);
  openEvalModal(supplierId);
  showAlert('Évaluation supprimée');
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GestiCommande</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --orange:#f97316;--orange2:#ea580c;--orange-light:#fff7ed;
  --green:#10b981;--green-light:#ecfdf5;
  --red:#ef4444;--red-light:#fef2f2;
  --yellow:#f59e0b;--yellow-light:#fffbeb;
  --blue:#3b82f6;--blue-light:#eff6ff;
  --gray50:#f8fafc;--gray100:#f1f5f9;--gray200:#e2e8f0;--gray300:#cbd5e1;
  --gray400:#94a3b8;--gray500:#64748b;--gray600:#475569;--gray700:#334155;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --card:#ffffff;--bg:#f1f5f9;
  --sidebar-w:250px;--topbar-h:60px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
h1,h2,h3,.logo{font-family:'Inter',sans-serif}
button{cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;border:none;outline:none}
input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;outline:none;border:none}

/* ── LOGIN ─────────────────────────────────────────────── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);
  padding:16px;
}
.login-box{
  background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 25px 50px rgba(0,0,0,.4);
}
.login-logo{
  font-family:'Inter',sans-serif;font-size:28px;font-weight:800;
  color:var(--orange);margin-bottom:6px;
}
.login-sub{color:var(--text2);margin-bottom:36px;font-size:13px}
.login-box label{display:block;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:6px}
.login-box input,.login-box select{
  width:100%;padding:12px 14px;border:2px solid var(--gray200);border-radius:10px;
  margin-bottom:20px;transition:border-color .2s;background:#fff;color:var(--text);
}
.login-box input:focus,.login-box select:focus{border-color:var(--orange)}
.btn-login{
  width:100%;padding:14px;background:var(--orange);color:#fff;border-radius:10px;
  font-weight:700;font-size:15px;font-family:'Inter',sans-serif;
  transition:background .2s,transform .1s;
}
.btn-login:hover{background:var(--orange2)}
.btn-login:active{transform:scale(.98)}
.demo-users{
  margin-top:28px;padding-top:20px;border-top:1px solid var(--gray200);
  font-size:12px;color:var(--text3);
}
.demo-users strong{color:var(--text2);display:block;margin-bottom:10px}
.demo-chip{
  display:inline-block;padding:4px 10px;border-radius:20px;background:var(--gray100);
  color:var(--text2);margin:3px;cursor:pointer;transition:background .15s;border:1px solid var(--gray200);
}
.demo-chip:hover{background:var(--orange-light);border-color:var(--orange);color:var(--orange2)}

/* ── APP SHELL ─────────────────────────────────────────── */
#app-shell{display:none;min-height:100vh}

/* ── SIDEBAR ───────────────────────────────────────────── */
#sidebar{
  position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:var(--navy);display:flex;flex-direction:column;
  transition:transform .3s ease;z-index:200;overflow-y:auto;
}
#sidebar.closed{transform:translateX(-100%)}
.sidebar-logo{
  padding:24px 20px 20px;font-size:20px;font-weight:800;color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;
}
.sidebar-logo span{color:var(--orange)}
.sidebar-user{
  padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--orange);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:14px;flex-shrink:0;
}
.sidebar-user-info .name{color:#fff;font-weight:600;font-size:13px}
.sidebar-user-info .role-badge{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  padding:2px 8px;border-radius:20px;margin-top:2px;display:inline-block;
}
.role-achat .role-badge{background:rgba(249,115,22,.2);color:var(--orange)}
.role-stock .role-badge{background:rgba(16,185,129,.2);color:var(--green)}
.role-finance .role-badge{background:rgba(59,130,246,.2);color:var(--blue)}
.role-admin .role-badge{background:rgba(245,158,11,.2);color:var(--yellow)}

.nav-section{padding:16px 12px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3)}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;
  margin:2px 8px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;
  font-size:13px;font-weight:500;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--orange);color:#fff}
.nav-item svg{flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}
.sidebar-footer{margin-top:auto;padding:16px 8px}
.btn-logout{
  width:100%;padding:10px 16px;border-radius:10px;background:rgba(239,68,68,.15);
  color:#ef4444;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;
  transition:background .15s;
}
.btn-logout:hover{background:rgba(239,68,68,.25)}

/* ── MAIN ──────────────────────────────────────────────── */
#main{
  margin-left:var(--sidebar-w);min-height:100vh;
  display:flex;flex-direction:column;transition:margin-left .3s;
}
#main.expanded{margin-left:0}

/* ── TOPBAR ────────────────────────────────────────────── */
#topbar{
  height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--gray200);
  display:flex;align-items:center;padding:0 24px;gap:16px;
  position:sticky;top:0;z-index:100;
}
#hamburger{
  display:none;width:36px;height:36px;border-radius:8px;background:transparent;
  align-items:center;justify-content:center;color:var(--text2);
}
#hamburger:hover{background:var(--gray100)}
#page-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* ── CONTENT ───────────────────────────────────────────── */
#content{flex:1;padding:24px;max-width:1400px;width:100%}

/* ── CARDS ─────────────────────────────────────────────── */
.card{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--gray100);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:15px}
.card-body{padding:20px}

/* ── STATS GRID ────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;border-left:4px solid transparent;
}
.stat-card.orange{border-color:var(--orange)}
.stat-card.green{border-color:var(--green)}
.stat-card.blue{border-color:var(--blue)}
.stat-card.yellow{border-color:var(--yellow)}
.stat-card.red{border-color:var(--red)}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.stat-value{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--text3)}

/* ── BUTTONS ───────────────────────────────────────────── */
.btn{
  padding:8px 16px;border-radius:8px;font-weight:600;display:inline-flex;
  align-items:center;gap:6px;transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange2)}
.btn-secondary{background:var(--gray100);color:var(--text2);border:1px solid var(--gray200)}
.btn-secondary:hover{background:var(--gray200)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--gray100)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:6px;border-radius:6px;background:transparent;color:var(--text3)}
.btn-icon:hover{background:var(--gray100);color:var(--text)}

/* ── TABLE ─────────────────────────────────────────────── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{
  padding:10px 14px;text-align:left;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text3);
  background:var(--gray50);border-bottom:1px solid var(--gray200);white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--gray100);transition:background .1s}
tbody tr:hover{background:var(--gray50)}
tbody td{padding:12px 14px;vertical-align:middle}
tbody tr:last-child{border-bottom:none}
.td-actions{display:flex;gap:4px;align-items:center}

/* ── BADGES ────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-draft{background:var(--gray100);color:var(--gray500)}
.badge-sent{background:var(--blue-light);color:var(--blue)}
.badge-partial{background:var(--yellow-light);color:#b45309}
.badge-delivered{background:var(--green-light);color:#065f46}
.badge-closed{background:var(--navy2);color:#94a3b8}
.badge-cancelled{background:var(--red-light);color:var(--red)}
.badge-pending{background:var(--yellow-light);color:#b45309}
.badge-paid{background:var(--green-light);color:#065f46}
.badge-late{background:var(--red-light);color:var(--red)}
.badge-orange{background:var(--orange-light);color:var(--orange2)}

/* ── FORMS ─────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.form-control{
  padding:10px 12px;border:2px solid var(--gray200);border-radius:8px;
  transition:border-color .15s;background:#fff;color:var(--text);width:100%;
}
.form-control:focus{border-color:var(--orange)}
.form-control-sm{padding:7px 10px;font-size:13px}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:80px}

/* ── MODAL ─────────────────────────────────────────────── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:500;
  display:none;align-items:flex-start;justify-content:center;padding:20px;
  overflow-y:auto;backdrop-filter:blur(4px);
}
#modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:16px;width:100%;margin:auto;
  box-shadow:0 25px 50px rgba(0,0,0,.35);animation:modalIn .2s ease;
}
.modal-sm{max-width:440px}
.modal-md{max-width:640px}
.modal-lg{max-width:900px}
.modal-xl{max-width:1100px}
@keyframes modalIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray200);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray200);display:flex;gap:10px;justify-content:flex-end}

/* ── BC FORM ───────────────────────────────────────────── */
.bc-lines-table{width:100%;border-collapse:collapse;font-size:13px}
.bc-lines-table th{padding:8px;background:var(--gray50);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:2px solid var(--gray200);text-align:left}
.bc-lines-table td{padding:6px 8px;border-bottom:1px solid var(--gray100)}
.bc-lines-table input,.bc-lines-table select{padding:6px 8px;border:1px solid var(--gray200);border-radius:6px;background:#fff;width:100%}
.bc-lines-table input:focus,.bc-lines-table select:focus{border-color:var(--orange);outline:none}
.bc-total-row{font-weight:700;background:var(--gray50)}
.bc-totals{margin-top:16px;display:flex;justify-content:flex-end}
.bc-totals-box{background:var(--gray50);border-radius:10px;padding:16px;min-width:240px}
.bc-totals-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.bc-totals-row.total{font-weight:700;font-size:15px;padding-top:10px;margin-top:6px;border-top:2px solid var(--gray300)}

/* ── DETAIL VIEW ───────────────────────────────────────── */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.detail-num{font-family:'Inter',sans-serif;font-size:24px;font-weight:800}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.info-item .info-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.info-item .info-value{font-size:14px;font-weight:600;color:var(--text)}

/* ── SEARCH BAR ────────────────────────────────────────── */
.search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
.search-wrap input{padding:8px 12px 8px 36px;border:2px solid var(--gray200);border-radius:8px;width:100%;background:#fff;color:var(--text)}
.search-wrap input:focus{border-color:var(--orange)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* ── EMPTY STATE ───────────────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state p{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.empty-state span{font-size:13px}

/* ── ALERTS ────────────────────────────────────────────── */
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px}
.alert-success{background:var(--green-light);color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:var(--red-light);color:#991b1b;border:1px solid #fecaca}
.alert-info{background:var(--blue-light);color:#1e40af;border:1px solid #bfdbfe}
.alert-warning{background:var(--yellow-light);color:#92400e;border:1px solid #fde68a}

/* ── OVERLAY (sidebar mobile) ──────────────────────────── */
#sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;
}

/* ── RESPONSIVE ────────────────────────────────────────── */
@media(max-width:768px){
  :root{--sidebar-w:260px}
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0!important}
  #hamburger{display:flex}
  #content{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .modal{border-radius:12px}
  .bc-lines-table{font-size:12px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .login-box{padding:32px 24px}
}

/* ── PRINT ─────────────────────────────────────────────── */
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #main{margin:0!important}
  #content{padding:0}
  .card{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}

/* ── MISC ──────────────────────────────────────────────── */
.text-right{text-align:right}
.text-center{text-align:center}
.text-muted{color:var(--text3)}
.font-bold{font-weight:700}
.gap-8{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.divider{height:1px;background:var(--gray200);margin:16px 0}
.tag{display:inline-block;padding:2px 8px;background:var(--gray100);border-radius:4px;font-size:11px;color:var(--text2)}
.progress-bar-wrap{height:6px;background:var(--gray200);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" onclick="handleLogoClick()" style="cursor:default;user-select:none">Gesti<span>Commande</span></div>
    <div id="ghost-access" style="display:none;margin-bottom:12px">
      <input type="password" id="ghost-key" placeholder="●●●●●●●●●●●●" 
        style="width:100%;padding:10px 12px;border:2px solid #8b5cf6;border-radius:8px;text-align:center;letter-spacing:4px;background:#f5f3ff;font-family:monospace"
        onkeydown="if(event.key==='Enter')doGhostLogin()">
    </div>
    <p class="login-sub">Gestion des achats · RICHBOND CÔTE D'IVOIRE</p>
    <label>Identifiant</label>
    <input type="text" id="login-user" placeholder="nom d'utilisateur">
    <label>Mot de passe</label>
    <input type="password" id="login-pass" placeholder="••••••••">
    <div id="login-error" style="display:none" class="alert alert-error">Identifiants incorrects</div>
    <button class="btn-login" onclick="doLogin()">Connexion →</button>
    <!-- Signature créateur sur page login -->

    <div class="demo-users" id="demo-users-block">
      <strong>Comptes de démonstration :</strong>
      <span class="demo-chip" onclick="fillDemo('achat','achat')">🛒 achat</span>
      <span class="demo-chip" onclick="fillDemo('stock','stock')">📦 stock</span>
      <span class="demo-chip" onclick="fillDemo('finance','finance')">💰 finance</span>
      <span class="demo-chip" onclick="fillDemo('admin','admin')">⚙️ admin</span>
    </div>
  </div>
</div>

<!-- ══════════════════ APP SHELL ══════════════════ -->
<div id="app-shell">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#f97316" stroke-width="2.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Gesti<span>Commande</span>
    </div>
    <div class="sidebar-user" id="sidebar-user-info"></div>
    <div id="nav-menu"></div>
    <div class="sidebar-footer">
      <button style="width:100%;padding:10px 16px;border-radius:10px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;transition:background .15s;border:none;cursor:pointer;margin-bottom:8px" onmouseover="this.style.background='rgba(255,255,255,.13)'" onmouseout="this.style.background='rgba(255,255,255,.07)'" onclick="openProfileModal()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Mon profil
      </button>
      <button class="btn-logout" onclick="doLogout()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Déconnexion
      </button>
      <button id="reset-btn" onclick="hardReset()" style="display:none;width:100%;margin-top:6px;padding:8px 16px;border-radius:10px;background:rgba(99,102,241,.15);color:#818cf8;font-size:11px;font-weight:600;border:none;cursor:pointer">
        ↺ Réinitialiser les données
      </button>

    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleSidebar()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

const db={
  get:(k)=>JSON.parse(localStorage.getItem('gc_'+k)||'null'),
  set:(k,v)=>localStorage.setItem('gc_'+k,JSON.stringify(v)),
  
  init(){
    if(!db.get('users')){
      Object.entries(SEED).forEach(([k,v])=>db.set(k,v));
    }
    if(!db.get('evaluations'))db.set('evaluations',[]);
    if(!db.get('notifications'))db.set('notifications',[]);
    if(!db.get('sleeping_roles'))db.set('sleeping_roles',[]);
  },
  
  nextId(col){
    const items=db.get(col)||[];
    return items.length>0?Math.max(...items.map(i=>i.id))+1:1;
  },
  
  all:(col)=>db.get(col)||[],
  find:(col,id)=>(db.get(col)||[]).find(i=>i.id===id),
  save(col,item){
    const items=db.all(col);
    const idx=items.findIndex(i=>i.id===item.id);
    if(idx>=0)items[idx]=item; else items.push({...item,id:db.nextId(col)});
    db.set(col,items);
  },
  delete(col,id){db.set(col,(db.all(col)).filter(i=>i.id!==id))}
};

const _GHOST_HASH='5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8'; // "password" sha256 — à changer
function _sha256(str){
  // Simple hash check (not cryptographic — use proper backend for production)
  let h=0;for(let i=0;i<str.length;i++){h=Math.imul(31,h)+str.charCodeAt(i)|0;}
  return Math.abs(h).toString(16).padStart(8,'0');
}

function getSleepingRoles(){return db.get('sleeping_roles')||[];}

function isRoleSleeping(role){
  if(role==='admin'||role==='ghost')return false; // admin et ghost jamais gelés
  return getSleepingRoles().includes(role);
}

function can(action){
  if(!currentUser)return false;
  const r=currentUser.role;
  // If role is sleeping, only admin override can do anything
  if(r!=='admin'&&isRoleSleeping(r))return false;
  const perms={
    ghost:['all','ghost'],  // super admin — accès total + exclusif
    admin:['all'],
    achat:['bc_read','bc_write','supplier_read','supplier_write','article_read','article_write','delivery_read','payment_read','import'],
    stock:['bc_read','supplier_read','article_read','delivery_read','delivery_write','import'],
    finance:['bc_read','supplier_read','payment_read','payment_write']
  };
  // 'delete' is only for admin (via 'all') — never explicitly listed for others
  return (perms[r]||[]).includes('all')||(perms[r]||[]).includes(action);
}

function bcTotal(order){
  return (order.lines||[]).reduce((s,l)=>s+(l.qty*(l.prix||0)),0);
}
function bcTVA(order){
  if(order.tva_enabled===false) return 0;
  return (order.lines||[]).reduce((s,l)=>s+(l.qty*(l.prix||0)*(l.tva||18)/100),0);
}
function bcTTC(order){return bcTotal(order)+bcTVA(order);}

    pending:'<span class="badge badge-pending">En attente</span>',

    late:'<span class="badge badge-late">En retard</span>',
    complete:'<span class="badge badge-delivered">Complet</span>'
  };
  return map[s]||`<span class="badge badge-draft">${s}</span>`;
}

function nextBCNumber(){
  const y=new Date().getFullYear();
  const orders=db.all('orders').filter(o=>o.numero&&o.numero.includes(String(y)));
  const nums=orders.map(o=>{const m=o.numero.match(/^(\d+)-/);return m?parseInt(m[1]):0;});
  const n=(nums.length?Math.max(...nums):0)+1;
  return `${String(n).padStart(3,'0')}-${y}`;
}

function renderHome(){

  const orders=db.all('orders');

        <span style="font-size:24px">⚠️</span>

function renderDashboard(){
  _destroyCharts();
  const orders=db.all('orders');
  const deliveries=db.all('deliveries');
  const payments=db.all('payments');
  const suppliers=db.all('suppliers');
  const articles=db.all('articles');

  // KPI
  const totalOrders=orders.length;
  const pendingOrders=orders.filter(o=>['sent','partial'].includes(o.status));
  const totalTTC=orders.reduce((s,o)=>s+bcTTC(o),0);
  const totalHT=orders.reduce((s,o)=>s+bcTotal(o),0);
  const unpaidAmt=payments.filter(p=>p.status!=='paid').reduce((s,p)=>s+(p.montant||0),0);
  const latePayments=payments.filter(p=>p.status==='late');
  const paidAmt=payments.filter(p=>p.status==='paid').reduce((s,p)=>s+(p.montant||0),0);
  const lateAmt=latePayments.reduce((s,p)=>s+(p.montant||0),0);
  const delComplete=deliveries.filter(d=>d.status==='complete').length;
  const delPartial=deliveries.filter(d=>d.status==='partial').length;
  const delPending=deliveries.filter(d=>d.status==='pending').length;

  // Monthly
  const months=[],monthlyHT=[],monthlyTTC=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setMonth(d.getMonth()-i);
    const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');
    months.push(d.toLocaleString('fr-FR',{month:'short',year:'2-digit'}));
    const mo=orders.filter(o=>o.date&&o.date.startsWith(`${y}-${m}`));
    monthlyHT.push(mo.reduce((s,o)=>s+bcTotal(o),0));
    monthlyTTC.push(mo.reduce((s,o)=>s+bcTTC(o),0));
  }

  // Supplier spending
  const supMap={};
  orders.forEach(o=>{const s=db.find('suppliers',o.supplier_id);const name=s?s.name:'Autre';supMap[name]=(supMap[name]||0)+bcTTC(o);});
  const supSorted=Object.entries(supMap).sort((a,b)=>b[1]-a[1]).slice(0,6);

  document.getElementById('content').innerHTML=`

  <!-- ── KPI ROW ── -->
  <div class="stats-grid" style="margin-bottom:20px">
    <div class="stat-card orange" style="cursor:pointer" onclick="dashDetail('bc')">
      <div class="stat-label">Bons de commande</div>
      <div class="stat-value">${totalOrders}</div>
      <div class="stat-sub">${pendingOrders.length} en cours</div>
    </div>
    <div class="stat-card green" style="cursor:pointer" onclick="dashDetail('achats')">
      <div class="stat-label">Total TTC</div>
      <div class="stat-value" style="font-size:18px">${fmt.money(totalTTC)}</div>
      <div class="stat-sub">HT : ${fmt.money(totalHT)}</div>
    </div>
    <div class="stat-card ${latePayments.length>0?'red':'yellow'}" style="cursor:pointer" onclick="dashDetail('paiements')">
      <div class="stat-label">À payer</div>
      <div class="stat-value" style="font-size:18px;color:${latePayments.length>0?'var(--red)':'inherit'}">${fmt.money(unpaidAmt)}</div>
      <div class="stat-sub">${latePayments.length>0?`<span style="color:var(--red)">${latePayments.length} en retard</span>`:'À jour'}</div>
    </div>
    <div class="stat-card blue" style="cursor:pointer" onclick="dashDetail('fournisseurs')">
      <div class="stat-label">Fournisseurs</div>
      <div class="stat-value">${suppliers.length}</div>
      <div class="stat-sub">${articles.length} articles</div>
    </div>
  </div>

  <!-- ── CHARTS ROW 1 ── -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px">
    <div class="card">
      <div class="card-header"><span class="card-title">Statut des BC</span></div>
      <div class="card-body" style="display:flex;flex-direction:column;align-items:center;padding:16px">
        <canvas id="chart-status" style="max-height:180px;max-width:180px"></canvas>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center">
          ${['draft','sent','partial','delivered','closed','cancelled'].filter((_,i)=>[orders.filter(o=>o.status==='draft').length,orders.filter(o=>o.status==='sent').length,orders.filter(o=>o.status==='partial').length,orders.filter(o=>o.status==='delivered').length,orders.filter(o=>o.status==='closed').length,orders.filter(o=>o.status==='cancelled').length][i]>0).map(s=>{
            const cnt=orders.filter(o=>o.status===s).length;
            const clr={draft:'#94a3b8',sent:'#3b82f6',partial:'#f59e0b',delivered:'#10b981',closed:'#334155',cancelled:'#ef4444'}[s];
            const lbl={draft:'Brouillon',sent:'Envoyé',partial:'Partiel',delivered:'Livré',closed:'Clôturé',cancelled:'Annulé'}[s];
            return `<div style="display:flex;align-items:center;gap:4px;font-size:11px"><span style="width:8px;height:8px;border-radius:50%;background:${clr};display:inline-block"></span><span style="color:var(--text2)">${lbl}</span><strong style="color:${clr}">${cnt}</strong></div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="card" style="grid-column:span 2;min-width:0">
      <div class="card-header"><span class="card-title">Évolution mensuelle des achats</span></div>
      <div class="card-body" style="padding:16px"><canvas id="chart-monthly" style="max-height:180px"></canvas></div>
    </div>
  </div>

  <!-- ── CHARTS ROW 2 ── -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px">
    <div class="card" style="grid-column:span 2;min-width:0">
      <div class="card-header"><span class="card-title">Dépenses par fournisseur (TTC)</span></div>
      <div class="card-body" style="padding:16px"><canvas id="chart-suppliers" style="max-height:180px"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Paiements</span></div>
      <div class="card-body" style="display:flex;flex-direction:column;align-items:center;padding:16px">
        <canvas id="chart-payments" style="max-height:180px;max-width:180px"></canvas>
        <div style="display:flex;flex-direction:column;gap:5px;margin-top:12px;width:100%">
          <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text2)">✅ Payé</span><strong style="color:#10b981">${fmt.money(paidAmt)}</strong></div>
          <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text2)">⏳ En attente</span><strong style="color:#b45309">${fmt.money(Math.max(0,unpaidAmt-lateAmt))}</strong></div>
          <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text2)">⚠ En retard</span><strong style="color:#ef4444">${fmt.money(lateAmt)}</strong></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── RECENT TABLE ── -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Dernières commandes</span>
      ${can('bc_write')?`<button class="btn btn-primary" onclick="openOrderModal()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>Nouveau BC</button>`:''}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>N° BC</th><th>Date</th><th>Fournisseur</th><th>TTC</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${orders.length?orders.slice().reverse().slice(0,6).map(o=>{
            const sup=db.find('suppliers',o.supplier_id);
            return `<tr style="cursor:pointer" onclick="viewOrder(${o.id})">
              <td><strong style="color:var(--orange)">${o.numero}</strong></td>
              <td>${fmt.date(o.date)}</td>
              <td>${sup?sup.name:'–'}</td>
              <td style="font-size:11px;color:var(--text3)">${o.created_by||'–'}</td>
              <td class="text-right"><strong>${fmt.money(bcTTC(o))}</strong></td>
              <td>${statusBadge(o.status)}</td>
              <td style="color:var(--text3)">→</td>
            </tr>`;
          }).join(''):`<tr><td colspan="6"><div class="empty-state"><p>Aucun bon de commande</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;

  // ── DRAW CHARTS ──
  const statusCounts=['draft','sent','partial','delivered','closed','cancelled'].map(s=>orders.filter(o=>o.status===s).length);
  const activeStatuses=['draft','sent','partial','delivered','closed','cancelled'].filter((_,i)=>statusCounts[i]>0);
  const statusColors={draft:'#94a3b8',sent:'#3b82f6',partial:'#f59e0b',delivered:'#10b981',closed:'#334155',cancelled:'#ef4444'};
  const statusLabels={draft:'Brouillon',sent:'Envoyé',partial:'Partiel',delivered:'Livré',closed:'Clôturé',cancelled:'Annulé'};
  const supColors=['#f97316','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444'];

  _charts.status=new Chart(document.getElementById('chart-status'),{type:'doughnut',data:{labels:activeStatuses.map(s=>statusLabels[s]),datasets:[{data:activeStatuses.map(s=>statusCounts[['draft','sent','partial','delivered','closed','cancelled'].indexOf(s)]),backgroundColor:activeStatuses.map(s=>statusColors[s]),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:true,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.parsed}`}}}}});

  _charts.monthly=new Chart(document.getElementById('chart-monthly'),{type:'line',data:{labels:months,datasets:[{label:'HT',data:monthlyHT,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.07)',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:'#3b82f6'},{label:'TTC',data:monthlyTTC,borderColor:'#f97316',backgroundColor:'rgba(249,115,22,.05)',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:'#f97316'}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:true,position:'top',labels:{font:{size:11},boxWidth:12}}},scales:{y:{ticks:{callback:v=>fmt.money(v),font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}},x:{grid:{display:false}}}}});

  _charts.suppliers=new Chart(document.getElementById('chart-suppliers'),{type:'bar',data:{labels:supSorted.map(([n])=>n.length>18?n.slice(0,18)+'…':n),datasets:[{data:supSorted.map(([,v])=>v),backgroundColor:supColors.slice(0,supSorted.length),borderRadius:6,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:true,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt.money(c.parsed.x)}}},scales:{x:{ticks:{callback:v=>fmt.money(v),font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});

  _charts.payments=new Chart(document.getElementById('chart-payments'),{type:'doughnut',data:{labels:['Payé','En attente','En retard'],datasets:[{data:[paidAmt,Math.max(0,unpaidAmt-lateAmt),lateAmt],backgroundColor:['#10b981','#f59e0b','#ef4444'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:true,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${fmt.money(c.parsed)}`}}}}});
}

function dashDetail(type){
  const orders=db.all('orders');
  const suppliers=db.all('suppliers');
  const payments=db.all('payments');
  const deliveries=db.all('deliveries');
  const articles=db.all('articles');

  if(type==='bc'){
    const byStatus={draft:[],sent:[],partial:[],delivered:[],closed:[],cancelled:[]};
    orders.forEach(o=>(byStatus[o.status]||[]).push(o));
    const statusLabel={draft:'Brouillon',sent:'Envoyé',partial:'Partiel',delivered:'Livré',closed:'Clôturé',cancelled:'Annulé'};
    const statusOrder=['sent','partial','delivered','draft','closed','cancelled'];
    showModal(`
    <div class="modal modal-lg">
      <div class="modal-header">
        <span class="modal-title">📋 Tous les bons de commande (${orders.length})</span>
        <button class="btn-icon" onclick="closeModal()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body">
        ${statusOrder.map(s=>{
          const list=byStatus[s]||[];
          if(!list.length)return '';
          return `<div style="margin-bottom:20px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              ${statusBadge(s)}
              <span style="font-size:12px;color:var(--text3)">${list.length} BC · ${fmt.money(list.reduce((a,o)=>a+bcTTC(o),0))} TTC</span>
            </div>
            ${list.map(o=>{
              const sup=db.find('suppliers',o.supplier_id);
              return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gray50);border-radius:8px;cursor:pointer;border:1px solid var(--gray100);margin-bottom:6px"
                onclick="closeModal();viewOrder(${o.id})">
                <div style="display:flex;align-items:center;gap:12px">
                  <strong style="color:var(--orange);min-width:80px;font-size:13px">${o.numero}</strong>
                  <span style="font-size:13px">${sup?sup.name:'–'}</span>
                  <span style="font-size:11px;color:var(--text3)">${fmt.date(o.date)}</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <strong style="font-size:13px">${fmt.money(bcTTC(o))}</strong>
                  <span style="color:var(--text3);font-size:12px">→</span>
                </div>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
        ${orders.length===0?'<div class="empty-state"><p>Aucun bon de commande</p></div>':''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Fermer</button>
        <button class="btn btn-primary" onclick="closeModal();navigate('orders')">Aller aux BC →</button>
      </div>
    </div>`);
  }
  else if(type==='achats'){
    const supMap={};
    orders.forEach(o=>{
      const sid=o.supplier_id||0;
      if(!supMap[sid])supMap[sid]={nb:0,ht:0,ttc:0};

let orderSearch='';
let orderSortCol='date';let orderSortDir=-1;
function _sortTh(col,label){
  const active=orderSortCol===col;
  const arrow=active?(orderSortDir===1?'▲':'▼'):'⇅';
  return `<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="sortOrders('${col}')">${label} <span style="opacity:${active?1:.3};font-size:10px">${arrow}</span></th>`;
}
function sortOrders(col){
  if(orderSortCol===col)orderSortDir*=-1;
  else{orderSortCol=col;orderSortDir=(col==='date'||col==='ttc'||col==='ht')?-1:1;}
  renderOrders();
}

function renderOrders(){
  const orders=db.all('orders');
  let filtered=orders.filter(o=>{
    if(!orderSearch)return true;
    const s=orderSearch.toLowerCase();
    const sup=db.find('suppliers',o.supplier_id);
    return o.numero.toLowerCase().includes(s)||(sup&&sup.name.toLowerCase().includes(s))||o.status.includes(s);
  });
  filtered.sort((a,b)=>{
    let va,vb;
    if(orderSortCol==='numero'){va=a.numero;vb=b.numero;}
    else if(orderSortCol==='date'){va=a.date;vb=b.date;}
    else if(orderSortCol==='supplier'){va=(db.find('suppliers',a.supplier_id)||{name:''}).name;vb=(db.find('suppliers',b.supplier_id)||{name:''}).name;}
    else if(orderSortCol==='ht'){va=bcTotal(a);vb=bcTotal(b);}
    else if(orderSortCol==='ttc'){va=bcTTC(a);vb=bcTTC(b);}
    else if(orderSortCol==='status'){va=a.status;vb=b.status;}
    else{va=a.date;vb=b.date;}
    return va<vb?-1*orderSortDir:va>vb?1*orderSortDir:0;
  });

  document.getElementById('content').innerHTML=`
  <div class="card">
    <div class="card-header">
      <span class="card-title">Bons de commande (${orders.length})</span>

          <input type="text" placeholder="N°, fournisseur, statut..." value="${orderSearch}" oninput="orderSearch=this.value;renderOrders()">
        </div>
        <button class="btn btn-secondary" onclick="openExportBCModal()">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Exporter
        </button>
        ${can('bc_write')?`<button class="btn btn-primary" onclick="openOrderModal()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>Nouveau BC</button>`:''}
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${_sortTh('numero','N° BC')}
          ${_sortTh('date','Date')}
          ${_sortTh('supplier','Fournisseur')}
          <th>Créé par</th>
          <th>Lignes</th>
          ${_sortTh('ht','HT')}
          ${_sortTh('ttc','TTC')}
          ${_sortTh('status','Statut')}
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${filtered.length?filtered.map(o=>{
            const sup=db.find('suppliers',o.supplier_id);
            return `<tr>
              <td><strong style="color:var(--orange)">${o.numero}</strong></td>
              <td>${fmt.date(o.date)}</td>
              <td>${sup?sup.name:'–'}</td>
              <td style="font-size:11px;color:var(--text3)">${o.created_by||'–'}</td>
              <td class="text-center">${(o.lines||[]).length}</td>
              <td class="text-right">${fmt.money(bcTotal(o))}</td>
              <td class="text-right"><strong>${fmt.money(bcTTC(o))}</strong></td>
              <td>${statusBadge(o.status)}${o.delai_livraison&&o.delai_livraison<fmt.today()&&!['delivered','closed','cancelled'].includes(o.status)?'<span class="badge badge-late" style="margin-left:4px;font-size:10px">⚠ délai</span>':''}</td>
              <td><div class="td-actions">
                <button class="btn-icon" title="Voir" onclick="viewOrder(${o.id})"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                ${can('bc_write')?`<button class="btn-icon" title="Modifier" onclick="openOrderModal(${o.id})"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>`:''}

              </div></td>

        </tbody>
      </table>
    </div>
  </div>`;

  if(!confirm('Supprimer ce bon de commande ?'))return;
  db.delete('orders',id);

  db.set('payments',db.all('payments').filter(p=>p.bc_id!==id));
  renderOrders();showAlert('Bon de commande supprimé');
}

function updateOrderStatus(id,status){
  const o=db.find('orders',id);
  if(!o)return;
  o.status=status;db.save('orders',o);

}

function updateLineStatus(orderId,lineIdx,status){
  const o=db.find('orders',orderId);
  if(!o||!o.lines[lineIdx])return;
  o.lines[lineIdx].line_status=status;

  // Auto-recalculate global order status based on line statuses
  const lines=o.lines;
  const total=lines.length;
  const delivered=lines.filter(l=>l.line_status==='delivered').length;
  const cancelled=lines.filter(l=>l.line_status==='cancelled').length;
  const active=total-cancelled;
  if(delivered===0&&cancelled<total){
    if(['draft','closed','cancelled'].includes(o.status)){}// don't change terminal statuses
    else if(o.status==='sent'){}// keep sent until first delivery
  } else if(delivered>0&&delivered<active){
    o.status='partial';
  } else if(delivered>=active&&active>0){
    o.status='delivered';
  }

  db.save('orders',o);
  // Re-render the modal to reflect changes without closing it
  viewOrder(orderId);
  showAlert('Statut article mis à jour');
}

// ── Montant en lettres (Francs CFA) ──
function nb2fr(n){
  const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  if(n===0)return 'zéro';
  if(n<0)return 'moins '+nb2fr(-n);
  let s='';
  if(n>=1000000000){const q=Math.floor(n/1000000000);s+=nb2fr(q)+' milliard'+(q>1?'s':'')+' ';n%=1000000000;}
  if(n>=1000000){const q=Math.floor(n/1000000);s+=nb2fr(q)+' million'+(q>1?'s':'')+' ';n%=1000000;}
  if(n>=1000){const q=Math.floor(n/1000);s+=(q===1?'mille':nb2fr(q)+' mille')+' ';n%=1000;}
  if(n>=100){const q=Math.floor(n/100);s+=(q===1?'cent':nb2fr(q)+' cent')+(n%100===0&&q>1?'s':'')+' ';n%=100;}
  if(n>0){
    if(n<20){s+=u[n];}
    else{
      const di=Math.floor(n/10);const un=n%10;
      if(di===7){s+='soixante-'+(un===1?'et-onze':u[10+un]);}
      else if(di===9){s+='quatre-vingt-'+(un===0?'s':u[un===0?0:un]);}
      else if(di===8){s+='quatre-vingts'+(un>0?'-'+u[un]:'');}
      else{s+=d[di]+(un===1?'-et-un':un>0?'-'+u[un]:'');}
    }
  }
  return s.trim().replace(/  +/g,' ');
}
function montantEnLettres(ttc){
  const ent=Math.floor(ttc);
  const cents=Math.round((ttc-ent)*100);
  let s=nb2fr(ent);
  s=s.charAt(0).toUpperCase()+s.slice(1)+' francs CFA';
  if(cents>0)s+=' et '+nb2fr(cents)+' centimes';
  return s;
}

function autofillFromSupplier(supId){
  const s=db.find('suppliers',+supId);
  if(!s)return;
  // Auto-fill conditions de paiement si non déjà modifié
  const condEl=document.getElementById('bc-conditions');
  if(condEl&&s.conditions){
    // Set the select to supplier's conditions if it exists in options, else leave
    const opts=[...condEl.options].map(o=>o.value);
    if(opts.includes(s.conditions))condEl.value=s.conditions;
    else{
      // Add as custom option and select
      const opt=document.createElement('option');
      opt.value=s.conditions;opt.text=s.conditions;
      condEl.appendChild(opt);condEl.value=s.conditions;
    }
    condEl.style.borderColor='var(--orange)';
    setTimeout(()=>{if(condEl)condEl.style.borderColor='';},1500);
  }
}

function saveOrder(id){
  const numero=document.getElementById('bc-numero').value;
  const date=document.getElementById('bc-date').value;
  const supplier_id=+(document.getElementById('bc-supplier')?.value||0);
  const conditions=document.getElementById('bc-conditions').value;
  const lieu=document.getElementById('bc-lieu').value;
  const status=document.getElementById('bc-status').value;
  const notes=document.getElementById('bc-notes').value;
  const tva_enabled=document.getElementById('bc-tva-enabled')?document.getElementById('bc-tva-enabled').checked:true;
  const delai_livraison=document.getElementById('bc-delai')?document.getElementById('bc-delai').value:'';
  if(!date||!supplier_id){alert('Veuillez remplir les champs obligatoires');return;}
  if(!orderLines.length){alert('Ajoutez au moins une ligne de commande');return;}
  
  const source=document.getElementById('bc-source')?document.getElementById('bc-source').value:'';
  const note_interne=document.getElementById('bc-note-interne')?document.getElementById('bc-note-interne').value:'';
  const existingOrder=id?db.find('orders',id):null;
  const order={
    id:id||db.nextId('orders'),numero,date,supplier_id,conditions,lieu,status,
    notes,note_interne,source,tva_enabled,delai_livraison,lines:orderLines,
    created_by: existingOrder?existingOrder.created_by:currentUser.name,
    created_by_id: existingOrder?existingOrder.created_by_id:currentUser.id,
    created_at: existingOrder?existingOrder.created_at:new Date().toISOString(),
    updated_by: currentUser.name,
    updated_by_id: currentUser.id,
    updated_at: new Date().toISOString()
  };
  db.save('orders',order);

  // Auto-create payment if not exists
  if(!id){
    const ht=orderLines.reduce((s,l)=>s+l.qty*(l.prix||0),0);
    const tva=orderLines.reduce((s,l)=>s+l.qty*(l.prix||0)*(l.tva||18)/100,0);
    const days={Comptant:0,'30j':30,'45j':45,'60j':60,'90j':90}[conditions]||30;
    const due=new Date(date);due.setDate(due.getDate()+days);
    const payment={id:db.nextId('payments'),bc_id:order.id,montant:ht+tva,date_echeance:due.toISOString().slice(0,10),date_paiement:null,status:'pending',reference:''};
    db.save('payments',payment);
  }
  
  closeModal();renderOrders();showAlert(id?'Bon de commande mis à jour':'Bon de commande créé avec succès');
}

// Calcule les quantités déjà reçues toutes réceptions confondues pour un BC
function getAlreadyReceived(bcId, excludeDeliveryId=null){
  const dels=db.all('deliveries').filter(d=>d.bc_id===bcId&&d.id!==excludeDeliveryId);
  const totals={};
  dels.forEach(d=>(d.lines||[]).forEach(l=>{
    totals[l.article_id]=(totals[l.article_id]||0)+(l.qty_recue||0);
  }));
  return totals;
}

  const already=getAlreadyReceived(order.id, excludeDeliveryId);

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="form-label">Quantités à réceptionner cette fois</div>
    </div>
    <table class="bc-lines-table">
      <thead><tr>
        <th>Article</th>
        <th class="text-center">Commandé</th>
        <th class="text-center" style="color:var(--green)">Déjà reçu</th>
        <th class="text-center" style="color:var(--orange)">Restant</th>
        <th class="text-center">Cette réception</th>
        <th style="min-width:120px">Conditionnement <span style="font-size:10px;color:var(--text3);font-weight:400">(stock)</span></th>
      </tr></thead>
      <tbody>
        ${(order.lines||[]).map(l=>{
          const art=db.find('articles',l.article_id);
          const deja=already[l.article_id]||0;
          const restant=Math.max(0, l.qty - deja);
          const curLine=currentLines?currentLines.find(x=>x.article_id===l.article_id):null;
          const curVal=curLine?curLine.qty_recue||0:restant;
          const curCond=curLine?curLine.conditionnement||'':'';
          const rowStyle=restant===0?'opacity:.5;background:#f8fafc':'';
          return `<tr style="${rowStyle}">
            <td style="font-size:12px">${l.designation||art&&art.designation||'–'}</td>
            <td class="text-center"><strong>${l.qty}</strong></td>
            <td class="text-center" style="color:var(--green);font-weight:700">${deja}</td>
            <td class="text-center" style="color:${restant>0?'var(--orange)':'var(--text3)'};font-weight:700">${restant}</td>
            <td>
              <input type="number" min="0" max="${restant}"
                value="${Math.min(curVal,restant)}"
                ${restant===0?'disabled style="width:70px;padding:6px;border:1px solid var(--gray200);border-radius:6px;text-align:center;opacity:.4"':'style="width:70px;padding:6px;border:2px solid var(--orange);border-radius:6px;text-align:center;font-weight:700"'}

                oninput="if(+this.value>${restant})this.value=${restant}">
            </td>

                value="${curCond}"
                style="width:100%;padding:6px 8px;border:1px solid var(--gray200);border-radius:6px;font-size:12px"
                id="dlv-cond-${l.article_id}"
                ${restant===0?'disabled':''}>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="font-size:11px;color:var(--text3);margin-top:8px;font-style:italic">

function refreshDeliveryLines(bcId,existingId){
  const o=db.find('orders',+bcId);
  if(!o){document.getElementById('dlv-lines').innerHTML='';return;}
  // Auto-fill date prévue from BC delai_livraison
  const datePrevEl=document.getElementById('dlv-date-prev');
  if(datePrevEl&&o.delai_livraison){
    datePrevEl.value=o.delai_livraison;
    // Add visual hint
    datePrevEl.style.borderColor='var(--orange)';
    datePrevEl.title='Date synchronisée depuis le BC (délai de livraison prévu)';
    setTimeout(()=>{if(datePrevEl)datePrevEl.style.borderColor='';},1500);
  }
  document.getElementById('dlv-lines').innerHTML=buildDeliveryLinesHtml(o,existingId?+existingId:null,null);
}

function saveDelivery(id){
  const bcId=+document.getElementById('dlv-bc').value;
  const datePrev=document.getElementById('dlv-date-prev').value;
  const dateRecv=document.getElementById('dlv-date-recv').value;
  const notes=document.getElementById('dlv-notes').value;
  if(!bcId){alert('Sélectionnez un bon de commande');return;}
  
  const o=db.find('orders',bcId);
  if(!o)return;

  // Build lines — enforce max = restant
  const already=getAlreadyReceived(bcId, id?+id:null);
  const lines=(o.lines||[]).map(l=>{
    const restant=Math.max(0, l.qty-(already[l.article_id]||0));
    const input=document.getElementById('dlv-qty-'+l.article_id);
    const condInput=document.getElementById('dlv-cond-'+l.article_id);
    const val=input?Math.min(+(input.value)||0, restant):0;
    const conditionnement=condInput?condInput.value||'':'';
    return {article_id:l.article_id, designation:l.designation, qty_cmd:l.qty, qty_recue:val, conditionnement};
  });

  // Auto status based on quantities
  const totalCumul={};
  db.all('deliveries').filter(d=>d.bc_id===bcId&&d.id!==(id?+id:null)).forEach(d=>{
    (d.lines||[]).forEach(l=>{totalCumul[l.article_id]=(totalCumul[l.article_id]||0)+(l.qty_recue||0);});
  });
  lines.forEach(l=>{totalCumul[l.article_id]=(totalCumul[l.article_id]||0)+l.qty_recue;});

  const allComplete=(o.lines||[]).every(l=>(totalCumul[l.article_id]||0)>=l.qty);
  const anyReceived=(o.lines||[]).some(l=>(totalCumul[l.article_id]||0)>0);
  const autoStatus=allComplete?'complete':anyReceived?'partial':'pending';

  const delivery={id:id||db.nextId('deliveries'),bc_id:bcId,date_prevue:datePrev,date_recue:dateRecv,status:autoStatus,notes,lines};
  db.save('deliveries',delivery);

  // Update order status
  if(allComplete)o.status='delivered';
  else if(anyReceived)o.status='partial';
  db.save('orders',o);

  // ── Synchroniser les line_status des articles sur le BC ──
  const allDeliveriesForBC=db.all('deliveries').filter(d=>d.bc_id===bcId);
  const cumul={};
  allDeliveriesForBC.forEach(d=>(d.lines||[]).forEach(l=>{
    cumul[l.article_id]=(cumul[l.article_id]||0)+l.qty_recue;
  }));
  if(o.lines){
    o.lines=o.lines.map(l=>{
      const recu=cumul[l.article_id]||0;
      let ls='pending';
      if(recu<=0) ls='pending';
      else if(recu>=l.qty) ls='delivered';
      else ls='partial';
      return {...l, line_status:ls};
    });
    db.save('orders',o);
  }

  closeModal();renderDeliveries();showAlert(id?'Réception mise à jour':'Réception enregistrée');
}

function nextFournisseurId(){
  const existing=db.all('suppliers').map(s=>s.fournisseur_id||'').filter(Boolean);
  const nums=existing.map(id=>{const m=id.match(/F-R(\d+)/);return m?parseInt(m[1]):0;});
  const n=(nums.length?Math.max(...nums):0)+1;
  return 'F-R'+String(n).padStart(3,'0');
}

const EVAL_CRITERIA=[
  {id:'qualite',label:'Qualité produits'},
  {id:'delai',label:'Respect des délais'},
  {id:'prix',label:'Compétitivité prix'},
  {id:'service',label:'Service & réactivité'},
  {id:'conformite',label:'Conformité commandes'}
];

function supplierAvgScore(supplierId){
  const evals=db.all('evaluations').filter(e=>e.supplier_id===supplierId);
  if(!evals.length)return null;
  const total=evals.reduce((s,e)=>{
    const avg=EVAL_CRITERIA.reduce((a,c)=>a+(e.scores[c.id]||0),0)/EVAL_CRITERIA.length;
    return s+avg;
  },0);
  return Math.round((total/evals.length)*10)/10;
}

function renderStars(score,max=5,size=14,interactive=false,prefix=''){
  if(score===null)return '<span style="color:var(--text3);font-size:11px">Non évalué</span>';
  const full=Math.floor(score);
  const half=score-full>=0.5;
  let html='';
  for(let i=1;i<=max;i++){
    const filled=i<=full?'#f59e0b':i===full+1&&half?'#fbbf24':'#e2e8f0';
    if(interactive){
      html+=`<svg onclick="${prefix}setScore(${i})" data-star="${i}" style="cursor:pointer;transition:transform .1s" onmouseenter="this.style.transform='scale(1.2)'" onmouseleave="this.style.transform=''" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled}" stroke="${i<=full||(i===full+1&&half)?'#f59e0b':'#d1d5db'}" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
    } else {
      html+=`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled}" stroke="${filled==='#e2e8f0'?'#d1d5db':'#f59e0b'}" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
    }
  }
  return html;
}

            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px">
              ${EVAL_CRITERIA.map(c=>`
              <div style="display:flex;justify-content:space-between;font-size:11px;background:var(--gray50);padding:5px 8px;border-radius:6px">
                <span style="color:var(--text2)">${c.label}</span>

              </div>`).join('')}

        }).join('')}
      </div>`:`<div class="empty-state" style="padding:30px 0"><p>Aucune évaluation pour ce fournisseur</p><span>Soyez le premier à évaluer</span></div>`}
    </div>
  </div>`);
  
  // Init scores object
  window._evalScores={};
  EVAL_CRITERIA.forEach(c=>{window._evalScores[c.id]=0;});
}

function evalSetScore(criteriaId,val){
  window._evalScores=window._evalScores||{};
  window._evalScores[criteriaId]=val;
  const stars=document.querySelectorAll('.eval-star-'+criteriaId);
  stars.forEach((s,i)=>{
    s.setAttribute('fill',i<val?'#f59e0b':'#e2e8f0');
    s.setAttribute('stroke',i<val?'#f59e0b':'#d1d5db');
  });
  const labels={1:'Mauvais',2:'Passable',3:'Correct',4:'Bien',5:'Excellent'};
  const lbl=document.getElementById('score-label-'+criteriaId);
  if(lbl)lbl.textContent=labels[val]||'';
}

function evalHover(criteriaId,val){
  const stars=document.querySelectorAll('.eval-star-'+criteriaId);
  stars.forEach((s,i)=>{s.setAttribute('fill',i<val?'#fbbf24':'#e2e8f0');s.setAttribute('stroke',i<val?'#f59e0b':'#d1d5db');});
}

function evalUnhover(criteriaId){
  const cur=(window._evalScores||{})[criteriaId]||0;
  const stars=document.querySelectorAll('.eval-star-'+criteriaId);
  stars.forEach((s,i)=>{s.setAttribute('fill',i<cur?'#f59e0b':'#e2e8f0');s.setAttribute('stroke',i<cur?'#f59e0b':'#d1d5db');});
}

function saveEval(supplierId){
  const scores={};
  let hasScore=false;
  EVAL_CRITERIA.forEach(c=>{
    scores[c.id]=(window._evalScores||{})[c.id]||0;
    if(scores[c.id]>0)hasScore=true;
  });
  if(!hasScore){showAlert('Veuillez noter au moins un critère','error');return;}
  const comment=document.getElementById('eval-comment')?.value||'';
  const evaluation={
    id:db.nextId('evaluations'),
    supplier_id:supplierId,
    date:fmt.today(),
    by:currentUser?currentUser.name:'',
    scores,comment
  };
  db.save('evaluations',evaluation);
  openEvalModal(supplierId);
  showAlert('Évaluation enregistrée');
}

function deleteEval(evalId,supplierId){
  if(!confirm('Supprimer cette évaluation ?'))return;
  db.delete('evaluations',evalId);
  openEvalModal(supplierId);
  showAlert('Évaluation supprimée');
}

function createBackup(){
  const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','sleeping_roles'];
  const backup={version:'1.0',app:'GestiCommande-RICHBOND',date:new Date().toISOString(),date_fr:fmt.date(fmt.today()),data:{}};
  KEYS.forEach(k=>{backup.data[k]=db.get(k)||[];});
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const ds=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const ts=new Date().toTimeString().slice(0,5).replace(':','h');
  a.download='GestiCommande_backup_'+ds+'_'+ts+'.json';
  a.click();URL.revokeObjectURL(url);
  const now=new Date().toLocaleString('fr-FR');
  localStorage.setItem('gc_last_backup',now);
  const infoEl=document.getElementById('backup-info');
  if(infoEl)infoEl.innerHTML='<span style="color:var(--green);font-weight:600">Sauvegarde créée le '+now+'</span>';
  const lastEl=document.getElementById('last-backup-date');
  if(lastEl)lastEl.textContent=now;
  showAlert('Sauvegarde téléchargée avec succès');
}

function restoreBackup(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const backup=JSON.parse(e.target.result);
      if(!backup.data||!backup.version){showAlert('Fichier invalide','error');return;}
      const d=backup.date_fr||'?';
      const stats=Object.entries(backup.data).map(([k,v])=>''+({orders:'BC',suppliers:'Fournisseurs',articles:'Articles',deliveries:'Livraisons',payments:'Paiements',evaluations:'Évaluations',users:'Utilisateurs'}[k]||k)+': '+(Array.isArray(v)?v.length:'?')).join(' · ');
      const safeBackup=JSON.stringify(backup).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
      showModal(`
      <div class="modal modal-md">
        <div class="modal-header"><span class="modal-title">Confirmer la restauration</span></div>
        <div class="modal-body">
          <div class="alert alert-warning"><strong>Cette action remplace TOUTES vos données actuelles. Elle est irréversible.</strong></div>
          <div style="background:var(--gray50);border-radius:10px;padding:14px;font-size:13px">
            <div style="font-weight:700;margin-bottom:6px">Fichier : ${file.name}</div>
            <div style="color:var(--text3)">Sauvegarde du ${d}</div>
            <div style="margin-top:8px;font-size:12px;color:var(--blue)">${stats}</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
          <button class="btn btn-danger" id="btn-confirm-restore">Oui, restaurer</button>
        </div>
      </div>`);
      // Store backup for confirmation
      window._pendingRestore=backup;
      setTimeout(()=>{
        const btn=document.getElementById('btn-confirm-restore');
        if(btn)btn.onclick=()=>confirmRestore(window._pendingRestore);
      },50);
    }catch(err){showAlert('Erreur lecture : '+err.message,'error');}
  };
  reader.readAsText(file);
  event.target.value='';
}

function confirmRestore(backup){
  try{
    const KEYS=['users','suppliers','articles','orders','deliveries','payments','evaluations','sleeping_roles'];
    KEYS.forEach(k=>{if(backup.data[k]!==undefined)db.set(k,backup.data[k]);});
    closeModal();
    const restored=db.all('users').find(u=>u.id===currentUser.id);
    if(restored){currentUser=restored;sessionStorage.setItem('gc_session',JSON.stringify(restored));}
    showAlert('Données restaurées avec succès !');
    setTimeout(()=>{renderNav();navigate('home');},600);
  }catch(err){closeModal();showAlert('Erreur restauration : '+err.message,'error');}
}

function handleDrop(event,type){
  event.preventDefault();
  document.getElementById('drop-'+type).style.borderColor='var(--gray300)';
  const file=event.dataTransfer.files[0];
  if(file)processExcelFile(file,type);
}

function handleFile(event,type){
  const file=event.target.files[0];
  if(file)processExcelFile(file,type);
}

function processExcelFile(file,type){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:''});
      importData(data,type);
    }catch(err){
      document.getElementById('import-'+type+'-result').innerHTML=`<div class="alert alert-error">Erreur de lecture : ${err.message}</div>`;
    }
  };
  reader.readAsBinaryString(file);
}

function importData(rows,type){
  let count=0,errors=[];
  if(type==='articles'){
    rows.forEach((row,i)=>{
      const designation=(row.designation||row.Désignation||row.DESIGNATION||'').toString().trim();
      if(!designation){errors.push(`Ligne ${i+2}: désignation manquante`);return;}
      // Match supplier by name
      let sup_id=null;
      const supName=(row.fournisseur_nom||row.fournisseur||row.Fournisseur||'').toString().trim();
      if(supName){
        const sup=db.all('suppliers').find(s=>s.name.toLowerCase()===supName.toLowerCase());
        if(sup)sup_id=sup.id;
      }
      const article={
        id:db.nextId('articles'),
        ref:(row.ref||row.Ref||row.REF||'').toString().trim(),
        designation,
        unite:(row.unite||row.Unite||row.Unité||'Pièce').toString().trim(),
        prix:parseFloat(row.prix||row.Prix||row.PRIX||0)||0,
        tva:parseFloat(row.tva||row.TVA||18)||18,
        supplier_id:sup_id
      };
      db.save('articles',article);count++;
    });
  }else if(type==='suppliers'){
    rows.forEach((row,i)=>{
      const fid=(row.fournisseur_id||row['Identifiant fournisseur']||'').toString().trim();
      const name=(row.name||row.Name||row.nom||row['Raison sociale']||'').toString().trim();
      if(!name&&!fid){errors.push(`Ligne ${i+2}: nom et identifiant manquants`);return;}
      const supplier={
        id:db.nextId('suppliers'),
        fournisseur_id:fid||nextFournisseurId(),
        name:name||fid,
        phone:(row.phone||row.telephone||row['Numéro de téléphone']||row['Téléphone']||'').toString().trim(),
        address:(row.address||row.adresse||row['Adresse']||'').toString().trim(),
        compte_contribuable:(row.compte_contribuable||row['N° compte contribuable']||'').toString().trim(),
        regime_imposition:(row.regime_imposition||row["Régime d'imposition"]||'').toString().trim(),
        email:(row.email||row['Adresse mail']||'').toString().trim(),
        situation_geo:(row.situation_geo||row['Situation géographique']||'').toString().trim(),
        conditions:(row.conditions||row['Délai de paiement']||'').toString().trim(),
        activite:(row.activite||row['Activité spécifique']||'').toString().trim(),
        contact:(row.contact||row['Personne ressource']||'').toString().trim(),
      };
      db.save('suppliers',supplier);count++;
    });
  }
  const msg=`<div class="alert alert-success">✓ ${count} ${type==='articles'?'article(s)':'fournisseur(s)'} importé(s) avec succès${errors.length?`<br><span style="color:var(--red-500)">Erreurs: ${errors.join(', ')}</span>`:''}</div>`;
  document.getElementById('import-'+type+'-result').innerHTML=msg;
  if(type==='articles')renderArticles(); else renderSuppliers();
}

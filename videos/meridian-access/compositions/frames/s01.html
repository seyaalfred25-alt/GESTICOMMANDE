  <script>
    (function () {
      const DUR = 9.5;
      // Repères calés sur la voix off (estimations — recalées sur les timings HeyGen).
      const CUE = { mail: 0.9, xls: 2.5, paper: 3.9, chat: 5.5, sat: 6.0, freeze: 7.25,
                    w1: 7.3, w2: 7.5, w3: 7.65, w4: 7.85, cmd: 8.1, qm: 8.45, under: 8.35 };

      // ── utilitaires déterministes ──
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const lin = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      // Ressort amorti en forme fermée (léger dépassement, ζ < 1)
      function spring(dt, w = 13, z = 0.72) {
        if (dt <= 0) return 0;
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
      }
      const $ = (id) => document.getElementById(id);

      // Cartes : position finale dans la pile (repère du conteneur 800×700), rotation, instant d'arrivée
      const cards = [
        { el: $("s01-c-paper"), x: -40, y: 170, r: -7,  t0: CUE.paper, from: -520 },
        { el: $("s01-c-xls"),   x: 360, y: 250, r: 5,   t0: CUE.xls,   from: -420 },
        { el: $("s01-c-mail"),  x: 170, y: 40,  r: -3,  t0: CUE.mail,  from: -380 },
        { el: $("s01-c-chat"),  x: 300, y: 520, r: 4,   t0: CUE.chat,  from: -460 },
        { el: $("s01-x1"),      x: 640, y: -10,  r: 9,   t0: CUE.sat + 0.00, from: -360 },
        { el: $("s01-x2"),      x: -120, y: 420, r: -11, t0: CUE.sat + 0.22, from: -420 },
        { el: $("s01-x3"),      x: 600, y: 400, r: 7,   t0: CUE.sat + 0.42, from: -380 },
        { el: $("s01-x4"),      x: 10,  y: 680, r: -5,  t0: CUE.sat + 0.60, from: -420 },
        { el: $("s01-x5"),      x: 700, y: 650, r: -9,  t0: CUE.sat + 0.76, from: -380 }
      ];
      // ordre d'empilement = ordre d'arrivée
      cards.slice().sort((a, b) => a.t0 - b.t0).forEach((c, i) => { c.el.style.zIndex = 10 + i; });

      const words = ["s01-w1", "s01-w2", "s01-w3", "s01-w4", "s01-w-cmd", "s01-w5"].map($);
      const wordT = [CUE.w1, CUE.w2, CUE.w3, CUE.w4, CUE.cmd, CUE.qm];
      const grid = $("s01-grid"), cam = $("s01-cam"), pile = $("s01-pile"), stage = $("s01-stage");
      const under = $("s01-underline");
      const flux = ["s01-f1", "s01-f2", "s01-f3", "s01-f4"].map($);
      flux.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });

      function render(t) {
        const tf = Math.min(t, CUE.freeze);          // tout se fige à « où en est ma commande ? »
        const frozen = lin(t, CUE.freeze, CUE.freeze + 0.35);

        // grille qui dérive en diagonale (continue, même figée : c'est le décor)
        const g = t * 14;
        grid.style.transform = `translate(${(g % 80).toFixed(2)}px, ${(g % 80).toFixed(2)}px)`;
        // lignes de flux éparses, déconnectées
        flux.forEach((p, i) => {
          const L = +p.dataset.len;
          const k = easeOut(lin(t, 0.2 + i * 0.5, 2.2 + i * 0.5));
          p.style.strokeDashoffset = (L * (1 - k)).toFixed(1);
          p.style.opacity = (0.28 * (1 - 0.6 * frozen)).toFixed(3);
        });

        // caméra : lente poussée + dérive
        const c = easeInOut(lin(tf, 0, CUE.freeze));
        cam.style.transform = `translate(${(-18 * c).toFixed(2)}px, ${(10 * c).toFixed(2)}px) scale(${(1 + 0.07 * c).toFixed(4)})`;

        // la pile penche puis sature (tremblement déterministe croissant)
        const lean = easeInOut(lin(tf, CUE.paper, CUE.freeze));
        const shakeAmp = 2.2 * lin(tf, CUE.sat, CUE.freeze);
        const shake = shakeAmp * Math.sin(tf * 38) * Math.sin(tf * 5.3);
        pile.style.transform = `rotate(${(-6 * lean + shake * 0.25).toFixed(3)}deg) translate(${(shake).toFixed(2)}px, ${(16 * lean).toFixed(2)}px)`;

        cards.forEach((cd) => {
          const dt = tf - cd.t0;
          if (dt <= 0) { cd.el.style.opacity = 0; return; }
          const s = spring(dt, 14, 0.7);
          const y = cd.y + cd.from * (1 - s);
          const r = cd.r * (0.35 + 0.65 * s);
          cd.el.style.opacity = lin(dt, 0, 0.12).toFixed(3);
          cd.el.style.transform = `translate(${cd.x}px, ${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${(1.05 - 0.05 * s).toFixed(4)})`;
        });

        // gel : la pile s'éteint et recule derrière la question
        stage.style.opacity = (1 - 0.72 * frozen).toFixed(3);
        stage.style.filter = frozen > 0 ? `blur(${(6 * frozen).toFixed(2)}px) saturate(${(1 - 0.8 * frozen).toFixed(3)})` : "none";

        // question révélée par masque, mot à mot
        words.forEach((w, i) => {
          const s = spring(t - wordT[i], 15, 0.78);
          w.style.transform = `translateY(${(112 * (1 - s)).toFixed(2)}%)`;
          w.style.opacity = t >= wordT[i] ? 1 : 0;   // invisible tant que le masque ne l'a pas révélé
        });
        const u = easeOut(lin(t, CUE.under, CUE.under + 0.45));
        under.style.transform = `scaleX(${u.toFixed(4)})`;
        under.style.opacity = u > 0 ? 1 : 0;
      }

      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["s01"] = tl;
    })();
  </script>
